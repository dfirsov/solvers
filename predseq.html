<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gentzen's sequent calculus for predicate logic: the four quantifier rules read bottom-up, with eigenvariable conditions on \u2200R and \u2203L and a term of your choosing on \u2200L and \u2203R.">
<title>Predicate Sequent Calculus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F3F4F8;
  --paper:#FFFFFF;
  --soft:#E7EAF2;
  --ink:#171A26;
  --ink-2:#5D6379;
  --ink-3:#8A91A6;
  --line:#D3D7E4;
  --accent:#2E3FA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E4FB;
  --closed:#1F7A5C;
  --closed-soft:#D8EEE5;
  --open:#A46200;
  --open-soft:#FBEEDA;
  --error:#B3261E;
  --error-soft:#FAE0DE;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:"Newsreader", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --paper:#191C29; --soft:#232736;
    --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
    --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
    --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
    --error:#F3897D; --error-soft:#3B1D1A;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111320; --paper:#191C29; --soft:#232736;
  --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
  --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
  --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
  --error:#F3897D; --error-soft:#3B1D1A;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

#app{height:100%; display:flex; flex-direction:column; padding-inline:20px; max-width:1500px; margin:0 auto}

/* ── input row ─────────────────────────────────────────── */
.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.wordmark{font-family:var(--serif); font-size:17px; color:var(--ink-2); white-space:nowrap}
.wordmark span{color:var(--accent)}
.sibling{font-size:12px; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px}
.sibling:hover{color:var(--accent)}
form{display:flex; align-items:center; gap:8px; flex:1; min-width:280px; flex-wrap:wrap}
input[type=text]{
  flex:1; min-width:0; font-family:var(--mono); font-size:15px;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.go{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:7px; padding:8px 16px; font-weight:500;
}
.go:hover{filter:brightness(1.08)}
.link{
  border:0; background:transparent; color:var(--ink-3); padding:6px 4px;
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--ink)}

.pad{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-basis:100%}
.pad button{
  font-family:var(--serif); font-size:17px; line-height:1;
  min-width:36px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s;
}
.pad button:hover{background:var(--soft); border-color:var(--ink-3)}
.pad button:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pad .gap{width:10px}
.padhint{font-size:12px; color:var(--ink-3); margin-left:4px}
.padhint code{font-family:var(--mono); font-size:11.5px}

/* ── rule strips ───────────────────────────────────────── */
.strip{display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap}
.strip.a{padding-block:2px 6px}
.strip.b{padding-block:0 13px; border-bottom:1px solid var(--line)}
.glabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap; flex:none; width:5.6em;
}
.group{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.rule{
  font-family:var(--serif); font-size:15px; line-height:1;
  min-width:40px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s, opacity .1s;
}
.rule:hover{background:var(--soft); border-color:var(--ink-3)}
.rule.armed{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rule.dim{opacity:.32}
.rule.close{border-color:var(--closed); color:var(--closed)}
.rule.close.armed{background:var(--closed); border-color:var(--closed); color:var(--paper)}
.done{
  border:1px solid var(--closed); background:transparent; color:var(--closed);
  border-radius:7px; padding:6px 16px; font-weight:500; flex:none;
}
.done:hover{background:var(--closed-soft)}
.done:disabled{opacity:.4; cursor:not-allowed}
.done:disabled:hover{background:transparent}

/* ── status ────────────────────────────────────────────── */
.status{
  display:flex; align-items:baseline; gap:10px;
  padding-block:11px; min-height:42px; font-size:13.5px; color:var(--ink-2);
}
.status .msg{flex:1}
.status.ok{color:var(--closed)}
.status.err{color:var(--error)}
.status b{font-weight:500; color:var(--ink)}
.status.ok b,.status.err b{color:inherit; font-weight:600}
.status .acts{display:flex; gap:2px; flex:none}
.f{font-family:var(--serif); font-size:15.5px}
.f i{font-style:italic}
.f .op{margin:0 .26em}
.f .op.neg{margin:0 .04em 0 0}
.f .pr{color:var(--ink-3)}
.f .cst{font-style:normal; color:var(--accent)}

/* ── the ask panel ─────────────────────────────────────── */
.ask{
  border:1px solid var(--accent); background:var(--accent-soft);
  border-radius:9px; padding:11px 13px; margin-bottom:14px;
}
.ask p{margin:0 0 9px; font-size:13px}
.ask .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ask input[type=text]{font-size:14px; padding:6px 10px; flex:1; min-width:140px}
.ask .sug{
  font-family:var(--serif); font-size:14.5px; padding:5px 10px; border-radius:6px;
  border:1px solid var(--accent); background:var(--paper); color:var(--ink);
}
.ask .sug:hover{background:var(--accent); color:var(--accent-ink)}
.ask .cancel{border:0; background:transparent; color:var(--ink-3); text-decoration:underline;
             text-underline-offset:3px; font-size:12.5px; padding:5px 2px}

/* ── verdict ───────────────────────────────────────────── */
.out{
  border:1px solid var(--line); background:var(--paper);
  border-radius:9px; padding:13px 15px; margin-bottom:14px;
}
.out .onote{margin:0; font-size:13px; color:var(--ink-2)}
.out .onote + .onote{margin-top:9px; border-top:1px solid var(--line); padding-top:9px}
.out code{font-family:var(--mono); font-size:12px; color:var(--ink)}

/* ── the proof tree ────────────────────────────────────── */
.board{
  flex:1; min-height:0; overflow:auto; margin-bottom:18px;
  padding:26px 22px 30px; background:var(--paper);
  border:1px solid var(--line); border-radius:10px;
  /* Centred both ways. "safe" matters: once a proof is wider or taller than
     the panel, plain centring pushes the overflow off the top-left where it
     cannot be scrolled to, and safe centring falls back to start instead.
     The unprefixed values are the fallback for engines without it. */
  display:flex; flex-direction:column;
  align-items:center;      align-items:safe center;
  justify-content:center;  justify-content:safe center;
}
.pn{display:inline-flex; flex-direction:column; align-items:center; vertical-align:bottom}
.pn-kids{display:flex; align-items:flex-end; gap:34px}
.pn-bar{
  align-self:stretch; height:0; border-top:1.3px solid var(--ink-2);
  margin:6px 0 4px; position:relative;
}
.pn-rule{
  position:absolute; left:100%; top:-8px; padding-left:8px;
  font-family:var(--mono); font-size:10px; color:var(--accent); white-space:nowrap;
}
/* a sequent */
.sq{
  white-space:nowrap; font-family:var(--serif); font-size:16px;
  padding:3px 7px; border-radius:6px; border:1px solid transparent;
}
.sq.leaf{cursor:default}
.sq.cur{border-color:var(--accent); background:var(--accent-soft)}
.sq.ax{border-color:var(--closed); background:var(--closed-soft)}
.sq.stuck{border-color:var(--error); background:var(--error-soft)}
.sq .turn{color:var(--ink-3); margin:0 .5em; font-family:var(--mono); font-size:13px}
.sq .comma{color:var(--ink-3); margin-right:.32em}
.sq .empty{color:var(--ink-3); font-style:italic; font-size:12.5px}
.fm{
  display:inline; border-radius:4px; padding:1px 2px; cursor:pointer;
  font-family:var(--serif); font-size:16px;
}
.fm i{font-style:italic}
.fm .op{margin:0 .24em}
.fm .op.neg{margin:0 .04em 0 0}
.fm .pr{color:var(--ink-3)}
.fm .cst{font-style:normal; color:var(--accent)}
.sq.leaf .fm:hover{background:var(--soft)}
.sq .fm.sel{background:var(--accent); color:var(--accent-ink)}
.sq .fm.sel .pr,.sq .fm.sel .cst,.sq .fm.sel .op{color:var(--accent-ink)}
.sq .fm.twin{box-shadow:inset 0 0 0 1px var(--closed)}
.sq.settled .fm{cursor:default}
.tick{
  font-family:var(--mono); font-size:10px; margin-left:9px; letter-spacing:.06em;
}
.tick.ax{color:var(--closed)}
.tick.stuck{color:var(--error)}

@media (max-width:820px){
  #app{height:auto; min-height:100%; padding-inline:16px}
  .board{min-height:420px}
  .wordmark{display:none}
  .glabel{width:auto}
  .pad button{min-width:34px; padding:6px 7px; font-size:16px}
  .padhint{flex-basis:100%; margin:2px 0 0}
}
.theme{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-2);
  border-radius:6px; padding:3px 9px; font-size:14px; line-height:1.35;
  cursor:pointer; flex:none;
}
.theme:hover{border-color:var(--accent); color:var(--accent)}
.rsep{width:1px; align-self:stretch; min-height:18px; background:var(--line); margin-inline:5px; flex:none}
</style>
<script>
/* stamp the saved theme before anything paints, so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("logic.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>

<body>
<div id="app">
  <div class="top">
    <span class="wordmark"><span>⇒</span> PRED SEQUENT</span>
    <a class="sibling" href="index.html">← All solvers</a>
    <button class="theme" id="themeBtn" type="button">◐</button>
    <form id="entry">
      <input type="text" id="formula" spellcheck="false" autocomplete="off"
             aria-label="Sequent" value="|- forall x p(x) -> forall x p(f(x))">
      <button type="submit" class="go">Start</button>
      <div class="pad" id="pad" role="group" aria-label="Insert a connective">
        <button type="button" data-sym="¬" aria-label="Insert negation" title="negation — also typed as ~ or !">¬</button>
        <button type="button" data-sym="∧" aria-label="Insert conjunction" title="conjunction — also typed as &amp; or /\">∧</button>
        <button type="button" data-sym="∨" aria-label="Insert disjunction" title="disjunction — also typed as | or \/">∨</button>
        <button type="button" data-sym="⊃" aria-label="Insert implication" title="implication — also typed as -&gt;, =&gt; or →">⊃</button>
        <button type="button" data-sym="≡" aria-label="Insert biconditional" title="biconditional — also typed as &lt;-&gt;, &lt;=&gt; or ↔">≡</button>
        <span class="gap"></span>
        <button type="button" data-sym="∀" aria-label="Insert universal quantifier" title="for all — also typed as forall or all">∀</button>
        <button type="button" data-sym="∃" aria-label="Insert existential quantifier" title="there exists — also typed as exists or some">∃</button>
        <button type="button" data-sym="(" aria-label="Insert opening bracket">(</button>
        <button type="button" data-sym=")" aria-label="Insert closing bracket">)</button>
        <button type="button" data-sym="⊢" aria-label="Insert turnstile" title="turnstile — also typed as |-">⊢</button>
        <span class="padhint">commas on <em>both</em> sides; <code>p(…)</code> is a predicate, <code>f(…)</code> in the brackets a function; a quantifier reaches over one unit</span>
      </div>
    </form>
  </div>

  <div class="strip a">
    <span class="glabel" title="Rules acting on a formula left of the turnstile">Left</span>
    <div class="group" id="leftRules"></div>
  </div>
  <div class="strip b">
    <span class="glabel" title="Rules acting on a formula right of the turnstile">Right</span>
    <div class="group" id="rightRules"></div>
    <div class="group" id="closeRules"></div>
    <button class="done" id="doneBtn" disabled>Done</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="msg"></span>
    <span class="acts">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="reset">Restart</button>
    </span>
  </div>

  <div class="ask" id="ask" hidden></div>
  <div class="out" id="out" hidden></div>
  <div class="board" id="board"></div>
</div>

<script>
"use strict";

/* ═════════════════════════════════════════════ logging */
/* One line per formula submitted: someone types a formula, presses the button,
   and that is recorded. Nothing else is — no rule steps, no verdicts, no page
   views. Posts to the host that served this page, same origin; a failure is
   swallowed, so logging can never break the tool. LOG_URL = "" switches it off. */
var LOG_URL = "log.php";
var LOG_PAGE = "predseq";
var LOG_READY = false;      /* the formula a page loads with is not a submission */

function logFormula(data){
  if (!LOG_URL) return;
  try {
    var ev = {t:new Date().toISOString(), p:LOG_PAGE};
    Object.keys(data).forEach(function(k){
      var v = data[k];
      ev[k] = (typeof v === "string" && v.length > 300) ? v.slice(0, 300) : v;
    });
    var body = JSON.stringify([ev]);
    if (navigator.sendBeacon &&
        navigator.sendBeacon(LOG_URL, new Blob([body], {type:"application/json"}))) return;
    fetch(LOG_URL, {method:"POST", body:body, keepalive:true,
                    headers:{"Content-Type":"application/json"}}).catch(function(){});
  } catch (e){}
}

/* ═════════════════════════════════════════════ formulas */
/* First order with function symbols. Nothing is decided by the case of a
   name — `p(x)` and `P(x)` are both predicates, `f(a)` and `F(a)` both terms.
   What decides is where the name stands: at a formula position it is a
   predicate, inside a term's brackets it is a function, and a bare name is a
   propositional letter or a constant by the same test. Whether a term name is
   a variable or a constant is likewise not spelled: it is a variable exactly
   when a quantifier binds it, which is how a logician reads it. */
var OPCH = {and:"∧", or:"∨", imp:"⊃", iff:"≡"};
var QCH = {all:"∀", ex:"∃"};

function tm(n, args){ return {k:"tm", n:n, args:args || []}; }
function pred(n, args){ return {k:"pred", n:n, args:args || []}; }

function show(g, esc, wrap, neg, opw, cst, prd, qnt, trm){
  cst = cst || function(t){ return t; };
  trm = trm || function(n, as){ return n + (as.length ? "(" + as.join(",") + ")" : ""); };
  function term(t){ return trm(t.n, t.args.map(term), t.args.length === 0); }
  /* A quantifier reaches over exactly one unit, so it never needs brackets of
     its own: ∃x p(x) ∨ ∃x q(x) is two scopes, and a wider one shows as the
     brackets round its body — ∃x (p(x) ∨ q(x)). pk === null is that body. */
  function needs(c, pk, left){
    if (c.k === "pred" || c.k === "not" || c.k === "top" || c.k === "bot") return false;
    if (c.k === "all" || c.k === "ex") return false;
    if (pk === null || pk === "not") return true;
    if ((pk === "and" || pk === "or") && c.k === pk && left) return false;
    return true;
  }
  function go(h, pk, left){ var s = body(h); return needs(h, pk, left) ? wrap(s) : s; }
  function body(h){
    if (h.k === "pred") return prd(h.n, h.args.map(term));
    if (h.k === "top") return cst("⊤");
    if (h.k === "bot") return cst("⊥");
    if (h.k === "not") return neg() + go(h.a, "not", false);
    if (h.k === "all" || h.k === "ex") return qnt(QCH[h.k], h.v) + go(h.a, null, false);
    return go(h.a, h.k, true) + opw(OPCH[h.k]) + go(h.b, h.k, false);
  }
  return body(g);
}
function fmtHTML(g){
  return show(g,
    null,
    function(s){ return '<span class="pr">(</span>' + s + '<span class="pr">)</span>'; },
    function(){ return '<span class="op neg">¬</span>'; },
    function(o){ return '<span class="op">' + o + "</span>"; },
    function(t){ return '<span class="cst">' + t + "</span>"; },
    function(n, as){
      return "<b>" + n + "</b>" + (as.length ? '<span class="pr">(</span>' +
        as.join('<span class="pr">,</span>') + '<span class="pr">)</span>' : "");
    },
    /* a space after the bound variable: ∀x p(x) reads back, ∀xp(x) does not */
    function(q, v){ return '<span class="qu">' + q + "</span><i>" + v + "</i>&thinsp;"; },
    function(n, as, bare){
      return bare ? "<i>" + n + "</i>"
                  : "<i>" + n + "</i>" + '<span class="pr">(</span>' +
                    as.join('<span class="pr">,</span>') + '<span class="pr">)</span>';
    });
}
function fmtText(g){
  return show(g, null, function(s){ return "(" + s + ")"; },
    function(){ return "¬"; }, function(o){ return o; }, function(t){ return t; },
    function(n, as){ return n + (as.length ? "(" + as.join(",") + ")" : ""); },
    function(q, v){ return q + v + " "; },
    function(n, as){ return n + (as.length ? "(" + as.join(",") + ")" : ""); });
}
function fmtTerm(t){ return t.n + (t.args.length ? "(" + t.args.map(fmtTerm).join(",") + ")" : ""); }
function termHTML(t){
  return "<i>" + t.n + "</i>" + (t.args.length ? '<span class="pr">(</span>' +
    t.args.map(termHTML).join('<span class="pr">,</span>') + '<span class="pr">)</span>' : "");
}

/* ── binding ── */
/* A name is free when no quantifier above it binds it. With function symbols
   a name can sit any depth down inside a term, so both walks recurse. */
function freeInT(t, out, bound){
  if (!t.args.length){
    if (bound.indexOf(t.n) < 0 && out.indexOf(t.n) < 0) out.push(t.n);
    return out;
  }
  t.args.forEach(function(a){ freeInT(a, out, bound); });
  return out;
}
function freeIn(g, out, bound){
  out = out || []; bound = bound || [];
  if (g.k === "pred"){
    g.args.forEach(function(t){ freeInT(t, out, bound); });
    return out;
  }
  if (g.k === "top" || g.k === "bot") return out;
  if (g.k === "not") return freeIn(g.a, out, bound);
  if (g.k === "all" || g.k === "ex") return freeIn(g.a, out, bound.concat([g.v]));
  freeIn(g.a, out, bound); freeIn(g.b, out, bound);
  return out;
}
/* every name written anywhere, bound variables and function symbols included */
function namesInT(t, out){
  if (out.indexOf(t.n) < 0) out.push(t.n);
  t.args.forEach(function(a){ namesInT(a, out); });
  return out;
}
function namesIn(g, out){
  out = out || [];
  if (g.k === "pred"){ g.args.forEach(function(t){ namesInT(t, out); }); return out; }
  if (g.k === "top" || g.k === "bot") return out;
  if (g.k === "not") return namesIn(g.a, out);
  if (g.k === "all" || g.k === "ex"){
    if (out.indexOf(g.v) < 0) out.push(g.v);
    return namesIn(g.a, out);
  }
  namesIn(g.a, out); namesIn(g.b, out);
  return out;
}
function fresh(avoid, hint){
  var base = hint || "a";
  for (var i = 0; i < 400; i++){
    var n = i === 0 ? base : base + (i + 1);
    if (avoid.indexOf(n) < 0) return n;
  }
  return base + "_" + Math.random().toString(36).slice(2, 5);
}

/* ── substitution ── */
/* Replaces a variable by a whole term, so ∀x p(x) can be instantiated at
   f(f(a)) and not only at a name. A binder in the way is renamed rather than
   allowed to capture a variable the incoming term carries. */
function substT(t, x, s){
  if (!t.args.length) return t.n === x ? s : t;
  return tm(t.n, t.args.map(function(a){ return substT(a, x, s); }));
}
function subst(g, x, s){
  if (g.k === "pred") return pred(g.n, g.args.map(function(t){ return substT(t, x, s); }));
  if (g.k === "top" || g.k === "bot") return g;
  if (g.k === "not") return {k:"not", a:subst(g.a, x, s)};
  if (g.k === "all" || g.k === "ex"){
    if (g.v === x) return g;                            /* shadowed: nothing free to replace */
    if (freeInT(s, [], []).indexOf(g.v) >= 0){          /* would capture — rename the binder */
      var v2 = fresh(namesIn(g).concat(namesInT(s, [])).concat([x]), g.v);
      return {k:g.k, v:v2, a:subst(subst(g.a, g.v, tm(v2)), x, s)};
    }
    return {k:g.k, v:g.v, a:subst(g.a, x, s)};
  }
  return {k:g.k, a:subst(g.a, x, s), b:subst(g.b, x, s)};
}

/* ── equality up to the names of bound variables ── */
function eqT(a, b, la, lb){
  if (a.args.length !== b.args.length) return false;
  if (!a.args.length){
    var ia = la.indexOf(a.n), ib = lb.indexOf(b.n);
    return ia < 0 && ib < 0 ? a.n === b.n : ia === ib;
  }
  if (a.n !== b.n) return false;
  return a.args.every(function(t, i){ return eqT(t, b.args[i], la, lb); });
}
function eqF(a, b, la, lb){
  la = la || []; lb = lb || [];
  if (a.k !== b.k) return false;
  if (a.k === "pred"){
    if (a.n !== b.n || a.args.length !== b.args.length) return false;
    return a.args.every(function(t, i){ return eqT(t, b.args[i], la, lb); });
  }
  if (a.k === "top" || a.k === "bot") return true;
  if (a.k === "not") return eqF(a.a, b.a, la, lb);
  if (a.k === "all" || a.k === "ex")
    return eqF(a.a, b.a, [a.v].concat(la), [b.v].concat(lb));
  return eqF(a.a, b.a, la, lb) && eqF(a.b, b.b, la, lb);
}

/* ── the inverse question: is F the instance A[t/x], and if so at which t? ── */
/* Enumerating candidate terms is hopeless once there are function symbols —
   there are infinitely many — so this matches the two formulas against each
   other instead and reads the witness off wherever x stood. Returns the term,
   or true when x does not occur and any term would do, or null for no match. */
function matchInst(A, x, F, la, lb){
  var found = null, ok = true;
  function failT(){ ok = false; }
  function mT(a, b, la, lb){
    if (!ok) return;
    if (!a.args.length && a.n === x && la.indexOf(x) < 0){
      /* b must not use a variable bound inside A, or it could not have come
         from substituting a term written outside */
      if (namesInT(b, []).some(function(n){ return lb.indexOf(n) >= 0; })) return failT();
      if (found === null) found = b;
      else if (!eqT(found, b, [], [])) return failT();
      return;
    }
    if (a.args.length !== b.args.length) return failT();
    if (!a.args.length){
      var ia = la.indexOf(a.n), ib = lb.indexOf(b.n);
      if (!(ia < 0 && ib < 0 ? a.n === b.n : ia === ib)) return failT();
      return;
    }
    if (a.n !== b.n) return failT();
    a.args.forEach(function(t, i){ mT(t, b.args[i], la, lb); });
  }
  function mF(a, b, la, lb){
    if (!ok) return;
    if (a.k !== b.k) return failT();
    if (a.k === "pred"){
      if (a.n !== b.n || a.args.length !== b.args.length) return failT();
      a.args.forEach(function(t, i){ mT(t, b.args[i], la, lb); });
      return;
    }
    if (a.k === "top" || a.k === "bot") return;
    if (a.k === "not") return mF(a.a, b.a, la, lb);
    if (a.k === "all" || a.k === "ex")
      return mF(a.a, b.a, [a.v].concat(la), [b.v].concat(lb));
    mF(a.a, b.a, la, lb); mF(a.b, b.b, la, lb);
  }
  mF(A, F, la || [], lb || []);
  if (!ok) return null;
  return found === null ? true : found;
}

var BOT = {k:"bot"}, TOP = {k:"top"};

function imp(a, b){ return {k:"imp", a:a, b:b}; }
/* ═════════════════════════════════════════════ parser */
var SYMS = [
  ["<->","iff"], ["<=>","iff"], ["↔","iff"], ["≡","iff"], ["==","iff"],
  ["->","imp"], ["=>","imp"], ["→","imp"], ["⊃","imp"], ["⇒","imp"],
  ["/\\","and"], ["&&","and"], ["&","and"], ["∧","and"], ["·","and"],
  ["\\/","or"], ["||","or"], ["|","or"], ["∨","or"], ["+","or"],
  ["~","not"], ["!","not"], ["¬","not"], ["-","not"],
  ["⊤","top"], ["⊥","bot"], ["1","top"], ["0","bot"],
  ["∀","all"], ["∃","ex"],
  ["(","lp"], ["[","lp"], [")","rp"], ["]","rp"], [",","comma"], [".","dot"]

var WORDS = {forall:"all", all:"all", exists:"ex", some:"ex", "∀":"all", "∃":"ex"};

function tokenize(src){

  t.push({t:"end", v:"", i:src.length});

}

  function or(){ var l = and(); while (peek() === "or"){ p++; l = {k:"or", a:l, b:and()}; } return l; }
  function and(){ var l = un(); while (peek() === "and"){ p++; l = {k:"and", a:l, b:un()}; } return l; }

  function term(){

    if (!eat("lp")) return tm(n.v, []);

    return tm(n.v, args);

      if (peek() === "lp" && t[p].i === v.end)

          v.v + " itself. Put a space or a dot in: ∀" + v.v[0] + " " + v.v.slice(1) + "(…).");

         meant to be read. The dot widens the scope to everything that follows,
         so ∀x. p(x) ⊃ q(x) is ∀x (p(x) ⊃ q(x)). Brackets always decide. */
      return {k:q, v:v.v, a:eat("dot") ? iff() : un()};

    var a = eat("name");
    if (a){

      var args = [term()];
      while (eat("comma")) args.push(term());
      if (!eat("rp")) throw new Error("The brackets after “" + a.v + "” are never closed.");
      return pred(a.v, args);
    }
    if (peek() === "rp") throw new Error("There is a “)” with no “(” to match it.");
    if (peek() === "end") throw new Error("The formula stops early — something is missing after the last connective.");
    throw new Error("Expected a predicate or “(” at position " + (t[p].i + 1) + ", found “" + t[p].v + "”.");
  }
  var f = iff();
  if (peek() !== "end") throw new Error("Unexpected “" + t[p].v + "” at position " + (t[p].i + 1) + " — is a connective missing?");

}
/* a term on its own, for the ∀E and ∃I prompts */
function parseTerm(src){
  var t = tokenize(src), p = 0;
  function go(){
    if (t[p].t !== "name") throw new Error("A term is a name, or a name applied to terms like f(x) — not “" +
      (t[p].v || "nothing") + "”.");
    var n = t[p++];
    if (t[p].t !== "lp") return tm(n.v, []);
    p++;
    var args = [go()];
    while (t[p].t === "comma"){ p++; args.push(go()); }
    if (t[p].t !== "rp") throw new Error("The brackets after “" + n.v + "” are never closed.");
    p++;
    return tm(n.v, args);
  }
  var r = go();
  if (t[p].t !== "end") throw new Error("“" + src.trim() + "” is more than one term.");
  return r;
}

/* Every name is used in one role at one arity throughout: a predicate stays a
   predicate, a function stays a function, and neither changes how many
   arguments it takes. Catching this here is what keeps p(x) and p(x,y) in the
   same sequent from quietly meaning two different things. */
function checkArity(fs){
  var role = {}, ar = {};
  function fix(n, r, k, where){
    if (role[n] === undefined){ role[n] = r; ar[n] = k; return; }
    if (role[n] !== r)
      throw new Error("“" + n + "” is used as a " + role[n] + " in one place and as a " + r +
        " in another. Each name has one job: predicates stand where a formula does, " +
        "function symbols and constants stand inside the brackets.");
    if (ar[n] !== k)
      throw new Error("“" + n + "” is used with " + ar[n] + " argument" + (ar[n] === 1 ? "" : "s") +
        " in one place and " + k + " in another. A " + r + " keeps one arity throughout.");
  }
  function walkT(t, bound){
    if (!t.args.length){
      if (bound.indexOf(t.n) < 0) fix(t.n, "constant or function symbol", 0);
      return;
    }
    if (bound.indexOf(t.n) >= 0)
      throw new Error("“" + t.n + "” is a bound variable, so it cannot be applied to arguments.");
    fix(t.n, "constant or function symbol", t.args.length);
    t.args.forEach(function(x){ walkT(x, bound); });
  }
  function walk(g, bound){
    if (g.k === "pred"){
      fix(g.n, "predicate", g.args.length);
      g.args.forEach(function(t){ walkT(t, bound); });
      return;
    }
    if (g.k === "top" || g.k === "bot") return;
    if (g.k === "not") return walk(g.a, bound);
    if (g.k === "all" || g.k === "ex") return walk(g.a, bound.concat([g.v]));
    walk(g.a, bound); walk(g.b, bound);
  }
  fs.forEach(function(f){ walk(f, []); });
  return {role:role, ar:ar};
}
/* ═════════════════════════════════════════════ small models */
/* Validity is undecidable here, so nothing can confirm a sequent is provable.
   A countermodel in a small domain is still decisive the other way, and that
   is worth having: it is what turns "I cannot find a proof" into "there is
   none". Domains up to MAXDOM elements; every interpretation of every
   predicate and every function symbol is tried, within a budget. */
var MAXDOM = 3;
var MAXTRIES = 400000;

function signature(fs){
  var preds = {}, funcs = {};

    if (!t.args.length){ if (bound.indexOf(t.n) < 0) funcs[t.n] = 0; return; }
    funcs[t.n] = t.args.length;
    t.args.forEach(function(x){ walkT(x, bound); });
  }
  function walk(g, bound){
    if (g.k === "pred"){
      preds[g.n] = g.args.length;
      g.args.forEach(function(t){ walkT(t, bound); });
      return;
    }
    if (g.k === "top" || g.k === "bot") return;
    if (g.k === "not") return walk(g.a, bound);
    if (g.k === "all" || g.k === "ex") return walk(g.a, bound.concat([g.v]));
    walk(g.a, bound); walk(g.b, bound);
  }
  fs.forEach(function(f){ walk(f, []); });
  return {preds:preds, funcs:funcs};
}
/* a term's value: look a variable up in the assignment, otherwise apply the
   function symbol's table to the values of its arguments */
function evalT(t, M, env){
  if (!t.args.length && env[t.n] !== undefined) return env[t.n];
  var idx = 0;
  for (var i = 0; i < t.args.length; i++) idx = idx * M.n + evalT(t.args[i], M, env);
  return M.F[t.n][idx];
}
function holdsIn(g, M, env){
  switch (g.k){
    case "pred": {
      var idx = 0;
      for (var i = 0; i < g.args.length; i++) idx = idx * M.n + evalT(g.args[i], M, env);
      return !!M.I[g.n][idx];
    }
    case "top": return true;
    case "bot": return false;
    case "not": return !holdsIn(g.a, M, env);
    case "and": return holdsIn(g.a, M, env) && holdsIn(g.b, M, env);
    case "or":  return holdsIn(g.a, M, env) || holdsIn(g.b, M, env);
    case "imp": return !holdsIn(g.a, M, env) || holdsIn(g.b, M, env);
    case "iff": return holdsIn(g.a, M, env) === holdsIn(g.b, M, env);
    case "all": case "ex": {

      for (var d = 0; d < M.n; d++){

/* Every interpretation is a reading of one counter: each predicate table is a

  var fs = prems.concat([concl]), sig = signature(fs);
  var pnames = Object.keys(sig.preds), fnames = Object.keys(sig.funcs);
  for (var n = 1; n <= MAXDOM; n++){
    var slots = [];                                  /* {name, kind, size, base} */
    var total = 1, over = false;
    pnames.forEach(function(q){
      var sz = Math.pow(n, sig.preds[q]);
      slots.push({name:q, kind:"P", size:sz, base:2});
      total *= Math.pow(2, sz);
      if (total > MAXTRIES) over = true;
    });
    fnames.forEach(function(q){
      var sz = Math.pow(n, sig.funcs[q]);
      slots.push({name:q, kind:"F", size:sz, base:n});
      total *= Math.pow(n, sz);
      if (total > MAXTRIES) over = true;
    });
    if (over) break;
    for (var c = 0; c < total; c++){
      var rest = c, I = {}, F = {}, bad = false;
      for (var si = 0; si < slots.length; si++){
        var sl = slots[si], arr = [];
        for (var b = 0; b < sl.size; b++){ arr.push(rest % sl.base); rest = Math.floor(rest / sl.base); }
        if (sl.kind === "P") I[sl.name] = arr; else F[sl.name] = arr;
      }
      var M = {n:n, I:I, F:F, preds:sig.preds, funcs:sig.funcs};
      if (prems.every(function(f){ return holdsIn(f, M, {}); }) && !holdsIn(concl, M, {})) return M;
    }
  }
  return null;
}
function modelText(M){
  var dom = [];
  for (var i = 0; i < M.n; i++) dom.push(i + 1);
  var bits = ["a domain of " + M.n + " (" + dom.join(", ") + ")"];
  function tuples(ar){
    var out = [[]];
    for (var d = 0; d < ar; d++){
      var next = [];
      out.forEach(function(t){ for (var v = 0; v < M.n; v++) next.push(t.concat([v])); });
      out = next;
    }
    return out;
  }
  Object.keys(M.funcs).forEach(function(q){
    var ar = M.funcs[q];
    if (!ar){ bits.push("<i>" + q + "</i> = " + (M.F[q][0] + 1)); return; }
    bits.push("<i>" + q + "</i> sends " + tuples(ar).map(function(t, idx){
      return (ar === 1 ? t[0] + 1 : "(" + t.map(function(v){ return v + 1; }).join(",") + ")") +
             " to " + (M.F[q][idx] + 1);
    }).join(", "));
  });

    var ar = M.preds[q], holds = [];
    if (!ar){ bits.push("<b>" + q + "</b> is " + (M.I[q][0] ? "true" : "false")); return; }
    tuples(ar).forEach(function(t, idx){
      if (!M.I[q][idx]) return;
      holds.push(ar === 1 ? String(t[0] + 1) : "(" + t.map(function(v){ return v + 1; }).join(",") + ")");
    });
    bits.push("<b>" + q + "</b> holds of " + (holds.length ? holds.join(", ") : "nothing"));
  });

/* ═════════════════════════════════════════════ sequents */
/* Sides are multisets, so duplicates are dropped as they arise — contraction,
   done silently. Equality is up to the names of bound variables, so ∀x p(x)
   and ∀y p(y) count as the same formula. */
function addTo(list, fs){
  var out = list.slice();
  fs.forEach(function(f){
    if (!out.some(function(x){ return eqF(x, f); })) out.push(f);

}
function without(list, i){ return list.slice(0, i).concat(list.slice(i + 1)); }
function replaceWith(list, i, fs){ return addTo(without(list, i), fs); }
function seqText(L, R){
  return L.map(fmtText).join(", ") + " ⊢ " + R.map(fmtText).join(", ");

/* "A, B |- C, D" — commas on both sides, either side may be empty */
function parseSequent(src){
  var parts = src.split(/⊢|\|-|→/);
  if (parts.length > 2) throw new Error("Only one ⊢ please — antecedents on the left, succedents on the right.");
  var left = parts.length === 2 ? parts[0] : "", right = parts.length === 2 ? parts[1] : parts[0];

    var out = [], depth = 0, cur = "";
    for (var i = 0; i < s.length; i++){

      if (c === ")" || c === "]") depth--;

      cur += c;

    out.push(cur);

  if (!L.length && !R.length) throw new Error("Nothing to prove — put a formula on one side of the ⊢.");
  checkArity(L.concat(R));
  return {L:L, R:R};
}

/* ═════════════════════════════════════════════ the rules */
/* Every rule is read bottom-up: it takes the sequent at the node and hands
   back the premises that have to be proved above it.

   The propositional rules replace their principal formula by strict
   subformulas, which is why the propositional search terminates. The
   quantifier rules do not all do that. ∀L and ∃R instantiate at a term of
   your choosing and *keep* the formula they came from — the lecture writes
   that copy in brackets, (∀x A, ), because keeping it is optional, and the
   tool keeps it because that is what lets you instantiate the same
   quantifier twice. ⊢ ∃x (p(x) ⊃ ∀x p(x)) needs exactly that. The price is
   that bottom-up search no longer has to terminate, and first-order validity
   is undecidable, so this page cannot tell you in advance. */
var RULES = [
  {code:"∧L", lbl:"∧L", side:"L", k:"and", law:"A ∧ B on the left splits into A and B — one premise",
   go:function(n, i, F){ return [{L:replaceWith(n.L, i, [F.a, F.b]), R:n.R}]; }},
  {code:"∨L", lbl:"∨L", side:"L", k:"or", law:"A ∨ B on the left branches: prove it from A, and again from B",
   go:function(n, i, F){ return [{L:replaceWith(n.L, i, [F.a]), R:n.R},
                                 {L:replaceWith(n.L, i, [F.b]), R:n.R}]; }},
  {code:"⊃L", lbl:"⊃L", side:"L", k:"imp", law:"A ⊃ B on the left branches: give up A on the right, or take B on the left",
   go:function(n, i, F){ return [{L:without(n.L, i), R:addTo(n.R, [F.a])},

  {code:"¬L", lbl:"¬L", side:"L", k:"not", law:"¬A on the left sends A to the right",

  {code:"≡L", lbl:"≡L", side:"L", k:"iff", law:"A ≡ B on the left: either both hold, or neither does",

  {code:"⊤L", lbl:"⊤L", side:"L", k:"top", law:"⊤ on the left tells you nothing — drop it",

  {code:"∀L", lbl:"∀L", side:"L", k:"all", term:true,
   law:"∀x A on the left gives you A[t/x] for any term t you name, and the ∀ stays for another go",
   go:function(n, i, F, t){ return [{L:addTo(n.L, [subst(F.a, F.v, t)]), R:n.R}]; }},
  {code:"∃L", lbl:"∃L", side:"L", k:"ex", eigen:true,
   law:"∃x A on the left: name the thing, with a parameter fresh to the whole sequent",
   go:function(n, i, F, t){ return [{L:replaceWith(n.L, i, [subst(F.a, F.v, t)]), R:n.R}]; }},

  {code:"∧R", lbl:"∧R", side:"R", k:"and", law:"A ∧ B on the right branches: prove A, and prove B",
   go:function(n, i, F){ return [{L:n.L, R:replaceWith(n.R, i, [F.a])},
                                 {L:n.L, R:replaceWith(n.R, i, [F.b])}]; }},
  {code:"∨R", lbl:"∨R", side:"R", k:"or", law:"A ∨ B on the right splits into A and B — one premise",
   go:function(n, i, F){ return [{L:n.L, R:replaceWith(n.R, i, [F.a, F.b])}]; }},
  {code:"⊃R", lbl:"⊃R", side:"R", k:"imp", law:"A ⊃ B on the right moves A to the left and keeps B",
   go:function(n, i, F){ return [{L:addTo(n.L, [F.a]), R:replaceWith(n.R, i, [F.b])}]; }},
  {code:"¬R", lbl:"¬R", side:"R", k:"not", law:"¬A on the right sends A to the left",
   go:function(n, i, F){ return [{L:addTo(n.L, [F.a]), R:without(n.R, i)}]; }},
  {code:"≡R", lbl:"≡R", side:"R", k:"iff", law:"A ≡ B on the right: prove each side from the other",
   go:function(n, i, F){ return [{L:addTo(n.L, [F.a]), R:replaceWith(n.R, i, [F.b])},
                                 {L:addTo(n.L, [F.b]), R:replaceWith(n.R, i, [F.a])}]; }},
  {code:"⊥R", lbl:"⊥R", side:"R", k:"bot", law:"⊥ on the right offers nothing — drop it",
   go:function(n, i){ return [{L:n.L, R:without(n.R, i)}]; }},
  {code:"∀R", lbl:"∀R", side:"R", k:"all", eigen:true,
   law:"∀x A on the right: prove it of a parameter fresh to the whole sequent",
   go:function(n, i, F, t){ return [{L:n.L, R:replaceWith(n.R, i, [subst(F.a, F.v, t)])}]; }},
  {code:"∃R", lbl:"∃R", side:"R", k:"ex", term:true,
   law:"∃x A on the right: name a witness t, and the ∃ stays for another go",
   go:function(n, i, F, t){ return [{L:n.L, R:addTo(n.R, [subst(F.a, F.v, t)])}]; }}
];
function ruleFor(side, f){
  return RULES.filter(function(r){ return r.side === side && r.k === f.k; })[0];
}
var CLOSERS = [
  {code:"Ax", lbl:"Ax", law:"the same formula stands on both sides — nothing left to prove"},
  {code:"⊥L", lbl:"⊥L", law:"⊥ among the antecedents: they cannot all hold"},
  {code:"⊤R", lbl:"⊤R", law:"⊤ among the succedents: one of them holds outright"}
];

/* ═════════════════════════════════════════════ proof tree */
function newProof(){ return {nodes:{}, next:1, root:null, params:[]}; }
function mk(P, L, R){
  var id = P.next++;
  P.nodes[id] = {id:id, L:L, R:R, rule:null, kids:[], pr:null, par:null};
  return id;
}
function openLeaves(P, id, out){
  out = out || [];
  var n = P.nodes[id];
  if (n.rule === null){ out.push(id); return out; }
  n.kids.forEach(function(k){ openLeaves(P, k, out); });
  return out;
}
function allNodes(P, id, out){
  out = out || [];
  out.push(id);
  P.nodes[id].kids.forEach(function(k){ allNodes(P, k, out); });
  return out;
}
function usesRule(P, id, code){
  var n = P.nodes[id];
  if (n.rule === code) return true;
  return n.kids.some(function(k){ return usesRule(P, k, code); });
}
function countRules(P, id){
  var n = P.nodes[id];
  return (n.rule ? 1 : 0) + n.kids.reduce(function(a, k){ return a + countRules(P, k); }, 0);
}

/* ── closing and running dry ── */
function axiomPair(n){
  for (var i = 0; i < n.L.length; i++){
    for (var j = 0; j < n.R.length; j++){
      if (eqF(n.L[i], n.R[j])) return {i:i, j:j};
    }
  }
  return null;
}
function hasBot(n){ return n.L.some(function(f){ return f.k === "bot"; }); }
function hasTop(n){ return n.R.some(function(f){ return f.k === "top"; }); }
function canClose(n){ return !!axiomPair(n) || hasBot(n) || hasTop(n); }
function atomicOnly(n){
  return n.L.concat(n.R).every(function(f){ return f.k === "pred"; });
}
/* A leaf of bare atoms with nothing in common has no rule left — but unlike
   the propositional page that is not a verdict. A ∀L lower down might have
   wanted a different term, so the branch being dry says the *route* failed,
   not that the sequent is invalid. The small-model search is what settles it. */
function isDry(n){ return n.rule === null && atomicOnly(n) && !canClose(n); }

/* ═════════════════════════════════════════════ parameters and terms */
/* Every name the proof has met, so a parameter can dodge all of them. */
function allSymbols(){
  var P = S.P, out = [];
  if (!P) return out;
  Object.keys(P.nodes).forEach(function(k){
    var n = P.nodes[k];
    n.L.concat(n.R).forEach(function(f){
      namesIn(f, out);
      var sig = signature([f]);
      Object.keys(sig.preds).forEach(function(x){ if (out.indexOf(x) < 0) out.push(x); });
      Object.keys(sig.funcs).forEach(function(x){ if (out.indexOf(x) < 0) out.push(x); });
    });
  });
  P.params.forEach(function(p){ if (out.indexOf(p) < 0) out.push(p); });
  return out;
}
/* The handout names its eigenvariables after the variable they stand for —
   x becomes x′ — which reads far better than a fresh letter from nowhere. */
function freshParam(base){
  var avoid = allSymbols();
  for (var i = 1; i <= 3; i++){
    var n = base + new Array(i + 1).join("'");
    if (avoid.indexOf(n) < 0) return n;
  }
  return fresh(avoid, base);
}
/* the free names a term may be built from, and the function symbols in play */
function knownFuncs(){
  var P = S.P, out = {};
  function walkT(t, bound){
    if (bound.indexOf(t.n) < 0) out[t.n] = t.args.length;
    t.args.forEach(function(x){ walkT(x, bound); });
  }
  function walk(g, bound){
    if (g.k === "pred"){ g.args.forEach(function(t){ walkT(t, bound); }); return; }
    if (g.k === "top" || g.k === "bot") return;
    if (g.k === "not") return walk(g.a, bound);
    if (g.k === "all" || g.k === "ex") return walk(g.a, bound.concat([g.v]));
    walk(g.a, bound); walk(g.b, bound);
  }
  if (P) Object.keys(P.nodes).forEach(function(k){
    var n = P.nodes[k];
    n.L.concat(n.R).forEach(function(f){ walk(f, []); });
  });
  (P ? P.params : []).forEach(function(p){ if (out[p] === undefined) out[p] = 0; });
  return out;
}
function checkTerm(t){
  var fn = knownFuncs(), bad = null;
  (function walk(x){
    if (bad) return;
    if (fn[x.n] === undefined){
      if (x.args.length) bad = "“" + x.n + "” is not a function symbol this proof knows";
    } else if (fn[x.n] !== x.args.length){
      bad = "“" + x.n + "” takes " + plural(fn[x.n], "argument") + ", not " + x.args.length;
    }
    x.args.forEach(walk);
  })(t);
  if (!bad) return null;
  var fs = Object.keys(fn).filter(function(k){ return fn[k]; }).map(function(k){
    return "<i>" + k + "</i>(" + new Array(fn[k] + 1).join("·,").slice(0, -1) + ")";
  });
  return bad + ". " + (fs.length ? "The symbols in play are " + fs.join(", ") + "."
                                 : "This sequent has no function symbols.") +
    " A plain new name is fine — that just gives the thing a name.";
}
function termSuggestions(limit){
  var fn = knownFuncs(), base = Object.keys(fn).filter(function(k){ return !fn[k]; });
  var out = base.map(function(b){ return tm(b, []); });
  Object.keys(fn).forEach(function(k){
    if (fn[k] !== 1) return;
    base.forEach(function(b){ out.push(tm(k, [tm(b, [])])); });
  });
  if (!out.length) out.push(tm(freshParam("a"), []));
  return out.slice(0, limit || 8);
}
/* The term that would turn this instance into an axiom, if there is one. That
   is nearly always the term wanted, and finding it by matching beats asking
   the student to guess. */
function closingTerm(n, F, side){
  var other = side === "L" ? n.R : n.L;
  for (var i = 0; i < other.length; i++){
    var w = matchInst(F.a, F.v, other[i]);
    if (w === null) continue;
    if (w === true){ var s = termSuggestions(1); return s.length ? s[0] : null; }
    return w;
  }
  return null;
}

/* ═════════════════════════════════════════════ state */
var MAXSYMS = 10, MAXNODES = 400;
var S = {seq:null, P:null, sel:null, undo:[], phase:"empty"};

var $ = function(s){ return document.querySelector(s); };
var fh = function(f){ return '<span class="f">' + fmtHTML(f) + "</span>"; };
var ft = function(t){ return '<span class="f">' + termHTML(t) + "</span>"; };
var plural = function(n, w, pl){ return n + " " + (n === 1 ? w : (pl || w + "s")); };

function say(tone, html){
  $("#status").className = "status" + (tone ? " " + tone : "");
  $("#status").querySelector(".msg").innerHTML = html;
}
function snapshot(){
  S.undo.push(JSON.stringify({P:S.P, sel:S.sel}));
  if (S.undo.length > 120) S.undo.shift();
}
function curNode(){ return S.sel && S.P ? S.P.nodes[S.sel.node] : null; }
function selFormula(){
  var n = curNode();
  if (!n) return null;
  var list = S.sel.side === "L" ? n.L : n.R;
  return list[S.sel.i] || null;
}

/* ═════════════════════════════════════════════ building */
/* A sequent Γ ⊢ Δ fails exactly where every antecedent holds and every
   succedent does not, so one disjunction is all the countermodel search needs. */
function succedent(R){
  if (!R.length) return BOT;
  return R.reduce(function(a, b){ return {k:"or", a:a, b:b}; });
}
function build(src){
  var sq;
  try { sq = parseSequent(src); }
  catch (e){ if (LOG_READY) logFormula({f:src, err:"parse"}); say("err", e.message); return; }

  var sig = signature(sq.L.concat(sq.R));
  var count = Object.keys(sig.preds).length + Object.keys(sig.funcs).length;
  if (count > MAXSYMS){
    if (LOG_READY) logFormula({f:src, err:"too-many-symbols"});
    say("err", "That sequent uses " + plural(count, "symbol") + ", more than this page checks. Try " +
        MAXSYMS + " or fewer.");
    return;
  }
  if (LOG_READY) logFormula({f:src});

  S.seq = sq;
  S.P = newProof();
  S.P.root = mk(S.P, sq.L.slice(), sq.R.slice());
  S.sel = null; S.undo = []; S.phase = "work";
  hideAsk(); hideOut();
  pickLeaf();

  /* No validity pre-check: first-order validity is undecidable, so the most
     that can be said is that no small model refutes it. */
  var cm = smallCountermodel(sq.L, succedent(sq.R));
  if (cm){
    say("err", "That sequent is <b>not valid</b> — " + modelText(cm) + " makes every antecedent true and " +
        "every succedent false, so no proof exists. Check it before proving it.");
  } else {
    say("", "Every rule reads <b>bottom-up</b>: click a compound formula in an open leaf and the rule that " +
        "takes it apart lights up. <b>∀L</b> and <b>∃R</b> ask you for a term and keep the quantified " +
        "formula, so you can come back to it. Unlike the propositional page this one cannot tell you in " +
        "advance whether a sequent is provable — first-order validity is undecidable, so the best it does " +
        "is look for a countermodel in a small domain.");
  }
  draw();
}
/* put the cursor on the first open leaf that still has something to do */
function pickLeaf(){
  var P = S.P, o = openLeaves(P, P.root);
  var live = o.filter(function(id){ return !isDry(P.nodes[id]); });
  var id = (live.length ? live : o)[0];
  if (id === undefined){ S.sel = null; return; }
  var n = P.nodes[id], pick = null;
  ["L", "R"].forEach(function(side){
    (side === "L" ? n.L : n.R).forEach(function(f, i){
      if (!pick && f.k !== "pred") pick = {node:id, side:side, i:i};
    });
  });
  S.sel = pick || {node:id, side:n.L.length ? "L" : "R", i:0};
}

/* ═════════════════════════════════════════════ applying */
function guard(){
  if (!S.P) return false;
  if (S.phase === "done"){ say("", "This proof is finished. Press Restart, or enter another sequent."); return false; }
  return true;
}
function applyRule(code){
  if (!guard()) return;
  var n = curNode();
  if (!n){ say("", "Click a formula in an open leaf first."); return; }
  if (n.rule !== null){ say("", "That sequent already has a rule above it — click a formula in an open leaf."); return; }
  if (code === "Cut"){ startCut(n); return; }
  if (code === "Ax" || code === "⊥L" || code === "⊤R"){ closeLeaf(code, n); return; }

  var F = selFormula();
  if (!F){ say("", "Click a formula in an open leaf first."); return; }
  var want = ruleFor(S.sel.side, F);
  var r = RULES.filter(function(x){ return x.code === code; })[0];
  if (!want || want.code !== code){
    say("err", "<b>" + code + "</b> does not apply to " + fh(F) + " on the " +
        (S.sel.side === "L" ? "left" : "right") + ". " +
        (want ? "That formula is taken apart by <b>" + want.code + "</b> — " + want.law + "."
              : "It is atomic, so no rule takes it apart; this branch closes by <b>Ax</b> or not at all."));
    return;
  }
  if (r.term){ askInstance(r, n, F); return; }
  if (r.eigen){ fire(r, n, F, tm(freshParam(F.v), []), true); return; }
  fire(r, n, F, null, false);
}
/* lay the premises in above the node */
function fire(r, n, F, t, isParam){
  var prem = r.go(n, S.sel.i, F, t);
  if (allNodes(S.P, S.P.root).length + prem.length > MAXNODES){
    say("err", "That would push the proof past " + MAXNODES + " sequents, which is more than this page " +
        "draws. Try a smaller sequent.");
    return;
  }
  snapshot();
  n.rule = r.code;
  n.pr = {side:S.sel.side, f:F};
  n.par = t ? fmtTerm(t) : null;
  if (isParam) S.P.params.push(t.n);
  n.kids = prem.map(function(p){ return mk(S.P, p.L, p.R); });
  pickLeaf();
  var closed = n.kids.filter(function(k){ return canClose(S.P.nodes[k]); }).length;
  var dry = n.kids.filter(function(k){ return isDry(S.P.nodes[k]); }).length;
  say("ok", "<b>" + r.code + "</b>" + (t ? " at " + ft(t) : "") + " — " + r.law + "." +
      (isParam ? " <i>" + t.n + "</i> is fresh to the whole sequent, which is the side condition on " +
        "<b>" + r.code + "</b>." : "") +
      (r.term ? " The " + (r.code === "∀L" ? "∀" : "∃") + " is still there — instantiate it again if you need to." : "") +
      (prem.length === 2 ? " Two premises now." : "") +
      (closed ? (closed === 1 ? " One of them is an axiom." : " Both are axioms.") : "") +
      (dry ? " <b>" + plural(dry, "branch", "branches") + " ran dry</b> — only atoms left, nothing in common." : "") +
      remaining());
  draw();
}
/* ∀L and ∃R: the term is the student's to choose, and the one that closes a
   branch is offered first because it is nearly always the one wanted */
function askInstance(r, n, F){
  var want = closingTerm(n, F, S.sel.side), sugg = termSuggestions();
  if (want) sugg = [want].concat(sugg.filter(function(t){ return !eqT(t, want, [], []); }));
  askTerm("<b>" + r.code + "</b> takes " + fh(F) + " down to <span class=\"f\">" + fmtHTML(F.a) +
          "</span> with a term for <i>" + F.v + "</i>. Which term?" +
          (want ? " Instantiating at " + ft(want) + " would close this branch." : ""),
          sugg,
          function(t){ fire(r, n, F, t, false); });
}
function closeLeaf(code, n){
  var why = null;
  if (code === "Ax"){
    if (!axiomPair(n)) why = "No formula stands on both sides of this sequent, so <b>Ax</b> does not close it.";
  } else if (code === "⊥L"){
    if (!hasBot(n)) why = "There is no ⊥ among the antecedents, so <b>⊥L</b> does not close this.";
  } else {
    if (!hasTop(n)) why = "There is no ⊤ among the succedents, so <b>⊤R</b> does not close this.";
  }
  if (why){
    if (isDry(n)) why += " This leaf has nothing but atoms and no formula in common, so no rule can rescue " +
      "it either — but that does not condemn the sequent. Undo back to a <b>∀L</b> or <b>∃R</b> and try a " +
      "different term.";
    say("err", why);
    return;
  }
  snapshot();
  n.rule = code; n.kids = []; n.pr = null;
  pickLeaf();
  say("ok", "<b>" + code + "</b> — this branch is closed." + remaining());
  draw();
}
function remaining(){
  var P = S.P, o = openLeaves(P, P.root);
  var dry = o.filter(function(id){ return isDry(P.nodes[id]); }).length;
  if (!o.length) return " <b>Every branch is closed</b> — press Done.";
  return " " + plural(o.length, "leaf", "leaves") + " still open" +
    (dry ? ", " + dry + " of them dry" : "") + ".";
}

/* ── Cut, the rule Gentzen proved you never need ── */
function startCut(n){
  askFormula("<b>Cut</b> lets you prove any formula A and then assume it: one premise with A on the right, " +
    "one with A on the left. Gentzen's <i>Hauptsatz</i> says you never need it — try the proof without it " +
    "and see. What should A be?",
    function(A){
      snapshot();
      n.rule = "Cut"; n.pr = null; n.par = null;
      n.kids = [mk(S.P, n.L.slice(), addTo(n.R, [A])), mk(S.P, addTo(n.L, [A]), n.R.slice())];
      pickLeaf();
      say("ok", "<b>Cut</b> on " + fh(A) + " — prove it on the right, then use it on the left." + remaining());
      draw();
    });
}
function askFormula(prompt, onOk){
  var a = $("#ask");
  a.hidden = false;
  a.innerHTML = "<p>" + prompt + "</p><div class=\"row\">" +
    '<input type="text" id="askF" spellcheck="false" autocomplete="off" placeholder="a formula">' +
    '<button type="button" class="sug" id="askGo">OK</button>' +
    '<button type="button" class="cancel" id="askX">cancel</button></div>';
  function go(){
    var f;
    try { f = parse($("#askF").value); }
    catch (e){ say("err", e.message); return; }
    var ok = Object.keys(knownFuncs()), bad = [];
    freeIn(f, bad);
    if (bad.some(function(v){ return ok.indexOf(v) < 0; })){
      say("err", "That brings in a name the proof has never met. It can use " +
          ok.map(function(v){ return "<i>" + v + "</i>"; }).join(", ") + ".");
      return;
    }
    hideAsk();
    onOk(f);
  }
  $("#askGo").addEventListener("click", go);
  $("#askX").addEventListener("click", function(){ hideAsk(); draw(); });
  $("#askF").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); go(); } });
  $("#askF").focus();
}
function askTerm(prompt, sugg, onOk){
  var a = $("#ask");
  a.hidden = false;
  a.innerHTML = "<p>" + prompt + "</p><div class=\"row\">" +
    sugg.map(function(t, i){
      return '<button type="button" class="sug" data-sug="' + i + '"><span class="f">' +
        termHTML(t) + "</span></button>";
    }).join("") +
    '<input type="text" id="askF" spellcheck="false" autocomplete="off" placeholder="a term, like f(a)">' +
    '<button type="button" class="sug" id="askGo">OK</button>' +
    '<button type="button" class="cancel" id="askX">cancel</button></div>';
  function take(t){
    var why = checkTerm(t);
    if (why){ say("err", why); return; }
    hideAsk(); onOk(t);
  }
  sugg.forEach(function(t, i){
    a.querySelector('[data-sug="' + i + '"]').addEventListener("click", function(){ take(t); });
  });
  function go(){
    var v;
    try { v = parseTerm($("#askF").value); }
    catch (e){ say("err", e.message); return; }
    take(v);
  }
  $("#askGo").addEventListener("click", go);
  $("#askX").addEventListener("click", function(){ hideAsk(); draw(); });
  $("#askF").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); go(); } });
  $("#askF").focus();
}
function hideAsk(){ $("#ask").hidden = true; $("#ask").innerHTML = ""; }
function hideOut(){ $("#out").hidden = true; $("#out").innerHTML = ""; }

function undo(){
  if (!S.undo.length){ say("", "Nothing to undo — you are back at the bare sequent."); return; }
  var s = JSON.parse(S.undo.pop());
  S.P = s.P; S.sel = s.sel; S.phase = "work";
  hideOut();
  say("", "Stepped back one rule.");
  draw();
}

/* ═════════════════════════════════════════════ finishing */
/* The eigenvariable conditions, checked against the finished tree rather than
   taken on trust: the parameter ∀R or ∃L chose must not occur free anywhere in
   the sequent it was chosen for. */
function eigenTrouble(P, id){
  var n = P.nodes[id];
  if (n.par && (n.rule === "∀R" || n.rule === "∃L")){
    var p = n.par, loose = [];
    n.L.concat(n.R).forEach(function(f){ freeIn(f, loose); });
    if (loose.indexOf(p) >= 0)
      return n.rule + " took <i>" + p + "</i> as its parameter, but that name already occurs free in " +
        '<span class="f">' + seqText(n.L, n.R) + "</span>.";
  }
  for (var i = 0; i < n.kids.length; i++){
    var t = eigenTrouble(P, n.kids[i]);
    if (t) return t;
  }
  return null;
}
function done(){
  if (!S.P) return;
  var P = S.P, o = openLeaves(P, P.root);
  if (o.length){
    S.sel = null; pickLeaf();
    var dry = o.filter(function(id){ return isDry(P.nodes[id]); }).length;
    say("err", "Not finished — " + plural(o.length, "leaf", "leaves") + " still open" +
        (dry ? ", " + dry + " of them dry. A dry leaf is not a verdict here: undo back to a <b>∀L</b> or " +
               "<b>∃R</b> and try a different term." : "."));
    draw();
    return;
  }
  var bad = eigenTrouble(P, P.root);
  if (bad){
    say("err", "Something is wrong: " + bad + " This is a bug in the tool, not in your proof — please report it.");
    return;
  }
  S.phase = "done"; S.sel = null;
  var steps = countRules(P, P.root);
  var cut = usesRule(P, P.root, "Cut");
  var qs = ["∀L", "∀R", "∃L", "∃R"].filter(function(c){ return usesRule(P, P.root, c); });

  var h = '<p class="onote"><b>Proved.</b> ' + seqHTML(S.seq.L, S.seq.R) + " is derivable in " +
    plural(steps, "rule") + ", every branch closing on an axiom. The rules are sound, so the sequent is " +
    "valid: no interpretation makes every antecedent true and every succedent false.</p>";
  if (qs.length)
    h += '<p class="onote">The quantifier rules used are <code>' + qs.join("</code>, <code>") +
      "</code>" + (usesRule(P, P.root, "∀R") || usesRule(P, P.root, "∃L")
        ? ", and every eigenvariable condition on them checks out" : "") + ".</p>";
  h += '<p class="onote">' + (cut
    ? "This proof uses <code>Cut</code>. Gentzen's <i>Hauptsatz</i> says it never has to — every sequent " +
      "provable with cut is provable without."
    : "No <code>Cut</code>. In the propositional fragment that would also buy you the subformula property " +
      "and a decision procedure; here it does not, because <code>∀L</code> and <code>∃R</code> put in terms " +
      "that need not come from the goal at all. First-order validity is undecidable, and this is where that " +
      "shows up in the proof theory.") + "</p>";
  $("#out").innerHTML = h;
  $("#out").hidden = false;
  say("ok", "<b>Proved</b> in " + plural(steps, "rule") + ".");
  draw();
}

/* ═════════════════════════════════════════════ drawing */
function draw(){
  drawRules();
  drawTree();
  $("#doneBtn").disabled = !S.P;
}
function drawRules(){
  var F = selFormula(), n = curNode(), open = n && n.rule === null;
  function btn(r, close){
    var cls = "rule" + (close ? " close" : "");
    if (S.P && S.phase !== "done"){
      var live;
      if (close) live = !!(open && (r.code === "Ax" ? axiomPair(n) : r.code === "⊥L" ? hasBot(n) : hasTop(n)));
      else if (r.code === "Cut") live = !!open;
      else live = !!(open && F && S.sel.side === r.side && F.k === r.k);
      cls += live ? " armed" : " dim";
    }
    return '<button type="button" class="' + cls + '" data-rule="' + r.code + '" title="' +
      r.law.replace(/"/g, "&quot;") + '">' + r.lbl + "</button>";
  }
  $("#leftRules").innerHTML = RULES.filter(function(r){ return r.side === "L"; })
    .map(function(r){ return (r.k === "all" ? '<span class="rsep"></span>' : "") + btn(r); }).join("");
  $("#rightRules").innerHTML = RULES.filter(function(r){ return r.side === "R"; })
    .map(function(r){ return (r.k === "all" ? '<span class="rsep"></span>' : "") + btn(r); }).join("");
  $("#closeRules").innerHTML = CLOSERS.map(function(r){ return btn(r, true); }).join("") +
    btn({code:"Cut", lbl:"Cut", law:"prove a formula, then assume it — never necessary, by Gentzen's Hauptsatz"});
}
function drawTree(){
  var b = $("#board");
  if (!S.P){ b.innerHTML = ""; return; }
  b.innerHTML = renderNode(S.P, S.P.root);
}
function renderNode(P, id){
  var n = P.nodes[id];
  var kids = n.kids.map(function(k){ return renderNode(P, k); }).join("");
  return '<span class="pn">' +
    (kids ? '<span class="pn-kids">' + kids + "</span>" : "") +
    (n.rule ? '<span class="pn-bar"><span class="pn-rule">' + n.rule +
      (n.par ? " " + n.par : "") + "</span></span>" : "") +
    sequentHTML(P, id) + "</span>";
}
function sequentHTML(P, id){
  var n = P.nodes[id], open = n.rule === null;
  var isCur = S.sel && S.sel.node === id;
  var ax = open ? axiomPair(n) : null;
  var cls = "sq" + (open ? " leaf" : " settled") +
    (isCur && open ? " cur" : "") +
    (open && canClose(n) ? " ax" : "") +
    (open && isDry(n) ? " stuck" : "");
  function part(list, side){
    if (!list.length) return "";
    return list.map(function(f, i){
      var c = "fm";
      if (isCur && open && S.sel.side === side && S.sel.i === i) c += " sel";
      if (ax && ((side === "L" && i === ax.i) || (side === "R" && i === ax.j))) c += " twin";
      return (i ? '<span class="comma">,</span>' : "") +
        '<span class="' + c + '" data-node="' + id + '" data-side="' + side + '" data-i="' + i + '">' +
        fmtHTML(f) + "</span>";
    }).join("");
  }
  var tick = "";
  if (open && canClose(n)) tick = '<span class="tick ax">closes</span>';
  else if (open && isDry(n)) tick = '<span class="tick stuck">dry</span>';
  return '<span class="' + cls + '">' + part(n.L, "L") +
    '<span class="turn">⊢</span>' + part(n.R, "R") + tick + "</span>";
}
function seqHTML(L, R){
  return '<span class="f">' + L.map(fmtHTML).join(", ") + " ⊢ " + R.map(fmtHTML).join(", ") + "</span>";
}
function pickFormula(node, side, i){
  if (S.phase === "done"){ say("", "This proof is finished. Press Restart to try another route."); return; }
  var n = S.P.nodes[node];
  if (n.rule !== null){ say("", "That sequent is already worked on — pick a formula in a leaf, at the top."); return; }
  S.sel = {node:node, side:side, i:i};
  var F = selFormula(), r = ruleFor(side, F);
  if (F.k === "pred"){
    say("", fh(F) + " is atomic — no rule takes it apart. A leaf closes when some formula stands on " +
        "<b>both</b> sides." + (canClose(n) ? " This one does: press <b>Ax</b>." :
          isDry(n) ? " This leaf is dry; a different term further down would have to fix it." : ""));
  } else {
    say("", "Selected " + fh(F) + " on the " + (side === "L" ? "left" : "right") + " — <b>" + r.code +
        "</b> is the rule that takes it apart: " + r.law + ".");
  }
  draw();
}

/* ═════════════════════════════════════════════ connective pad */
var caret = null;
function rememberCaret(){
  var el = $("#formula");
  if (el.selectionStart !== null) caret = [el.selectionStart, el.selectionEnd];
}
["input","click","keyup","select","blur"].forEach(function(ev){
  $("#formula").addEventListener(ev, rememberCaret);
});
function insertSym(ch){
  var el = $("#formula"), v = el.value, a, b;
  if (document.activeElement === el && el.selectionStart !== null){ a = el.selectionStart; b = el.selectionEnd; }
  else if (caret){ a = caret[0]; b = caret[1]; }
  if (a === undefined || a === null){ a = b = v.length; }
  el.value = v.slice(0, a) + ch + v.slice(b);
  var pos = a + ch.length;
  caret = [pos, pos];
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e){}
}
$("#pad").addEventListener("mousedown", function(e){
  if (e.target.closest("[data-sym]")) e.preventDefault();
});

/* ═════════════════════════════════════════════ wiring */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-sym],[data-rule],[data-node]");
  if (!t) return;
  if (t.hasAttribute("data-sym")){ insertSym(t.dataset.sym); return; }
  if (t.hasAttribute("data-rule")){ applyRule(t.dataset.rule); return; }
  if (t.hasAttribute("data-node")){ pickFormula(+t.dataset.node, t.dataset.side, +t.dataset.i); return; }
});
$("#entry").addEventListener("submit", function(e){ e.preventDefault(); build($("#formula").value); });
$("#doneBtn").addEventListener("click", done);
$("#undo").addEventListener("click", undo);
$("#reset").addEventListener("click", function(){
  /* a restart re-runs the sequent already in the box; not a submission */
  var was = LOG_READY; LOG_READY = false;
  build($("#formula").value);
  LOG_READY = was;
});
document.addEventListener("keydown", function(e){
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});

build($("#formula").value);
LOG_READY = true;

/* ── theme toggle ─────────────────────────────────────── */
function themeNow(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch (e){ return "light"; }
}
function syncTheme(){
  var b = document.getElementById("themeBtn"), next = themeNow() === "dark" ? "light" : "dark";
  b.title = "Switch to the " + next + " theme";
  b.setAttribute("aria-label", b.title);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("logic.theme", next); } catch (e){}
  syncTheme();
});
syncTheme();
</script>
