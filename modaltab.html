}
/* does the structure read off the branch actually do what is claimed of it? */
function checkModel(mo){
  var bad = badFrame(mo.M);
  if (bad) return "the structure it gives is not " + bad.k +
    (bad.lab ? " on " + bad.lab : "") + ", so it is not a frame of " + logicName();
  var v = holdsAt(S.root, mo.M, 0);
  if (v === (S.sign === "T")) return null;
  return "the structure it gives makes the root formula " + (v ? "true" : "false") +
         " at " + WN(0) + ", which is not what the branch says";
}
/* add whatever arrows the chosen conditions demand, until nothing is missing */
function closeFrame(M){
  (S.labs || [""]).forEach(function(lab){
    var on = onOf(lab), R = M.R[lab], n = M.n, a, b, c, changed = true;
    if (!R) return;
    while (changed){
      changed = false;
      if (on.reflexive) for (a = 0; a < n; a++) if (!R[a][a]){ R[a][a] = true; changed = true; }
      if (on.symmetric) for (a = 0; a < n; a++) for (b = 0; b < n; b++)
        if (R[a][b] && !R[b][a]){ R[b][a] = true; changed = true; }
      if (on.transitive) for (a = 0; a < n; a++) for (b = 0; b < n; b++) for (c = 0; c < n; c++)
        if (R[a][b] && R[b][c] && !R[a][c]){ R[a][c] = true; changed = true; }
      if (on.euclidean) for (a = 0; a < n; a++) for (b = 0; b < n; b++) for (c = 0; c < n; c++)
        if (R[a][b] && R[a][c] && !R[b][c]){ R[b][c] = true; changed = true; }
    }
    /* a bare dead end gets a loop, so the structure really is serial */
    if (on.serial) for (a = 0; a < n; a++) if (!R[a].some(Boolean)) R[a][a] = true;
  });
}

/* When the structure a branch folds down to does not do what the branch says,
   there are two quite different reasons, and the student deserves to be told
   which. With the loop check off it is a bug and should be reported. With it
   on it is the loop check being eager: subset blocking sends a world back to
   an earlier one, the frame conditions are then closed up over the folded
   structure, and the arrows that closure adds can undo a □ that the branch had
   satisfied. That is a limit of the check, not an error in the working, and it
   shows up most with two relations and a transitive or euclidean logic. */
function badModelWhy(why){
  if (!blocking())
    return "Something is wrong: " + why + ". This is a bug in the tool, not in your working — " +
           "please report it.";
  return "<b>The loop check was too eager here.</b> The branch has no rules left, but " + why +
    ". The loop sends a repeated world back to an earlier one, and closing the frame conditions over " +
    "the folded structure can add arrows that undo a □ the branch had satisfied. So this branch cannot " +
    "be <i>certified</i> as a countermodel — which is not the same as saying there is none. Try closing " +
    "it instead, or build a structure by hand in the model lab.";
}
/* an open branch, read off as a structure */
function modelOn(tab, seg){
  /* A blocked world is not a world of the structure: it stands for the one
     that blocks it, and every arrow into it is redirected there. */
  var all = worldsOn(tab, seg), rep = {}, keep = [];
  all.forEach(function(w){
    var r = repOf(tab, seg, w);
    rep[w] = r;
    if (r === w) keep.push(w);
  });
  var idx = {};
  keep.forEach(function(w, i){ idx[w] = i; });
  var labs = S.labs || [""];
  var M = newModel(keep.length, labs);
  arrowsOn(tab, seg).forEach(function(R){
    /* An arrow *into* a blocked world is redirected to the world that blocks
       it — that is the whole idea of the loop back. An arrow *out of* one is
       dropped, because a blocked world is not a world of the structure at all:
       its blocker stands in for it and has arrows of its own, already expanded.
       Carrying the outgoing arrows over instead would hand the blocker a
       successor it was never asked to satisfy its □ along, and the structure
       would stop being a model of the branch. */
    if (rep[R.a] !== R.a) return;
    if (M.R[R.lab]) M.R[R.lab][idx[R.a]][idx[rep[R.b]]] = true;
  });
  /* quotienting can break what the branch had satisfied, so close it again */
  closeFrame(M);
  var at = [];
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "fml" && L.f.k === "atom" && at.indexOf(L.f.n) < 0) at.push(L.f.n);
  });
  at.sort();
  at.forEach(function(a){ var row = []; for (var i = 0; i < keep.length; i++) row.push(false); M.V[a] = row; });
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "fml" && L.f.k === "atom" && L.s === "T") M.V[L.f.n][idx[rep[L.w]]] = true;
  });
  return {M:M, atoms:at, idx:idx, ws:keep, rep:rep};
}
/* The model lab writes the plain relation as R and a named one as Ra. If a
   formula uses both — □ beside [a] — the plain one is given a name of its own
   so nothing collides. */
function aliasOf(labs){
  var out = {}, named = labs.filter(function(l){ return l !== ""; });
  labs.forEach(function(l){ out[l] = l; });
  if (labs.indexOf("") >= 0 && named.length){
    var pick = "rqsmnu".split("").filter(function(c){ return named.indexOf(c) < 0; })[0] || "r0";
    out[""] = pick;
  }
  return out;
}
function modelText(mo){
  var labs = S.labs || [""], al = aliasOf(labs), parts = [];
  labs.forEach(function(lab){
    var es = [], R = mo.M.R[lab];
    if (!R) return;
    for (var a = 0; a < mo.M.n; a++) for (var b = 0; b < mo.M.n; b++) if (R[a][b]) es.push(a + ">" + b);
    parts.push("R" + al[lab] + "=" + es.join(","));
  });
  var vs = mo.atoms.map(function(at){
    var w = [];
    for (var i = 0; i < mo.M.n; i++) if (mo.M.V[at][i]) w.push(i);
    return at + "=" + w.join(",");
  });
  return "W=" + mo.M.n + "; " + parts.join("; ") + (vs.length ? "; " + vs.join("; ") : "");
}
/* ═════════════════════════════════════════════ state */
var MAXWORLDS = 40;
/* S.labs are the relations the current formula travels along — "" is the
   plain one of □ and ◇, a name is an agent or an atomic program. S.ags is the
   named ones, which are what E and D quantify over. S.on holds a set of frame
   condition switches per relation, because nothing says two agents have to
   obey the same ones. */
var S = {sign:"F", root:null, tab:null, sel:null, closing:null, undo:[], newLines:null,
         labs:[""], ags:[], extra:[], star:false, on:{}};

var $ = function(s){ return document.querySelector(s); };
var fh = function(f){ return '<span class="f">' + fmtHTML(f) + "</span>"; };
var sf = function(w, s, f){
  return '<span class="wl">' + WN(w) + "</span>" +
    '<span class="f"><span class="sg ' + s + '">' + s + "</span>" + fmtHTML(f) + "</span>";
};
var rf = function(a, b, lab){
  return '<span class="f"><span class="wl">' + WN(a) + '</span><span class="rr">R' +
    (lab ? "<sub>" + lab + "</sub>" : "") + '</span>' +
    '<span class="wl">' + WN(b) + "</span></span>";
};
function say(tone, html){
  $("#status").className = "status" + (tone ? " " + tone : "");
  $("#status").querySelector(".msg").innerHTML = html;
}
function snapshot(){
  S.undo.push(JSON.stringify({tab:S.tab, sel:S.sel, closing:S.closing}));
  if (S.undo.length > 120) S.undo.shift();
}

/* ═════════════════════════════════════════════ building */
function build(src){
  var f;
  try { f = parse(src); }
  catch (e){ if (LOG_READY) logFormula({f:src, err:"parse", sign:S.sign}); say("err", e.message); return; }
  if (LOG_READY) logFormula({f:src, sign:S.sign});
  S.root = f;
  /* the relations this formula needs, and the switches that go with them;
     a relation that has been set up before keeps its settings */
  var found = labelsOf(f);
  /* E, D and C quantify over the agents, and a formula like Ep ⊃ Dp names
     none. Two is the interesting number and the one lecture 13 works with, so
     that is what such a formula gets until the student says otherwise. */
  if (usesEpi(f) && !found.filter(function(l){ return l !== ""; }).length && !S.extra.length)
    S.extra = ["a", "b"];
  S.star = hasStar(f);
  S.labs = found.concat(S.extra.filter(function(l){ return found.indexOf(l) < 0; }));
  if (!S.labs.length) S.labs = [""];
  S.ags = S.labs.filter(function(l){ return l !== ""; });
  S.labs.forEach(onOf);
  S.tab = newTab();
  S.tab.root = addSeg(S.tab, null);
  addFml(S.tab, S.tab.root, 0, S.sign, f, null, null);
  S.sel = null; S.closing = null; S.undo = []; S.newLines = null;
  say("", "Start at <b>" + WN(0) + "</b> with " + sf(0, S.sign, f) + ". A branch dies when one world has to " +
      "make the same formula true and false; a branch that runs out of rules is a <b>countermodel</b> you " +
      "can open in the model lab. " +
      (usesEpi(f) && S.ags.length === 1
        ? "<b>One agent.</b> E and D range over the agents, and this formula names only <i>" + S.ags[0] +
          "</i> — so here they both come to the same thing as K<sub>" + S.ags[0] + "</sub>, and a formula " +
          "that is about two agents will come out wrong. Press <b>+ agent</b> if you meant more. "
        : "") +
      (S.labs.length > 1
        ? "This formula uses <b>" + S.labs.length + " relations</b> — " +
          S.labs.map(function(l){ return l === "" ? "the plain one" : "<i>" + l + "</i>"; }).join(", ") +
          " — so the arrows are labelled and each gets its own switches below. "
        : "") +
      "The logic is <b>" + logicName() + "</b>." +
            (!blocking() ? ""
        : (S.star && !anyCond("transitive") && !anyCond("euclidean"))
        ? " There is a <b>star</b> in it, so the <b>loop check</b> is on: a star travels into every world the "
          + "other rules make and unfolds again there, which on its own never stops. A world that repeats one "
          + "already on the branch is left unexpanded, and the structure loops back to it instead."
        : " With transitivity or euclideanness a ◇ would otherwise keep asking for a fresh world that the "
          + "closure then reaches, so a <b>loop check</b> is on: a world that repeats one already there is not "
          + "expanded, and the structure loops back to it instead. That is what makes the search stop."));
  draw();
}

/* ═════════════════════════════════════════════ actions */
function selectLine(id){
  if (S.closing){ pickClosure(id); return; }
  var L = S.tab.lines[id];
  S.sel = (S.sel === id) ? null : id;
  if (S.sel !== null){
    var st = L.kind === "fml" ? stopRule(L.s, L.f) : null;
    if (L.kind === "rel")
      say("", "Line " + id + " is the arrow " + rf(L.a, L.b, L.lab) + ". Arrows are not broken down — they " +
          "are what the universal and existential rules travel along" +
          (L.lab ? ", and this one belongs to <i>" + L.lab + "</i>, so only <i>" + L.lab +
                   "</i>’s modalities use it." : "."));
    else if (st) say("warn", stopWhy(st, L));
    else if (L.f.k === "atom" || L.f.k === "top" || L.f.k === "bot")
      say("", "Line " + id + " is atomic. Nothing to break down — atoms are what closes a branch.");
    else if (L.used && !modalRule(L.s, L.f))
      say("", "Line " + id + " is ticked: every open branch below it already carries its expansion.");
    else say("", "Line " + id + " selected — now choose its rule above.");
  }
  draw();
}
function clickRule(code){
  if (!S.tab) return;
  if (S.sel === null){ say("", "Click a line in the tree first, then choose its rule."); return; }
  var L = S.tab.lines[S.sel];
  var want = RULES.filter(function(x){ return x.code === code; })[0];
  if (L.kind === "rel"){
    say("err", "(" + code + ") needs a signed formula. Line " + S.sel + " is the arrow " +
        rf(L.a, L.b, L.lab) + ".");
    return;
  }
  var r = ruleFor(L.s, L.f);
  if (!r){
    say("err", "(" + code + ") needs a compound formula. Line " + S.sel + " is atomic — nothing breaks down.");
    return;
  }
  if (r.kind === "stop"){ say("warn", stopWhy(r, L)); return; }
  if (r.code !== code){
    say("err", "(" + code + ") applies to " + want.prem + ". Line " + S.sel + " is " + sf(L.w, L.s, L.f) +
        ", so its rule is <b>(" + r.code + ")</b>.");
    return;
  }
  if (!leaves(S.tab, L.seg, "active").length){
    say("err", "Every branch through line " + S.sel + " is already closed — nothing left to expand.");
    return;
  }
  var m = modalRule(L.s, L.f);
  if (m && m.mode === "all"){
    var tg = leaves(S.tab, L.seg, "active").reduce(function(t, lf){ return t + allTargets(S.tab, lf, L).length; }, 0);
    if (!tg){
      var ar = arrowsOn(S.tab, leaves(S.tab, L.seg, "active")[0]);
      var reach = m.kind === "allD"
        ? "every arrow out of " + WN(L.w) + " that every agent agrees on"
        : "every" + (m.lab ? " <i>" + m.lab + "</i>-" : " ") + "arrow out of " + WN(L.w);
      say("err", "(" + code + ") sends " + fh(L.f.a) + " along " + reach +
          ", and every such world already carries it" +
          (ar.some(function(R){ return R.a === L.w && (m.kind === "allD" || R.lab === m.lab); })
            ? "." : " — in fact " + WN(L.w) + " has no such arrow yet, so the rule has nowhere to send it.") +
          " Make an arrow first, with an existential rule or a frame condition.");
      return;
    }
  } else if (L.used){
    say("err", "Line " + S.sel + " is already used (✓). " +
        (m ? "An existential rule makes its one world and is finished." : "Applying its rule again adds nothing."));
    return;
  }
  if (m && m.mode === "new"){
    var live = leaves(S.tab, L.seg, "active"), by = null, all = live.length > 0;
    live.forEach(function(lf){
      var b = blockedBy(S.tab, lf, L.w);
      if (b === null) all = false; else if (by === null) by = b;
    });
    if (all){
      say("err", "<b>Blocked.</b> " + WN(by) + " already carries every formula " + WN(L.w) +
          " does, so a new world would only repeat what " + WN(by) + " has already been given. In " +
          aLogic().replace(/(\S+)$/, "<b>$1</b>") + " frame " + WN(L.w) + " reaches whatever " + WN(by) +
          " reaches, so the structure lets " + WN(L.w) + "’s arrow land on " + WN(by) + " instead. " +
          "That is the loop check, and it is what makes the search stop.");
      return;
    }
  }
  if (m && m.mode === "new" && worldsOn(S.tab, leaves(S.tab, L.seg, "active")[0]).length >= MAXWORLDS){
    say("err", "This branch is up to " + MAXWORLDS + " worlds, which is as many as this page draws. " +
        "The loop check should have stopped it well before here, so if you have got this far with a " +
        "small formula it is worth reporting.");
    return;
  }
  snapshot();
  var before = S.tab.nextLine;
  applyFml(S.tab, S.sel);
  S.sel = null; S.newLines = [];
  for (var i = before; i < S.tab.nextLine; i++) S.newLines.push(i);
  say("ok", "(" + r.code + ") applied — " + (
    PROGCODES[r.code] ? "the law for that program, so the modality is traded for a smaller one."
      : r.code === "(E)" ? "everyone-knows is the conjunction over the agents."
      : r.kind === "beta" ? "a β-rule, so the branch splits in two."
      : r.kind === "alpha" ? "an α-rule, so the branch just grows."
      : r.kind === "newD" ? "a new world, with an arrow from every agent — which is what puts it in the " +
                            "intersection."
      : m.mode === "new" ? "a new world, with the arrow that reaches it."
      : "sent along every arrow out of " + WN(L.w) + "."));
  draw(true);
  checkDone();
}
function clickCond(lab, k){
  if (!S.tab) return;
  var C = COND.filter(function(c){ return c.k === k; })[0];
  var which = lab === "" ? "" : " on <i>" + lab + "</i>";
  if (!onOf(lab)[k]){
    say("err", "The logic" + which + " is <b>" + logicOf(lab) + "</b>, which does not assume " + k +
        " frames. Switch " + k + " on above if that is the logic you want.");
    return;
  }
  var live = leaves(S.tab, S.tab.root, "active");
  var work = live.reduce(function(t, lf){ return t + condWork(S.tab, lf, lab, k).length; }, 0);
  if (!work){ say("err", "Nothing to add: every open branch already satisfies " + k + which + "."); return; }
  snapshot();
  var before = S.tab.nextLine;
  applyCond(S.tab, S.tab.root, lab, k);
  S.sel = null; S.newLines = [];
  for (var i = before; i < S.tab.nextLine; i++) S.newLines.push(i);
  say("ok", "<b>" + k + which + "</b> — " + C.law + ". " +
      "Those arrows may wake a universal line that had nowhere to go.");
  draw(true);
  checkDone();
}
function addAgent(){
  var used = S.labs, pick = null;
  "abcdefghij".split("").forEach(function(c){ if (!pick && used.indexOf(c) < 0) pick = c; });
  if (!pick){ say("err", "Ten agents is as many as this page names."); return; }
  S.extra.push(pick);
  say("", "Added agent <b>" + pick + "</b>. E and D now range over " +
      S.ags.concat([pick]).join(", ") + ". The tree starts again.");
  var was = LOG_READY; LOG_READY = false; build($("#formula").value); LOG_READY = was;
}
function dropAgent(){
  if (!S.extra.length){
    say("err", "Every agent left is one the formula names — write it out of the formula to be rid of it.");
    return;
  }
  var gone = S.extra.pop();
  say("", "Dropped agent <b>" + gone + "</b>. The tree starts again.");
  var was = LOG_READY; LOG_READY = false; build($("#formula").value); LOG_READY = was;
}
function toggleCond(lab, k){
  var on = onOf(lab);
  on[k] = !on[k];
  say("", "The logic is now <b>" + logicName() + "</b>" +
      (S.tab ? ". Rules already applied stay; the frame conditions only ever add arrows, so turning one on " +
               "mid-proof is safe." : "."));
  draw();
}

function startClosing(seg){
  S.closing = {seg:seg, picks:[]};
  S.sel = null;
  say("", "Click the two lines on that branch that contradict — the same formula at the <b>same world</b>, " +
      "once under T and once under F.");
  draw();
}
function pickClosure(id){
  var c = S.closing, tab = S.tab;
  if (pathLines(tab, c.seg).indexOf(id) < 0){
    say("err", "Line " + id + " is not on that branch.");
    return;
  }
  if (c.picks.indexOf(id) >= 0){ c.picks = c.picks.filter(function(x){ return x !== id; }); draw(); return; }
  c.picks.push(id);
  if (c.picks.length < 2){ draw(); return; }
  var A = tab.lines[c.picks[0]], B = tab.lines[c.picks[1]];
  if (A.kind !== "fml" || B.kind !== "fml"){
    say("err", "An arrow cannot close a branch — pick two signed formulas."); c.picks = []; draw(); return;
  }
  if (A.w !== B.w){
    say("err", "Those are at different worlds, " + WN(A.w) + " and " + WN(B.w) +
        ". A formula may be true in one world and false in another with no contradiction at all — that is " +
        "the whole point of the possible worlds.");
    c.picks = []; draw(); return;
  }
  if (key(A.f) !== key(B.f)){
    say("err", "Those are different formulas: " + fh(A.f) + " and " + fh(B.f) + ".");
    c.picks = []; draw(); return;
  }
  if (A.s === B.s){
    say("err", "Lines " + A.id + " and " + B.id + " are both signed <b>" + A.s + "</b>. You need one T and one F.");
    c.picks = []; draw(); return;
  }
  snapshot();
  tab.segs[c.seg].state = "closed";
  tab.segs[c.seg].closure = [A.id, B.id];
  S.closing = null;
  say("ok", "Branch closed — " + WN(A.w) + " would have to make " + fh(A.f) + " true and false at once.");
  draw();
  checkDone();
}
function markOpen(seg){
  var tab = S.tab, c = clashOn(tab, seg);
  if (c){
    var L = tab.lines[c[0]];
    say("err", "That branch already contradicts itself at " + WN(L.w) + " — line " + c[0] +
        (c[0] === c[1] ? "" : " against line " + c[1]) + ". It closes.");
    return;
  }
  var owed = owedFml(tab, seg), oc = owedCond(tab, seg);
  var st = owed.filter(function(x){ return x.stop; })[0];
  if (st){ say("warn", stopWhy(st.stop, tab.lines[st.id])); return; }
  if (owed.length){
    var L2 = tab.lines[owed[0].id];
    say("err", "Not finished: line " + L2.id + ", " + sf(L2.w, L2.s, L2.f) + ", still owes its (" +
        owed[0].why + "). Every rule must be spent before a branch counts as open.");
    return;
  }
  if (oc.length){
    say("err", "Not finished: the logic is <b>" + logicName() + "</b> and this branch is not yet " +
        oc[0].k + (oc[0].lab ? " on <i>" + oc[0].lab + "</i>" : "") + ". Apply <b>" + oc[0].lbl +
        "</b> first — a countermodel has to be a frame of the logic.");
    return;
  }
  var mo0 = modelOn(tab, seg), why = checkModel(mo0);
  if (why){ say(blocking() ? "warn" : "err", badModelWhy(why)); return; }
  snapshot();
  tab.segs[seg].state = "open";
  var mo = modelOn(tab, seg);
  say("ok", "Branch open. It reads off as <code>" + modelText(mo) + "</code> — " +
      plural(mo.M.n, "world") + ", " + plural(arrowCount(mo.M), "arrow") + ".");
  draw();
  checkDone();
}
function arrowCount(M){
  var t = 0;
  Object.keys(M.R).forEach(function(l){
    M.R[l].forEach(function(r){ t += r.filter(Boolean).length; });
  });
  return t;
}
function plural(n, w, pl){ return n + " " + (n === 1 ? w : (pl || w + "s")); }

function checkDone(){
  var tab = S.tab, lv = leaves(tab, tab.root);
  var act = lv.filter(function(s){ return tab.segs[s].state === "active"; });
  if (act.length){
    /* a branch where every rule left is a refused one will never finish, and
       saying so beats letting the student hunt for a move that is not there */
    var stuck = null;
    act.forEach(function(s){ if (!stuck) stuck = stuckOn(tab, s); });
    if (stuck && act.every(function(s){ return stuckOn(tab, s) || clashOn(tab, s); }))
      say("warn", "<b>As far as this page goes.</b> " + stopWhy(stuck.stop, tab.lines[stuck.id]));
    return;
  }
  var open = lv.filter(function(s){ return tab.segs[s].state === "open"; });
  if (!open.length){
    say("ok", "<b>Tableau closed.</b> All " + plural(lv.length, "branch", "branches") + " died, so no " +
        logicName() + " structure makes " + sf(0, S.sign, S.root) + " — " +
        (S.sign === "F" ? "the formula is <b>valid in " + logicName() + "</b>."
                        : "the formula is <b>unsatisfiable in " + logicName() + "</b>."));
  } else {
    var mo = modelOn(tab, open[0]), why2 = checkModel(mo);
    if (why2){ say(blocking() ? "warn" : "err", badModelWhy(why2)); return; }
    say("ok", "<b>Tableau open.</b> The branch marked ○ gives a structure making " + sf(0, S.sign, S.root) +
        " — " + (S.sign === "F" ? "a <b>countermodel</b>, so the formula is not valid in " + logicName()
                                : "a <b>model</b>, so it is satisfiable") + ". " +
        '<a class="golink" href="kripke.html#' + encodeURIComponent(modelText(mo)) +
        '" target="_blank" rel="noopener">Open it in the model lab →</a>');
  }
}
function undo(){
  if (!S.undo.length){ say("", "Nothing to undo — you are back at the root."); return; }
  var s = JSON.parse(S.undo.pop());
  S.tab = s.tab; S.sel = s.sel; S.closing = s.closing;
  say("", "Stepped back one move.");
  draw();
}

/* ═════════════════════════════════════════════ drawing */
function draw(flash){
  drawRules();
  var c = $("#canvas");
  if (!S.tab){ c.innerHTML = ""; return; }
  c.innerHTML = '<div class="tree">' + segHTML(S.tab, S.tab.root) + "</div>";
  equalize(c);
  if (flash && S.newLines){
    S.newLines.forEach(function(id){
      var el = c.querySelector('[data-line="' + id + '"]');
      if (el) el.classList.add("hi");
    });
    S.newLines = null;
  }
}
function segHTML(tab, seg){
  var sg = tab.segs[seg], h = '<div class="seg"><div class="lines">';
  h += sg.lines.map(function(id){ return lineHTML(tab, id); }).join("") + "</div>";
  if (sg.kids.length){
    h += '<div class="fork">' + sg.kids.map(function(k){
      return '<div class="branch-col">' + segHTML(tab, k) + "</div>";
    }).join("") + "</div>";
  } else h += tipHTML(tab, seg);
  return h + "</div>";
}
function lineHTML(tab, id){
  var L = tab.lines[id], cls = ["line"];
  if (L.kind === "rel") cls.push("rel");
  else {
    var r = ruleFor(L.s, L.f);
    if (r && r.kind === "stop") cls.push("stopped");
    else {
      var spent = (r && (r.kind === "all" || r.kind === "allD"))
        ? !leaves(tab, L.seg, "active").some(function(lf){ return allTargets(tab, lf, L).length; })
        : L.used;
      if (spent && r) cls.push("used");
    }
  }
  if (S.sel === id) cls.push("sel");
  if (S.closing && S.closing.picks.indexOf(id) >= 0) cls.push("pick");
  return '<button type="button" class="' + cls.join(" ") + '" data-line="' + id + '">' +
    '<span class="num">' + id + '</span><span class="tick">✓</span>' +
    '<span class="body">' + (L.kind === "rel" ? rf(L.a, L.b, L.lab) : sf(L.w, L.s, L.f)) + "</span>" +
    '<span class="just">' + (L.src ? L.src + ' <span class="rc">' + L.rule + "</span>"
                                   : L.rule ? '<span class="rc">' + L.rule + "</span>" : "") + "</span></button>";
}
function tipHTML(tab, seg){
  var sg = tab.segs[seg];
  if (sg.state === "closed")
    return '<div class="tip closed"><span class="mark">×</span><span class="note">closed · ' +
      sg.closure[0] + ", " + sg.closure[1] + "</span></div>";
  if (sg.state === "open"){
    var mo = modelOn(tab, seg);
    return '<div class="tip open"><span class="mark">○</span><span class="note">' +
      modelText(mo) + "</span></div>";
  }
  if (pathLines(tab, seg).length < 2) return "";
  if (S.closing && S.closing.seg === seg){
    var left = 2 - S.closing.picks.length;
    return '<div class="tip"><span class="prompt">pick ' + left + " more line" + (left === 1 ? "" : "s") +
      '</span><button class="tipbtn" data-act="cancel">cancel</button></div>';
  }
  if (stuckOn(tab, seg))
    return '<div class="tip"><span class="prompt">no rule left that this page will take</span></div>';
  return '<div class="tip"><div class="acts">' +
    '<button class="tipbtn c" data-act="close" data-seg="' + seg + '">Close ×</button>' +
    '<button class="tipbtn o" data-act="open" data-seg="' + seg + '">Open ○</button></div></div>';
}
function equalize(root){
  var forks = Array.prototype.slice.call(root.querySelectorAll(".fork")).reverse();
  forks.forEach(function(fork){
    var kids = Array.prototype.slice.call(fork.children).filter(function(n){
      return n.classList && n.classList.contains("branch-col");
    });
    kids.forEach(function(k){ k.style.width = ""; });
    var w = 0;
    kids.forEach(function(k){ w = Math.max(w, k.getBoundingClientRect().width); });
    kids.forEach(function(k){ k.style.width = w + "px"; });
  });
}
/* Which families of rule are on show depends on the formula: a page about
   □ and ◇ should not be carrying a row of program laws it will never need. */
function usesProg(g){
  var hit = false;
  (function walk(h){
    if (hit || !h || h.k === "atom" || h.k === "top" || h.k === "bot") return;
    if ((h.k === "box" || h.k === "dia") && h.pr && h.pr.p !== "atom"){ hit = true; return; }
    if (h.k === "not" || MODAL[h.k]){
      if (h.pr) progTests(h.pr).forEach(walk);
      walk(h.a); return;
    }
    walk(h.a); walk(h.b);
  })(g);
  return hit;
}
function usesEpi(g){
  var hit = false;
  (function walk(h){
    if (hit || !h || h.k === "atom" || h.k === "top" || h.k === "bot") return;
    if (h.k === "e" || h.k === "d" || h.k === "c"){ hit = true; return; }
    if (h.k === "not" || MODAL[h.k]){
      if (h.pr) progTests(h.pr).forEach(walk);
      walk(h.a); return;
    }
    walk(h.a); walk(h.b);
  })(g);
  return hit;
}
function drawRules(){
  var L = (S.tab && S.sel !== null) ? S.tab.lines[S.sel] : null;
  var mine = null;
  if (L && L.kind === "fml"){
    var r = ruleFor(L.s, L.f);
    mine = r && r.kind !== "stop" ? r.code : null;
  }
  var groups = [["alpha","α","extends the branch"], ["beta","β","splits the branch"],
                ["all","∀","sends it along every arrow"], ["new","∃","makes a new world"]];
  if (S.root && usesProg(S.root)) groups.splice(2, 0, ["prog","π","trades a program for a smaller one"]);
  var showEpi = S.root && usesEpi(S.root);
  var h = "";
  groups.forEach(function(g){
    var rs = RULES.filter(function(x){
      if (x.kind !== g[0]) return false;
      if (PROGCODES[x.code]) return true;
      if (EPICODES[x.code]) return showEpi;
      return true;
    });
    if (!rs.length) return;
    h += '<div class="rulegroup"><span class="glyph" title="' + g[2] + '">' + g[1] + '</span><div class="rulerow">';
    rs.forEach(function(R){
      var cls = "rule" + (mine ? (mine === R.code ? " armed" : " dim") : "");
      h += '<button type="button" class="' + cls + '" data-rule="' + R.code + '">' +
        '<span class="code">' + R.code + '</span><span class="sch">' + R.prem + '<span class="ar">⇒</span>' +
        R.out.map(function(b){ return b.join(", "); }).join('<span class="bar">|</span>') + "</span></button>";
    });
    h += "</div></div>";
  });
  /* who the agents are, when the formula has an operator that quantifies over
     them and so cannot say on its own */
  if (showEpi){
    h += '<div class="rulegroup"><span class="glyph" title="the agents E and D range over">ag</span>' +
         '<div class="rulerow agrow"><span class="aglist">' +
         (S.ags.length ? S.ags.map(function(g){ return "<i>" + g + "</i>"; }).join(" ") : "none") +
         '</span><button type="button" class="tipbtn" data-act="agadd">+ agent</button>' +
         '<button type="button" class="tipbtn" data-act="agdrop">− agent</button></div></div>';
  }
  /* the frame conditions: a switch for the logic, and a button to apply one,
     one row per relation the formula uses */
  (S.labs || [""]).forEach(function(lab){
    var on = onOf(lab);
    h += '<div class="rulegroup"><span class="glyph" title="the frame conditions of the logic">' +
         (lab === "" ? "R" : "R<sub>" + lab + "</sub>") + '</span><div class="rulerow">';
    COND.forEach(function(C){
      var live = on[C.k];
      var work = live && S.tab ? leaves(S.tab, S.tab.root, "active")
        .reduce(function(t, lf){ return t + condWork(S.tab, lf, lab, C.k).length; }, 0) : 0;
      h += '<span class="condwrap">' +
        '<button type="button" class="condsw' + (live ? " on" : "") + '" data-cond-toggle="' + lab +
          '|' + C.k + '" title="' + (live ? "On: " : "Off: ") + C.k + ' frames' +
          (lab ? " for " + lab : "") + ' — axiom ' + C.ax + '">' + C.ax + "</button>" +
        '<button type="button" class="rule cond' + (live ? (work ? " armed" : " dim") : " off") +
          '" data-cond="' + lab + '|' + C.k + '" title="' + C.law + '">' +
          '<span class="code">' + C.lbl + '</span><span class="sch">' + C.k + "</span></button></span>";
    });
    h += '<span class="logicname">' + (lab === "" ? "" : "<i>" + lab + "</i> is ") +
         "<b>" + logicOf(lab) + "</b></span>";
    h += "</div></div>";
  });
  $("#rules").innerHTML = h;
}
/* ═════════════════════════════════════════════ connective pad */
/* The caret is remembered so a pad press inserts where the student was
   typing, even on touch where the input loses focus first. */
var caret = null;
function rememberCaret(){
  var el = $("#formula");
  if (el.selectionStart !== null) caret = [el.selectionStart, el.selectionEnd];
}
["input","click","keyup","select","blur"].forEach(function(ev){
  $("#formula").addEventListener(ev, rememberCaret);
});

function insertSym(ch){
  var el = $("#formula"), v = el.value, a, b;
  if (document.activeElement === el && el.selectionStart !== null){
    a = el.selectionStart; b = el.selectionEnd;
  } else if (caret){ a = caret[0]; b = caret[1]; }
  if (a === undefined || a === null){ a = b = v.length; }
  el.value = v.slice(0, a) + ch + v.slice(b);
  var pos = a + ch.length;
  caret = [pos, pos];
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e){}
}

/* keep the caret: don't let the button take focus away from the input */
$("#pad").addEventListener("mousedown", function(e){
  if (e.target.closest("[data-sym]")) e.preventDefault();
});

/* ═════════════════════════════════════════════ wiring */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-sym],[data-line],[data-rule],[data-cond],[data-cond-toggle],[data-act],[data-sign]");
  if (!t) return;
  if (t.hasAttribute("data-sym")){ insertSym(t.dataset.sym); return; }
  if (t.hasAttribute("data-sign")){
    S.sign = t.dataset.sign;
    document.querySelectorAll("[data-sign]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.sign === S.sign));
    });
    build($("#formula").value);
    return;
  }
  if (t.hasAttribute("data-line")){ selectLine(+t.dataset.line); return; }
  if (t.hasAttribute("data-rule")){ clickRule(t.dataset.rule); return; }
  if (t.hasAttribute("data-cond-toggle")){
    var ct = t.dataset.condToggle.split("|"); toggleCond(ct[0], ct[1]); return; }
  if (t.hasAttribute("data-cond")){
    var cc = t.dataset.cond.split("|"); clickCond(cc[0], cc[1]); return; }
  var a = t.dataset.act;
  if (a === "close") startClosing(t.dataset.seg);
  else if (a === "open") markOpen(t.dataset.seg);
  else if (a === "cancel"){ S.closing = null; say("", "Closure cancelled."); draw(); }
  else if (a === "agadd") addAgent();
  else if (a === "agdrop") dropAgent();
});

$("#entry").addEventListener("submit", function(e){ e.preventDefault(); build($("#formula").value); });
$("#undo").addEventListener("click", undo);
$("#reset").addEventListener("click", function(){
  /* a restart re-runs the formula already in the box; not a submission */
  var was = LOG_READY; LOG_READY = false;
  build($("#formula").value);
  LOG_READY = was;
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){
    if (S.closing){ S.closing = null; draw(); }
    else if (S.sel !== null){ S.sel = null; draw(); }
  }
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});

window.addEventListener("resize", function(){ if (S.tab) equalize($("#canvas")); });

build($("#formula").value);
LOG_READY = true;
if (document.fonts) document.fonts.ready.then(function(){ if (S.tab) equalize($("#canvas")); });

/* ── theme toggle ─────────────────────────────────────── */
function themeNow(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch (e){ return "light"; }
}
function syncTheme(){
  var b = document.getElementById("themeBtn"), next = themeNow() === "dark" ? "light" : "dark";
  b.title = "Switch to the " + next + " theme";
  b.setAttribute("aria-label", b.title);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("logic.theme", next); } catch (e){}
  syncTheme();
});
syncTheme();
</script>
