<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Labelled tableaux for modal logic: signed formulas carry a world, the arrows are written down and carry the name of their relation, so K_a, E, D and the programs of PDL all work, and a branch that survives is a Kripke countermodel you can open in the model lab.">
<title>Modal Tableaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F3F4F8;
  --paper:#FFFFFF;
  --soft:#E7EAF2;
  --ink:#171A26;
  --ink-2:#5D6379;
  --ink-3:#8A91A6;
  --line:#D3D7E4;
  --accent:#2E3FA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E4FB;
  --closed:#1F7A5C;
  --closed-soft:#D8EEE5;
  --open:#A46200;
  --open-soft:#FAEBD4;
  --error:#B3261E;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:"Newsreader", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --paper:#191C29; --soft:#232736;
    --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
    --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
    --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#37280F;
    --error:#F3897D;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111320; --paper:#191C29; --soft:#232736;
  --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
  --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
  --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#37280F;
  --error:#F3897D;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

#app{height:100%; display:flex; flex-direction:column; padding-inline:20px; max-width:1300px; margin:0 auto}

/* ── input row ─────────────────────────────────────────── */
.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.wordmark{
  font-family:var(--serif); font-size:17px; color:var(--ink-2);
  white-space:nowrap; margin-right:2px;
}
.wordmark span{color:var(--accent)}
.sibling{font-size:12px; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px}
.sibling:hover{color:var(--accent)}
form{display:flex; align-items:center; gap:8px; flex:1; min-width:280px; flex-wrap:wrap}
.tf{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none; background:var(--paper)}
.tf button{
  border:0; background:transparent; padding:7px 13px;
  font-family:var(--mono); font-size:13px; color:var(--ink-3);
}
.tf button+button{border-left:1px solid var(--line)}
.tf button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
input[type=text]{
  flex:1; min-width:0; font-family:var(--mono); font-size:15px;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.go{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:7px; padding:8px 16px; font-weight:500;
}
.go:hover{filter:brightness(1.08)}
.link{
  border:0; background:transparent; color:var(--ink-3); padding:6px 4px;
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--ink)}

/* ── connective pad ────────────────────────────────────── */
.pad{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-basis:100%}
.pad button{
  font-family:var(--serif); font-size:17px; line-height:1;
  min-width:36px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s;
}
.pad button:hover{background:var(--soft); border-color:var(--ink-3)}
.pad button:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pad .gap{width:10px}
.padhint{font-size:12px; color:var(--ink-3); margin-left:4px}
.padhint code{font-family:var(--mono); font-size:11.5px}

/* ── rule table ────────────────────────────────────────── */
.rules{display:flex; flex-wrap:wrap; gap:16px 26px; padding-block:2px 14px; border-bottom:1px solid var(--line)}
.rulegroup{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
.glyph{
  font-family:var(--serif); font-size:16px; color:var(--accent);
  padding-top:3px; width:1em; flex:none;
}
.rulerow{display:flex; flex-wrap:wrap; gap:4px}
.rule{
  display:flex; align-items:baseline; gap:8px;
  border:1px solid transparent; background:transparent; border-radius:6px;
  padding:3px 8px; transition:background .1s, opacity .1s;
}
.rule:hover{background:var(--soft)}
.rule .code{font-family:var(--serif); font-size:14px; color:var(--accent); flex:none}
.rule .sch{font-family:var(--serif); font-size:14px; white-space:nowrap}
.rule .sch .ar{font-family:var(--sans); font-size:10px; color:var(--ink-3); margin:0 .4em}
.rule .sch .bar{color:var(--line); margin:0 .3em}
.rule.armed{background:var(--accent); border-color:var(--accent)}
.rule.armed .code,.rule.armed .sch,.rule.armed .ar,.rule.armed .bar{color:var(--accent-ink)}
.rule.dim{opacity:.3}

/* ── status ────────────────────────────────────────────── */
.status{
  display:flex; align-items:baseline; gap:10px;
  padding-block:11px; min-height:42px; font-size:13.5px; color:var(--ink-2);
}
.status .msg{flex:1}
.status .f{white-space:normal}
.status.ok{color:var(--closed)}
.status.err{color:var(--error)}
.status.warn{color:var(--accent)}
.status b{font-weight:500; color:var(--ink)}
.status.ok b,.status.err b,.status.warn b{color:inherit; font-weight:600}
.status .acts{display:flex; gap:2px; flex:none}

/* ── formulas ──────────────────────────────────────────── */
.f{font-family:var(--serif); font-size:16.5px; line-height:1.3; white-space:nowrap}
.f i{font-style:italic}
.f .op{margin:0 .26em}
.f .op.neg{margin:0 .04em 0 0}
.f .pr{color:var(--ink-3)}
.sg{
  display:inline-block; min-width:1.35em; text-align:center; margin-right:.5em;
  font-family:var(--mono); font-size:10.5px; line-height:1.55; border-radius:3px;
  transform:translateY(-2px);
}
.sg.T{background:var(--ink); color:var(--bg)}
.sg.F{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}

/* ── tree ──────────────────────────────────────────────── */
.canvas{
  flex:1; min-height:0; overflow:auto;
  padding:30px 20px 60px; background:var(--paper);
  border:1px solid var(--line); border-radius:10px; margin-bottom:18px;
}
.tree{display:flex; justify-content:center; min-width:min-content}
.seg{display:flex; flex-direction:column; align-items:center}
.lines{display:flex; flex-direction:column; gap:1px}

.line{
  display:flex; align-items:baseline; gap:8px; white-space:nowrap;
  padding:2px 8px 2px 4px; border-radius:5px;
  border:1px solid transparent; background:transparent; text-align:left;
}
.line .num{
  font-family:var(--mono); font-size:10.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-3); width:2.2em; text-align:right; flex:none;
}
.line .tick{font-family:var(--mono); font-size:11px; width:1em; flex:none; color:var(--closed); opacity:0}
.line.used .tick{opacity:1}
.line .body{flex:1}
.line .just{font-family:var(--mono); font-size:10px; color:var(--ink-3); padding-left:18px; flex:none}
.line .just .rc{font-family:var(--serif); font-size:12.5px}
.line.used .f{opacity:.6}
button.line{transition:background .1s, border-color .1s}
button.line:hover{background:var(--soft); border-color:var(--line)}
button.line.sel{border-color:var(--accent); background:var(--accent-soft)}
button.line.sel .num{color:var(--accent)}
button.line.pick{border-color:var(--error)}
.line.hi{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)} to{background:transparent}}

.fork{position:relative; display:flex; align-items:flex-start; justify-content:center}
.fork::before{content:""; position:absolute; top:0; left:50%; width:1px; height:15px; background:var(--line)}
.fork::after{content:""; position:absolute; top:15px; left:25%; right:25%; height:1px; background:var(--line)}
.branch-col{position:relative; padding:34px 20px 0; display:flex; justify-content:center; flex:none}
.branch-col::before{content:""; position:absolute; top:15px; left:50%; width:1px; height:19px; background:var(--line)}

.tip{position:relative; padding-top:20px; display:flex; flex-direction:column; align-items:center; gap:5px}
.tip::before{content:""; position:absolute; top:2px; left:50%; width:1px; height:14px; background:var(--line)}
.tip .mark{font-family:var(--serif); font-size:20px; line-height:1}
.tip.closed .mark{color:var(--closed)}
.tip.open .mark{color:var(--open)}
.note{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap}
.tip.closed .note{background:var(--closed-soft); color:var(--closed)}
.tip.open .note{background:var(--open-soft); color:var(--open)}
.tip .acts{display:flex; gap:4px}
.tipbtn{
  border:1px solid var(--line); background:var(--paper); border-radius:6px;
  padding:3px 9px; font-size:11.5px; color:var(--ink-2);
}
.tipbtn.c:hover{border-color:var(--closed); color:var(--closed)}
.tipbtn.o:hover{border-color:var(--open); color:var(--open)}
.tip .prompt{font-family:var(--mono); font-size:10px; color:var(--error)}

@media (max-width:760px){
  #app{height:auto; min-height:100%; padding-inline:16px}
  .canvas{min-height:460px}
  .wordmark{display:none}
  .pad button{min-width:34px; padding:6px 7px; font-size:16px}
  .padhint{flex-basis:100%; margin:2px 0 0}
  .rules{gap:12px 18px}
  .rule .sch{font-size:13px}
}
.theme{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-2);
  border-radius:6px; padding:3px 9px; font-size:14px; line-height:1.35;
  cursor:pointer; flex:none;
}
.theme:hover{border-color:var(--accent); color:var(--accent)}
/* ── modal additions ───────────────────────────────────── */
.wl{font-family:var(--mono); font-size:10.5px; color:var(--accent); margin-right:6px}
.rr{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin:0 5px}
.line.rel .body{opacity:.95}
.line.rel .wl{color:var(--ink-2)}
.f .md{margin-right:.08em}
.f .pop{color:var(--ink-3); margin:0 .04em}
.f .pn2{font-style:italic}
.rr sub{font-size:.75em}
.line.stopped .body{opacity:.55}
.line.stopped .num{color:var(--accent)}
.rulerow .logicname{padding-left:8px}
.agrow{align-items:center}
.aglist{font-family:var(--serif); font-size:13px; padding-right:6px}
.condwrap{display:inline-flex; align-items:stretch; gap:0}
.condsw{
  font-family:var(--mono); font-size:10px; min-width:20px; padding:0 5px;
  border:1px solid var(--line); border-right:0; border-radius:6px 0 0 6px;
  background:var(--paper); color:var(--ink-3);
}
.condsw.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rule.cond{border-radius:0 6px 6px 0}
.rule.cond.off{opacity:.3}
.logicname{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); align-self:center; white-space:nowrap; padding-left:2px;
}
.logicname b{color:var(--accent); font-weight:500}
.golink{color:var(--accent); text-decoration:underline; text-underline-offset:3px}
.tip.open .note{font-family:var(--mono); font-size:9.5px}
</style>
<script>
/* stamp the saved theme before anything paints, so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("logic.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>

<body>
<div id="app">
  <div class="top">
    <span class="wordmark"><span>◻</span> Modal tableaux</span>
    <a class="sibling" href="index.html">← All solvers</a>
    <button class="theme" id="themeBtn" type="button">◐</button>
    <form id="entry">
      <div class="tf" role="group" aria-label="Sign for the root formula">
        <button type="button" data-sign="T" aria-pressed="false">T</button>
        <button type="button" data-sign="F" aria-pressed="true">F</button>
      </div>
      <input type="text" id="formula" spellcheck="false" autocomplete="off"
             aria-label="Formula" value="<>(p | <>p) -> <>p">
      <button type="submit" class="go">Build tree</button>
      <div class="pad" id="pad" role="group" aria-label="Insert a connective">
        <button type="button" data-sym="¬" aria-label="Insert negation" title="negation — also typed as ~ or !">¬</button>
        <button type="button" data-sym="∧" aria-label="Insert conjunction" title="conjunction — also typed as &amp; or /\">∧</button>
        <button type="button" data-sym="∨" aria-label="Insert disjunction" title="disjunction — also typed as | or \/">∨</button>
        <button type="button" data-sym="⊃" aria-label="Insert implication" title="implication — also typed as -&gt;, =&gt; or →">⊃</button>
        <button type="button" data-sym="≡" aria-label="Insert biconditional" title="biconditional — also typed as &lt;-&gt;, &lt;=&gt; or ↔">≡</button>
        <span class="gap"></span>
        <button type="button" data-sym="□" aria-label="Insert box" title="necessarily — also typed as []">□</button>
        <button type="button" data-sym="◇" aria-label="Insert diamond" title="possibly — also typed as &lt;&gt;">◇</button>
        <span class="gap"></span>
        <button type="button" data-sym="K_a " aria-label="Insert agent knowledge" title="K_a A — agent a knows A">K<sub>a</sub></button>
        <button type="button" data-sym="E " aria-label="Insert everyone knows" title="E A — everyone knows A, along the union of the agents">E</button>
        <button type="button" data-sym="D " aria-label="Insert distributed knowledge" title="D A — distributed knowledge, along the intersection of the agents">D</button>
        <span class="gap"></span>
        <button type="button" data-sym="[a]" aria-label="Insert program box" title="[α]A — after every run of the program α, A">[α]</button>
        <button type="button" data-sym="&lt;a&gt;" aria-label="Insert program diamond" title="⟨α⟩A — some run of α ends with A">⟨α⟩</button>
        <button type="button" data-sym=";" aria-label="Insert sequence" title="α;β — α then β">;</button>
        <button type="button" data-sym="∪" aria-label="Insert choice" title="α∪β — either one; also typed as +">∪</button>
        <button type="button" data-sym="*" aria-label="Insert iteration" title="α* — α any number of times, zero included">*</button>
        <button type="button" data-sym="?" aria-label="Insert test" title="A? — go nowhere, but only where A holds">?</button>
        <span class="gap"></span>
        <button type="button" data-sym="(" aria-label="Insert opening bracket">(</button>
        <button type="button" data-sym=")" aria-label="Insert closing bracket">)</button>
        <span class="padhint"><code>[]</code> is □ and <code>&lt;&gt;</code> is ◇; <code>[a]</code> and <code>&lt;a&gt;</code> take a program; the switches below pick the logic, one row per relation</span>
      </div>
    </form>
  </div>

  <div class="rules" id="rules"></div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="msg"></span>
    <span class="acts">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="reset">Restart</button>
    </span>
  </div>

  <div class="canvas" id="canvas"></div>
</div>

<script>
"use strict";

/* ═════════════════════════════════════════════ logging */
/* One line per formula submitted: someone types a formula, presses the button,
   and that is recorded. Nothing else is — no rule steps, no verdicts, no page
   views. Posts to the host that served this page, same origin; a failure is
   swallowed, so logging can never break the tool. LOG_URL = "" switches it off. */
var LOG_URL = "log.php";
var LOG_PAGE = "modaltab";
var LOG_READY = false;      /* the formula a page loads with is not a submission */

function logFormula(data){
  if (!LOG_URL) return;
  try {
    var ev = {t:new Date().toISOString(), p:LOG_PAGE};
    Object.keys(data).forEach(function(k){
      var v = data[k];
      ev[k] = (typeof v === "string" && v.length > 300) ? v.slice(0, 300) : v;
    });
    var body = JSON.stringify([ev]);
    if (navigator.sendBeacon &&
        navigator.sendBeacon(LOG_URL, new Blob([body], {type:"application/json"}))) return;
    fetch(LOG_URL, {method:"POST", body:body, keepalive:true,
                    headers:{"Content-Type":"application/json"}}).catch(function(){});
  } catch (e){}
}


/* ═════════════════════════════════════════════ formulas */
/* Propositional, plus every modality the course uses. They all bind as
   tightly as ¬ does, so □p ∧ q is (□p) ∧ q and the other reading needs
   brackets.

     □ A  ◇ A      along the one plain relation
     K_a A         along agent a's arrows                      (lecture 13)
     E A           along the union of every agent's arrows
     D A           along the intersection of them
     [α]A  ⟨α⟩A    along the relation the program α denotes     (lecture 14)

   The syntax is kripke.html's, so a formula typed into one page can be
   pasted straight into the other. */
var OPCH = {and:"∧", or:"∨", imp:"⊃", iff:"≡"};
var MDCH = {box:"□", dia:"◇"};
var MODAL = {box:1, dia:1, ka:1, e:1, c:1, d:1};
/* the ones that say "every successor"; dia is the only existential head */
var UNIV = {box:1, ka:1, e:1, c:1, d:1};

function show(g, esc, wrap, neg, opw, cst, mod){
  cst = cst || function(t){ return t; };
  mod = mod || function(m){ return m; };
  function needs(c, pk, left){
    if (c.k === "atom" || c.k === "not" || c.k === "top" || c.k === "bot" || MODAL[c.k]) return false;
    if (pk === "not" || MODAL[pk]) return true;
    if ((pk === "and" || pk === "or") && c.k === pk && left) return false;
    return true;
  }
  function go(h, pk, left){ var s = body(h); return needs(h, pk, left) ? wrap(s) : s; }
  function body(h){
    if (h.k === "atom") return esc(h.n);
    if (h.k === "top") return cst("⊤");
    if (h.k === "bot") return cst("⊥");
    if (h.k === "not") return neg() + go(h.a, "not", false);
    if (h.k === "box" || h.k === "dia"){
      if (h.pr) return mod(h.k === "box" ? "[" : "⟨", null, h.pr) + go(h.a, h.k, false);
      return mod(MDCH[h.k]) + go(h.a, h.k, false);
    }
    if (h.k === "ka") return mod("K", h.ag) + go(h.a, h.k, false);
    if (h.k === "e" || h.k === "c" || h.k === "d")
      return mod(h.k.toUpperCase()) + go(h.a, h.k, false);
    return go(h.a, h.k, true) + opw(OPCH[h.k]) + go(h.b, h.k, false);
  }
  return body(g);
}
function fmtHTML(g){
  return show(g,
    function(n){ return "<i>" + n + "</i>"; },
    function(s){ return '<span class="pr">(</span>' + s + '<span class="pr">)</span>'; },
    function(){ return '<span class="op neg">¬</span>'; },
    function(o){ return '<span class="op">' + o + "</span>"; },
    function(t){ return '<span class="cst">' + t + "</span>"; },
    function(m, ag, pr){
      if (pr) return '<span class="md">' + m + "</span>" + progHTML(pr) +
        '<span class="md">' + (m === "[" ? "]" : "⟩") + "</span>";
      return '<span class="md">' + m + (ag ? "<sub>" + ag + "</sub>" : "") + "</span>";
    });
}
function fmtText(g){
  return show(g, function(n){ return n; }, function(s){ return "(" + s + ")"; },
    function(){ return "¬"; }, function(o){ return o; }, function(t){ return t; },
    /* A word operator needs a space or it runs into what follows: K_a p, not
       K_ap, which would lex as one name and make the agent "ap". */
    function(m, ag, pr){
      if (pr) return (m === "[" ? "[" : "<") + progText(pr) + (m === "[" ? "]" : ">");
      return /[A-Z]/.test(m) ? m + (ag ? "_" + ag : "") + " " : m;
    });
}
/* ── programs ── */
/* A program is a regular expression over the relation names: ; composes,
   ∪ unions, * is the reflexive-transitive closure and A? is the identity cut
   down to the worlds where A holds. */
function progText(pr){ return progShow(pr, function(f){ return fmtText(f); }, false); }
function progHTML(pr){ return progShow(pr, function(f){ return fmtHTML(f); }, true); }
function progShow(pr, fml, html){
  var op = html ? function(c){ return '<span class="pop">' + c + "</span>"; }
                : function(c){ return c; };
  var nm = html ? function(n){ return '<span class="pn2">' + n + "</span>"; }
                : function(n){ return n; };
  function go(x, lvl){
    var s, need;
    if (x.p === "atom"){ return nm(x.n); }
    if (x.p === "test"){ return fml(x.f) + op("?"); }
    if (x.p === "star"){ return go(x.a, 3) + op("*"); }
    if (x.p === "seq"){ s = go(x.a, 2) + op(";") + go(x.b, 2); need = lvl > 2; }
    else { s = go(x.a, 1) + op("∪") + go(x.b, 1); need = lvl > 1; }
    return need ? op("(") + s + op(")") : s;
  }
  return go(pr, 0);
}
function progTests(pr, out){
  out = out || [];
  if (pr.p === "test"){ out.push(pr.f); return out; }
  if (pr.p === "atom") return out;
  if (pr.p === "star") return progTests(pr.a, out);
  progTests(pr.a, out); progTests(pr.b, out);
  return out;
}
function eqProg(a, b){
  if (a.p !== b.p) return false;
  if (a.p === "atom") return a.n === b.n;
  if (a.p === "test") return eqF(a.f, b.f);
  if (a.p === "star") return eqProg(a.a, b.a);
  return eqProg(a.a, b.a) && eqProg(a.b, b.b);
}
function atomsOf(g, out){
  out = out || [];
  if (g.k === "atom"){ if (out.indexOf(g.n) < 0) out.push(g.n); }
  else if (g.k === "top" || g.k === "bot"){ /* none */ }
  else if (g.k === "not" || MODAL[g.k]){
    if (g.pr) progTests(g.pr).forEach(function(t){ atomsOf(t, out); });
    atomsOf(g.a, out);
  }
  else { atomsOf(g.a, out); atomsOf(g.b, out); }
  return out;
}
/* Every relation the formula travels along, as the labels the arrows will
   carry. "" is the plain relation of □ and ◇; a name is an agent or an
   atomic program, which are the same thing to the calculus. */
function labelsOf(g, out){
  out = out || [];
  function add(n){ if (out.indexOf(n) < 0) out.push(n); }
  function walk(h){
    if (h.k === "atom" || h.k === "top" || h.k === "bot") return;
    if (h.k === "ka"){ add(h.ag); walk(h.a); return; }
    if (h.k === "box" || h.k === "dia"){
      if (!h.pr) add("");
      else {
        progLabels(h.pr).forEach(add);
        progTests(h.pr).forEach(walk);
      }
      walk(h.a); return;
    }
    if (h.k === "not" || MODAL[h.k]){ walk(h.a); return; }
    walk(h.a); walk(h.b);
  }
  walk(g);
  return out;
}
function progLabels(pr, out){
  out = out || [];
  if (pr.p === "atom"){ if (out.indexOf(pr.n) < 0) out.push(pr.n); return out; }
  if (pr.p === "test") return out;
  if (pr.p === "star") return progLabels(pr.a, out);
  progLabels(pr.a, out); progLabels(pr.b, out);
  return out;
}
/* the named relations only — E and D quantify over these, and the plain
   relation of □ is not one of them */
function agentsOf(g){ return labelsOf(g).filter(function(x){ return x !== ""; }); }
function eqF(a, b){
  if (a.k !== b.k) return false;
  if (a.k === "atom") return a.n === b.n;
  if (a.k === "top" || a.k === "bot") return true;
  if (a.k === "ka" && a.ag !== b.ag) return false;
  if (a.k === "box" || a.k === "dia"){
    if (!!a.pr !== !!b.pr) return false;
    if (a.pr && !eqProg(a.pr, b.pr)) return false;
    return eqF(a.a, b.a);
  }
  if (a.k === "not" || MODAL[a.k]) return eqF(a.a, b.a);
  return eqF(a.a, b.a) && eqF(a.b, b.b);
}

/* ═════════════════════════════════════════════ parser */
var SYMS = [
  ["<->","iff"], ["<=>","iff"], ["↔","iff"], ["≡","iff"],
  ["->","imp"], ["=>","imp"], ["→","imp"], ["⊃","imp"],
  ["/\\","and"], ["&&","and"], ["∧","and"], ["&","and"], ["^","and"],
  ["\\/","or"], ["||","or"], ["∨","or"], ["|","or"],
  ["¬","not"], ["~","not"], ["!","not"],
  ["[]","box"], ["□","box"], ["<>","dia"], ["◇","dia"],
  ["⊤","top"], ["⊥","bot"], ["1","top"], ["0","bot"],
  ["(","lp"], [")","rp"],
  /* after the longer ones, so [] and <> still win: these open a program */
  ["[","lbox"], ["]","rbox"], ["⟨","lang"], ["<","lang"], ["⟩","rang"], [">","rang"],
  [";","seq"], ["∪","alt"], ["+","alt"], ["*","star"], ["?","test"]
];
/* K_a is one word to the tokeniser, which is exactly what makes it readable:
   the agent travels with the operator instead of being a separate token. */
function wordOp(v){
  var m = /^K_(.+)$/.exec(v);
  if (m) return {k:"ka", ag:m[1]};
  if (v === "E") return {k:"e"};
  if (v === "C") return {k:"c"};
  if (v === "D") return {k:"d"};
  return null;
}
function tokenize(src){
  var t = [], i = 0;
  outer: while (i < src.length){
    var c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[A-Za-z]/.test(c)){
      var j = i + 1;
      while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      t.push({t:"atom", v:src.slice(i, j), i:i}); i = j; continue;
    }
    for (var k = 0; k < SYMS.length; k++){
      if (src.startsWith(SYMS[k][0], i)){
        t.push({t:SYMS[k][1], v:SYMS[k][0], i:i}); i += SYMS[k][0].length; continue outer;
      }
    }
    throw new Error("I don’t recognise “" + c + "” at position " + (i + 1) + ".");
  }
  t.push({t:"end", v:"", i:src.length});
  return t;
}
function parse(src){
  if (!src.trim()) throw new Error("Nothing to build a tree for — type a formula.");
  var t = tokenize(src), p = 0;
  function peek(){ return t[p].t; }
  function eat(k){ return t[p].t === k ? t[p++] : null; }
  function iff(){ var l = impR(); while (peek() === "iff"){ p++; l = {k:"iff", a:l, b:impR()}; } return l; }
  function impR(){ var l = or(); if (peek() === "imp"){ p++; return {k:"imp", a:l, b:impR()}; } return l; }
  function or(){ var l = and(); while (peek() === "or"){ p++; l = {k:"or", a:l, b:and()}; } return l; }
  function and(){ var l = un(); while (peek() === "and"){ p++; l = {k:"and", a:l, b:un()}; } return l; }
  /* a program: ∪ loosest, then ;, then * and ? tightest */
  function prog(){
    var l = pseq();
    while (peek() === "alt"){ p++; l = {p:"alt", a:l, b:pseq()}; }
    return l;
  }
  function pseq(){
    var l = pstar();
    while (peek() === "seq"){ p++; l = {p:"seq", a:l, b:pstar()}; }
    return l;
  }
  function pstar(){
    var l = patom();
    while (peek() === "star"){ p++; l = {p:"star", a:l}; }
    return l;
  }
  function patom(){
    if (eat("lp")){
      /* (…) is a sub-program, unless a ? follows, in which case what is in
         the brackets was a formula all along and this is a test */
      var save = p - 1;
      try {
        var x = prog();
        if (eat("rp")){
          if (eat("test")){ p = save; throw 0; }
          return x;
        }
        throw 0;
      } catch (e){
        p = save;
        if (!eat("lp")) throw new Error("A “(” in the program is never closed.");
        var f2 = iff();
        if (!eat("rp")) throw new Error("A “(” in the program is never closed.");
        if (!eat("test")) throw new Error("A bracketed formula in a program has to be a test — write (A)?");
        return {p:"test", f:f2};
      }
    }
    var a = eat("atom");
    if (!a) throw new Error("Expected an action or a test at position " + (t[p].i + 1) +
      ", found “" + t[p].v + "”. A program is built from the relation names with ; ∪ * and A?");
    if (eat("test")) return {p:"test", f:{k:"atom", n:a.v}};
    return {p:"atom", n:a.v};
  }
  function un(){
    if (peek() === "not"){ p++; return {k:"not", a:un()}; }
    if (peek() === "box"){ p++; return {k:"box", a:un()}; }
    if (peek() === "dia"){ p++; return {k:"dia", a:un()}; }
    if (peek() === "lbox"){
      p++; var pb = prog();
      if (!eat("rbox")) throw new Error("A “[” is never closed — write [a]A.");
      return {k:"box", pr:pb, a:un()};
    }
    if (peek() === "lang"){
      p++; var pd = prog();
      if (!eat("rang")) throw new Error("A “⟨” is never closed — write ⟨a⟩A.");
      return {k:"dia", pr:pd, a:un()};
    }
    if (peek() === "atom"){
      var op = wordOp(t[p].v);
      if (op){ p++; var node = {k:op.k, a:un()}; if (op.ag) node.ag = op.ag; return node; }
    }
    if (eat("top")) return {k:"top"};
    if (eat("bot")) return {k:"bot"};
    if (eat("lp")){ var f = iff(); if (!eat("rp")) throw new Error("A “(” is never closed — add the matching “)”."); return f; }
    var a = eat("atom");
    if (a){
      if (/^K$/.test(a.v))
        throw new Error("Write the agent on the K, as in <i>K_a</i> — that is how the operator says whose knowledge it is.");
      return {k:"atom", n:a.v};
    }
    if (peek() === "rp") throw new Error("There is a “)” with no “(” to match it.");
    if (peek() === "end") throw new Error("The formula stops early — something is missing after the last connective.");
    throw new Error("Expected a letter, a modality or “(” at position " + (t[p].i + 1) + ", found “" + t[p].v + "”.");
  }
  var f = iff();
  if (peek() !== "end") throw new Error("Unexpected “" + t[p].v + "” at position " + (t[p].i + 1) + " — is a connective missing?");
  return f;
}

/* ═════════════════════════════════════════════ the calculus */
/* Labelled tableaux. A line is either a signed formula at a world, w: T A,
   or an accessibility atom, w R v — and the arrow now carries the name of the
   relation it belongs to, so one tree can talk about several at once. That is
   all it takes to cover the multi-agent operators of lecture 13 and the
   programs of lecture 14: K_a and [a] are the same rule along different
   arrows. Writing the relation down rather than hiding it in the shape of the
   prefixes is what lets an open branch be read straight off as a Kripke
   structure. */
function T(f){ return {s:"T", f:f}; }
function F(f){ return {s:"F", f:f}; }
function key(g){ return fmtText(g); }
function lkey(L){ return L.kind === "rel" ? "R" + L.lab + "|" + L.a + ">" + L.b : L.w + L.s + key(L.f); }
var WN = function(i){ return "w" + i; };
/* how a relation is written in the tree: R for the plain one, R with the name
   under it for an agent or an atomic program */
function labName(lab){ return lab === "" ? "" : lab; }

/* The relation a modality travels along, or null if the formula has to be
   rewritten before it travels anywhere. */
function labOf(f){
  if (f.k === "ka") return f.ag;
  if (f.k === "box" || f.k === "dia"){
    if (!f.pr) return "";
    if (f.pr.p === "atom") return f.pr.n;
  }
  return null;
}
/* the equivalence a program rule rewrites along; sign plays no part, which is
   why these read as laws rather than as a pair of rules */
function progLaw(f){
  var pr = f.pr, bx = f.k === "box", inner = f.a;
  function M(p, a){ return {k:f.k, pr:p, a:a}; }
  if (pr.p === "seq")  return {code:"(;)", f: M(pr.a, M(pr.b, inner))};
  if (pr.p === "alt")  return {code:"(∪)", f: bx ? {k:"and", a:M(pr.a, inner), b:M(pr.b, inner)}
                                                 : {k:"or",  a:M(pr.a, inner), b:M(pr.b, inner)}};
  if (pr.p === "test") return {code:"(?)", f: bx ? {k:"imp", a:pr.f, b:inner}
                                                 : {k:"and", a:pr.f, b:inner}};
  if (pr.p === "star") return {code:"(*)", f: bx ? {k:"and", a:inner, b:M(pr.a, M(pr, inner))}
                                                 : {k:"or",  a:inner, b:M(pr.a, M(pr, inner))}};
  return null;
}
/* Which rule a signed formula calls for — one function, so there is exactly
   one answer and nothing can disagree with anything else.

     alpha / beta   stay at the world and break the formula down
     all            fires once per arrow, and again when a new arrow turns up
     new            makes one fresh world and is done
     allD / newD    the same two, along the intersection of every agent
     stop           the rule exists but this tool will not take it            */
function ruleFor(s, f){
  if (f.k === "atom" || f.k === "top" || f.k === "bot") return null;
  if (f.k === "not") return {code: s === "T" ? "¬T" : "¬F", kind:"alpha",
                             out:[[ s === "T" ? F(f.a) : T(f.a) ]]};
  var a = f.a, b = f.b;
  switch (f.k){
    case "and": return s === "T" ? {code:"∧T", kind:"alpha", out:[[T(a), T(b)]]}
                                 : {code:"∧F", kind:"beta",  out:[[F(a)], [F(b)]]};
    case "or":  return s === "T" ? {code:"∨T", kind:"beta",  out:[[T(a)], [T(b)]]}
                                 : {code:"∨F", kind:"alpha", out:[[F(a), F(b)]]};
    case "imp": return s === "T" ? {code:"⊃T", kind:"beta",  out:[[F(a)], [T(b)]]}
                                 : {code:"⊃F", kind:"alpha", out:[[T(a), F(b)]]};
    case "iff": return s === "T" ? {code:"≡T", kind:"beta",  out:[[T(a), T(b)], [F(a), F(b)]]}
                                 : {code:"≡F", kind:"beta",  out:[[T(a), F(b)], [F(a), T(b)]]};
  }
  /* K_a is a box, along agent a's own arrows — the same rule as □, which is
     why it shares the code */
  if (f.k === "ka") return s === "T" ? {code:"□T", kind:"all", lab:f.ag, inner:"T"}
                                     : {code:"□F", kind:"new", lab:f.ag, inner:"F"};
  /* common knowledge is a fixpoint: see the note on (C) below */
  if (f.k === "c") return {code:"(C)", kind:"stop", why:"c"};
  /* everyone-knows is the conjunction of the agents, so it is a rewrite */
  if (f.k === "e"){
    var ag = S.ags || [];
    if (!ag.length) return {code:"(E)", kind:"stop", why:"noagents"};
    var conj = ag.map(function(g){ return {k:"ka", ag:g, a:f.a}; })
                 .reduce(function(x, y){ return {k:"and", a:x, b:y}; });
    return {code:"(E)", kind:"alpha", out:[[ {s:s, f:conj} ]]};
  }
  /* distributed knowledge travels along the intersection, which is not a
     program and not a conjunction — it needs its own pair of rules */
  if (f.k === "d"){
    if (!(S.ags || []).length) return {code:"(D)", kind:"stop", why:"noagents"};
    return s === "T" ? {code:"DT", kind:"allD", inner:"T"}
                     : {code:"DF", kind:"newD", inner:"F"};
  }
  if (f.k === "box" || f.k === "dia"){
    var lab = labOf(f);
    if (lab === null){
      /* a compound program: rewrite by the law for its outermost operator */
      var univ = (f.k === "box") === (s === "T");   /* true when this side is the safe one */
      if (f.pr.p === "star" && !univ)
        return {code:"(*)", kind:"stop", why:"star"};
      var law = progLaw(f);
      return {code:law.code, kind:"alpha", out:[[ {s:s, f:law.f} ]]};
    }
    if (f.k === "box") return s === "T" ? {code:"□T", kind:"all", lab:lab, inner:"T"}
                                        : {code:"□F", kind:"new", lab:lab, inner:"F"};
    return s === "T" ? {code:"◇T", kind:"new", lab:lab, inner:"T"}
                     : {code:"◇F", kind:"all", lab:lab, inner:"F"};
  }
  return null;
}
/* the three views the rest of the page asks for */
function propRule(s, f){
  var r = ruleFor(s, f);

function modalRule(s, f){
  var r = ruleFor(s, f);
  if (!r) return null;
  if (r.kind === "all" || r.kind === "allD") return {code:r.code, mode:"all", lab:r.lab, inner:r.inner, kind:r.kind};
  if (r.kind === "new" || r.kind === "newD") return {code:r.code, mode:"new", lab:r.lab, inner:r.inner, kind:r.kind};
  return null;
}
function stopRule(s, f){

/* What a refused rule is refused for. These are the two places where a tree
   with a loop check in it stops being a decision procedure, so the page says

function stopWhy(r, L){
  if (r.why === "noagents")
    return "<b>No agents.</b> " + (L.f.k === "e" ? "E" : "D") + " quantifies over the agents, and this " +
      "formula never names one. Write <code>K_a</code>, or <code>[a]</code>, somewhere so the tool knows " +
      "whose arrows to take the union or the intersection of.";

    return "<b>Common knowledge is a fixpoint.</b> C <i>A</i> ≡ E(<i>A</i> ∧ C <i>A</i>), so a branch " +
      "carrying F C <i>A</i> promises a chain of arrows that reaches a world where <i>A</i> fails — and the " +
      "loop check cannot tell a loop that keeps that promise from one that does not. Rather than draw a " +
      "tree and call a loop a countermodel, this page stops here. The model lab will still evaluate C on " +
      "a structure you build by hand.";
  return "<b>A star on the existential side.</b> " + sf(L.w, L.s, L.f) + " promises that " + fh(L.f.a) +

    "a loop that keeps the promise from one that never does — so a branch that survived would be reported " +
    "as a countermodel when it is not one. This page stops here instead. A star under the universal side " +
    "— T [α*]φ or F ⟨α*⟩φ — is a safety property and does go through.";

  var ls = (S.labs || [""]).map(logicOf);

  return (S.labs || [""]).map(function(l, i){ return (l || "R") + " " + ls[i]; }).join(", ");
}
function aLogic(){ var n = logicName(); return (n.charAt(0) === "S" ? "an " : "a ") + n; }
function anyCond(k){ return (S.labs || [""]).some(function(l){ return onOf(l)[k]; }); }

function newModel(n, labs){
  var M = {n:n, R:{}, V:{}};
  (labs || [""]).forEach(function(l){ M.R[l] = blank(n); });

}
function blank(n){

/* ═════════════════════════════════════════════ tableau */
function newTab(){ return {lines:{}, segs:{}, root:null, nextLine:1, nextSeg:0, nextW:1}; }
function addSeg(tab, parent){
  var id = "s" + (tab.nextSeg++);
  tab.segs[id] = {id:id, parent:parent, lines:[], kids:[], state:"active", closure:null};
  if (parent) tab.segs[parent].kids.push(id);
  return id;
}
function addFml(tab, seg, w, s, f, src, rule){
  var id = tab.nextLine++;
  tab.lines[id] = {id:id, kind:"fml", w:w, s:s, f:f, src:src, rule:rule, seg:seg, used:false};
  tab.segs[seg].lines.push(id);
  return id;
}
function addRel(tab, seg, a, b, lab, src, rule){
  var id = tab.nextLine++;
  tab.lines[id] = {id:id, kind:"rel", a:a, b:b, lab:lab || "", src:src, rule:rule, seg:seg, used:true};
  tab.segs[seg].lines.push(id);
  return id;
}

  var out = [], chain = [];

  chain.forEach(function(s){ out = out.concat(tab.segs[s].lines); });
  return out;
}
function leaves(tab, seg, only){
  var sg = tab.segs[seg], out = [];
  if (!sg.kids.length){ if (!only || sg.state === only) out.push(seg); return out; }
  sg.kids.forEach(function(k){ out = out.concat(leaves(tab, k, only)); });
  return out;
}
function hasLine(tab, seg, k){
  return pathLines(tab, seg).some(function(id){ return lkey(tab.lines[id]) === k; });
}
function arrowsOn(tab, seg){
  return pathLines(tab, seg).map(function(id){ return tab.lines[id]; })
    .filter(function(L){ return L.kind === "rel"; });
}
function worldsOn(tab, seg){
  var ws = {0:1};
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "rel"){ ws[L.a] = 1; ws[L.b] = 1; } else ws[L.w] = 1;
  });

/* a branch dies when one world has to make the same formula true and false */
function clashOn(tab, seg){
  var seen = {}, ids = pathLines(tab, seg);

    var L = tab.lines[ids[i]];
    if (L.kind !== "fml") continue;
    if (L.s === "T" && L.f.k === "bot") return [L.id, L.id];
    if (L.s === "F" && L.f.k === "top") return [L.id, L.id];
    var k = L.w + "|" + key(L.f);

/* ── blocking, so transitive logics stop ── */
/* With transitivity or euclideanness on, a ◇ asks for a fresh world, the
   closure draws an arrow that reaches it, and the ◇ wakes again: the branch
   grows for ever. The cure is the standard loop check. If an earlier world u
   already carries everything w carries, then nothing w could ask for is
   anything u has not already been given, so w need not be expanded at all —
   the model simply lets w's arrows land on u instead.

   Transitive and euclidean logics need it, and so does any formula with a
   star in it. K, D, T and the symmetric ones terminate on their own, and
   there the loop back is not licensed.

   A star earns the check even with no frame condition at all. A star never
   makes a world by itself — F ⟨α*⟩φ unfolds to F φ and F ⟨α⟩⟨α*⟩φ, and ⟨α⟩
   under F is universal — but φ may contain something that does make one, and
   the star formula then travels into it and unfolds again there.
   F ⟨(a∪a)*⟩(¬p ⊃ [a∪b]p) is the smallest case: in plain K it grows for ever.
   The loop back is sound for the usual reason — a world that repeats one
   already on the branch asks for nothing new — and a star unfolds into
   finitely many formulas, so the signatures do run out. */
function blocking(){ return anyCond("transitive") || anyCond("euclidean") || !!S.star; }
/* is there a star anywhere in the formula, tests included? */
function hasStar(g){
  var hit = false;
  function pw(pr){
    if (hit || !pr) return;
    if (pr.p === "star"){ hit = true; return; }
    if (pr.p === "test"){ walk(pr.f); return; }
    if (pr.p === "atom") return;
    pw(pr.a); pw(pr.b);
  }
  function walk(h){
    if (hit || !h || h.k === "atom" || h.k === "top" || h.k === "bot") return;
    if (h.k === "not" || MODAL[h.k]){ if (h.pr) pw(h.pr); walk(h.a); return; }
    walk(h.a); walk(h.b);
  }
  walk(g);
  return hit;
}
/* These are asked for constantly while a branch is being worked on and the
   answers only change when a line is added, so they are cached against a
   stamp the tableau bumps on every write. Without that the check is the
   slowest thing on the page by a wide margin. */
function cacheOf(tab){
  if (!tab.cc || tab.cc.at !== tab.nextLine){ tab.cc = {at:tab.nextLine, sig:{}, blk:{}}; }
  return tab.cc;
}
function sigma(tab, seg, w){
  var c = cacheOf(tab), k = seg + "|" + w;
  if (c.sig[k]) return c.sig[k];
  var out = {};
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "fml" && L.w === w) out[L.s + key(L.f)] = 1;
  });
  c.sig[k] = out;
  return out;
}
function covers(A, B){ return Object.keys(B).every(function(k){ return A[k]; }); }
/* the earliest unblocked world that carries everything this one does */
function blockedBy(tab, seg, w){
  if (!blocking() || w === 0) return null;
  var c = cacheOf(tab), k = seg + "|" + w;
  if (c.blk[k] !== undefined) return c.blk[k];
  c.blk[k] = null;                               /* guards the recursion below */
  var ws = worldsOn(tab, seg), mine = sigma(tab, seg, w), hit = null;
  /* A world carrying no formula at all is covered by every other world, and
     folding it onto one of them would hand that world an incoming arrow it was
     never asked to cope with — which is how T □s came out false at w0 in KD5.
     A bare world constrains nothing, so it is left where it is and seriality
     gives it a loop, exactly as the note on seriality says. */
  if (!Object.keys(mine).length){ c.blk[k] = null; return null; }
  for (var i = 0; i < ws.length && hit === null; i++){
    var u = ws[i];
    if (u >= w) break;
    if (blockedBy(tab, seg, u) !== null) continue;
    if (covers(sigma(tab, seg, u), mine)) hit = u;
  }

  return hit;
}
/* where a world stands in the finished structure */
function repOf(tab, seg, w){
  var u = blockedBy(tab, seg, w);
  return u === null ? w : repOf(tab, seg, u);
}

/* ── what is still owed on a branch ── */
/* An α, β or existential line is owed until it has been used. A universal line
   is owed whenever an arrow exists whose target does not yet carry its inner
   formula — which is why a new arrow can wake an old line up again. A frame
   condition is owed whenever it demands an arrow the branch has not got. A
   refused line is owed for ever, which is the point: a branch carrying one
   can never be declared open. */
function owedFml(tab, seg){
  var out = [];
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind !== "fml") return;
    var r = ruleFor(L.s, L.f);
    if (!r) return;
    if (r.kind === "stop"){ out.push({id:id, why:r.code, stop:r}); return; }
    if (r.kind === "alpha" || r.kind === "beta"){ if (!L.used) out.push({id:id, why:r.code}); return; }
    if (r.kind === "new" || r.kind === "newD"){
      if (!L.used && blockedBy(tab, seg, L.w) === null) out.push({id:id, why:r.code});
      return;
    }
    if (allTargets(tab, seg, L).length) out.push({id:id, why:r.code});
  });
  return out;
}
/* a branch where everything left is a refused rule has nowhere to go */
function stuckOn(tab, seg){
  var o = owedFml(tab, seg);
  return o.length && o.every(function(x){ return x.stop; }) && !owedCond(tab, seg).length ? o[0] : null;
}
function uniq(xs){ return xs.filter(function(v, i, arr){ return arr.indexOf(v) === i; }); }
function allTargets(tab, seg, L){
  var m = modalRule(L.s, L.f);
  if (!m || m.mode !== "all") return [];
  var ar = arrowsOn(tab, seg), cands;
  if (m.kind === "allD"){
    /* distributed knowledge reaches only the worlds every agent reaches */
    var ags = S.ags || [];
    cands = uniq(ar.filter(function(R){ return R.a === L.w; }).map(function(R){ return R.b; }))
      .filter(function(v){
        return ags.length && ags.every(function(g){
          return ar.some(function(R){ return R.a === L.w && R.b === v && R.lab === g; }); });
      });
  } else {
    cands = uniq(ar.filter(function(R){ return R.a === L.w && R.lab === m.lab; })
                   .map(function(R){ return R.b; }));
  }
  return cands.filter(function(v){ return !hasLine(tab, seg, v + m.inner + key(L.f.a)); });
}
function owedCond(tab, seg){
  var out = [];
  (S.labs || [""]).forEach(function(lab){
    COND.forEach(function(C){
      if (!onOf(lab)[C.k]) return;
      if (condWork(tab, seg, lab, C.k).length) out.push({lab:lab, C:C, k:C.k, lbl:C.lbl});

}
/* the arrows a condition is missing on this branch, as [from, to] pairs;

function condWork(tab, seg, lab, k){
  var ws = worldsOn(tab, seg), has = {};

  ar.forEach(function(R){ has[R.a + ">" + R.b] = 1; });

  function want(a, b){ if (!has[a + ">" + b]) out.push([a, b]); }

  else if (k === "symmetric") ar.forEach(function(R){ want(R.b, R.a); });
  else if (k === "transitive")
    ar.forEach(function(P){ ar.forEach(function(Q){ if (P.b === Q.a) want(P.a, Q.b); }); });
  else if (k === "euclidean")
    ar.forEach(function(P){ ar.forEach(function(Q){ if (P.a === Q.a) want(P.b, Q.b); }); });
  else if (k === "serial"){
    /* Only a world that carries a formula is asked for a successor. One that
       carries none constrains nothing — a saturated branch could only have
       left it bare if no universal line pointed at it — so it can be closed
       off with a loop when the structure is read, and the chain stops instead
       of running forever. */
    var holds = {};
    pathLines(tab, seg).forEach(function(id){
      var L = tab.lines[id];
      if (L.kind === "fml") holds[L.w] = 1;

         world that blocks it and reaches whatever that one reaches, so it is
         already as serial as it needs to be — and without this the chain of
         fresh successors never ends in a logic that is serial and transitive
         but not reflexive, which is to say in KD4. */
      if (blockedBy(tab, seg, w) !== null) return;

/* ── applying ── */
function applyFml(tab, lineId){
  var L = tab.lines[lineId];
  var r = ruleFor(L.s, L.f);
  if (!r || r.kind === "stop") return 0;
  var tgt = leaves(tab, L.seg, "active"), added = 0, fired = 0;
  tgt.forEach(function(lf){
    if (r.kind === "alpha"){
      r.out[0].forEach(function(x){
        if (!hasLine(tab, lf, L.w + x.s + key(x.f))){ addFml(tab, lf, L.w, x.s, x.f, lineId, r.code); added++; }
      });
      return;
    }
    if (r.kind === "beta"){
      r.out.forEach(function(br){
        var c = addSeg(tab, lf);
        br.forEach(function(x){ addFml(tab, c, L.w, x.s, x.f, lineId, r.code); added++; });
      });
      return;
    }
    if (r.kind === "new" || r.kind === "newD"){
      /* Blocking is a fact about a branch, not about a line, so it is asked
         here, once per branch: the ones where the world is blocked get
         nothing and loop back instead. */
      if (blockedBy(tab, lf, L.w) !== null) return;
      var v = tab.nextW++;
      if (r.kind === "newD"){
        /* an arrow from every agent at once, which is what makes v lie in the
           intersection */
        (S.ags || []).forEach(function(g){ addRel(tab, lf, L.w, v, g, lineId, r.code); added++; });
      } else {
        addRel(tab, lf, L.w, v, r.lab, lineId, r.code); added++;
      }
      addFml(tab, lf, v, r.inner, L.f.a, lineId, r.code);
      added++;
      fired++;
      return;
    }
    allTargets(tab, lf, L).forEach(function(v){
      addFml(tab, lf, v, r.inner, L.f.a, lineId, r.code); added++;
    });
  });

     later carry enough to break the block, it is owed again. */

}
function applyCond(tab, seg, lab, k){
  var tgt = leaves(tab, seg, "active"), added = 0;
  var lbl = COND.filter(function(c){ return c.k === k; })[0].lbl;
  tgt.forEach(function(lf){
    condWork(tab, lf, lab, k).forEach(function(pr){
      if (pr[1] === null){                    /* seriality: a successor out of nothing */
        var v = tab.nextW++;
        addRel(tab, lf, pr[0], v, lab, null, lbl); added++;
      } else if (!hasLine(tab, lf, "R" + lab + "|" + pr[0] + ">" + pr[1])){
        addRel(tab, lf, pr[0], pr[1], lab, null, lbl);
        added++;
      }
    });
  });
  return added;
}

/* ═════════════════════════════════════════════ semantics */
/* Used for one thing only: checking a countermodel before the page claims it
   is one. A tool that hands you a structure should have looked at it first. */
function unionR(M, ags){
  var R = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++)
    R[i][j] = ags.some(function(g){ return M.R[g] && M.R[g][i][j]; });
  return R;
}
function interR(M, ags){
  var R = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++)
    R[i][j] = ags.length > 0 && ags.every(function(g){ return M.R[g] && M.R[g][i][j]; });
  return R;
}
function closeR(R, n){
  var C = R.map(function(r){ return r.slice(); });
  for (var k = 0; k < n; k++) for (var i = 0; i < n; i++) for (var j = 0; j < n; j++)
    if (C[i][k] && C[k][j]) C[i][j] = true;
  return C;
}
function compose(A, B, n){
  var R = blank(n);
  for (var i = 0; i < n; i++) for (var k = 0; k < n; k++){
    if (!A[i][k]) continue;
    for (var j = 0; j < n; j++) if (B[k][j]) R[i][j] = true;
  }

}

  var R = A.map(function(r){ return r.slice(); });
  for (var i = 0; i < n; i++) R[i][i] = true;          /* reflexive, then transitive */
  for (var k = 0; k < n; k++) for (var i = 0; i < n; i++) for (var j = 0; j < n; j++)
    if (R[i][k] && R[k][j]) R[i][j] = true;
  return R;
}
function relProg(M, pr){
  if (pr.p === "atom") return M.R[pr.n] || blank(M.n);
  if (pr.p === "test"){
    var R = blank(M.n);
    for (var w = 0; w < M.n; w++) if (holdsAt(pr.f, M, w)) R[w][w] = true;
    return R;
  }
  if (pr.p === "star") return starR(relProg(M, pr.a), M.n);
  if (pr.p === "seq") return compose(relProg(M, pr.a), relProg(M, pr.b), M.n);
  var A = relProg(M, pr.a), B = relProg(M, pr.b), U = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++) U[i][j] = A[i][j] || B[i][j];
  return U;
}
function relOf(M, g){
  if (g.k === "box" || g.k === "dia")
    return g.pr ? relProg(M, g.pr) : (M.R[""] || blank(M.n));
  if (g.k === "ka") return M.R[g.ag] || blank(M.n);
  var ags = S.ags || [];
  if (g.k === "e") return unionR(M, ags);
  if (g.k === "d") return interR(M, ags);
  return closeR(unionR(M, ags), M.n);               /* C: any non-empty chain */
}
function holdsAt(g, M, w){
  switch (g.k){
    case "atom": return !!(M.V[g.n] && M.V[g.n][w]);
    case "top":  return true;
    case "bot":  return false;
    case "not":  return !holdsAt(g.a, M, w);
    case "and":  return holdsAt(g.a, M, w) && holdsAt(g.b, M, w);
    case "or":   return holdsAt(g.a, M, w) || holdsAt(g.b, M, w);
    case "imp":  return !holdsAt(g.a, M, w) || holdsAt(g.b, M, w);
    case "iff":  return holdsAt(g.a, M, w) === holdsAt(g.b, M, w);
    case "dia": {
      var Rd = relOf(M, g);
      for (var v = 0; v < M.n; v++) if (Rd[w][v] && holdsAt(g.a, M, v)) return true;
      return false;
    }
    default: {                                   /* □, K_a, E, D, C all say "every" */
      var R = relOf(M, g);
      for (var u = 0; u < M.n; u++) if (R[w][u] && !holdsAt(g.a, M, u)) return false;

    }

}
function badFrame(M){
  var labs = S.labs || [""], bad = null;
  labs.forEach(function(lab){
    if (bad) return;

    function no(w){ bad = {lab:lab, k:w}; }

    if (on.reflexive) for (a = 0; a < n && !bad; a++) if (!R[a][a]) no("reflexive");
    if (on.symmetric) for (a = 0; a < n && !bad; a++) for (b = 0; b < n && !bad; b++)
      if (R[a][b] && !R[b][a]) no("symmetric");
    if (on.transitive) for (a = 0; a < n && !bad; a++) for (b = 0; b < n && !bad; b++) for (c = 0; c < n && !bad; c++)
      if (R[a][b] && R[b][c] && !R[a][c]) no("transitive");
    if (on.euclidean) for (a = 0; a < n && !bad; a++) for (b = 0; b < n && !bad; b++) for (c = 0; c < n && !bad; c++)

  });
