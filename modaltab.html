<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Labelled tableaux for modal logic: signed formulas carry a world, the accessibility arrows are written down, and a branch that survives is a Kripke countermodel you can open in the model lab.">
<title>Modal Tableaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F3F4F8;
  --paper:#FFFFFF;
  --soft:#E7EAF2;
  --ink:#171A26;
  --ink-2:#5D6379;
  --ink-3:#8A91A6;
  --line:#D3D7E4;
  --accent:#2E3FA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E4FB;
  --closed:#1F7A5C;
  --closed-soft:#D8EEE5;
  --open:#A46200;
  --open-soft:#FAEBD4;
  --error:#B3261E;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:"Newsreader", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --paper:#191C29; --soft:#232736;
    --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
    --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
    --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#37280F;
    --error:#F3897D;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111320; --paper:#191C29; --soft:#232736;
  --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
  --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
  --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#37280F;
  --error:#F3897D;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

#app{height:100%; display:flex; flex-direction:column; padding-inline:20px; max-width:1300px; margin:0 auto}

/* ── input row ─────────────────────────────────────────── */
.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.wordmark{
  font-family:var(--serif); font-size:17px; color:var(--ink-2);
  white-space:nowrap; margin-right:2px;
}
.wordmark span{color:var(--accent)}
.sibling{font-size:12px; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px}
.sibling:hover{color:var(--accent)}
form{display:flex; align-items:center; gap:8px; flex:1; min-width:280px; flex-wrap:wrap}
.tf{display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; flex:none; background:var(--paper)}
.tf button{
  border:0; background:transparent; padding:7px 13px;
  font-family:var(--mono); font-size:13px; color:var(--ink-3);
}
.tf button+button{border-left:1px solid var(--line)}
.tf button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
input[type=text]{
  flex:1; min-width:0; font-family:var(--mono); font-size:15px;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.go{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:7px; padding:8px 16px; font-weight:500;
}
.go:hover{filter:brightness(1.08)}
.link{
  border:0; background:transparent; color:var(--ink-3); padding:6px 4px;
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--ink)}

/* ── connective pad ────────────────────────────────────── */
.pad{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-basis:100%}
.pad button{
  font-family:var(--serif); font-size:17px; line-height:1;
  min-width:36px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s;
}
.pad button:hover{background:var(--soft); border-color:var(--ink-3)}
.pad button:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pad .gap{width:10px}
.padhint{font-size:12px; color:var(--ink-3); margin-left:4px}
.padhint code{font-family:var(--mono); font-size:11.5px}

/* ── rule table ────────────────────────────────────────── */
.rules{display:flex; flex-wrap:wrap; gap:16px 26px; padding-block:2px 14px; border-bottom:1px solid var(--line)}
.rulegroup{display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap}
.glyph{
  font-family:var(--serif); font-size:16px; color:var(--accent);
  padding-top:3px; width:1em; flex:none;
}
.rulerow{display:flex; flex-wrap:wrap; gap:4px}
.rule{
  display:flex; align-items:baseline; gap:8px;
  border:1px solid transparent; background:transparent; border-radius:6px;
  padding:3px 8px; transition:background .1s, opacity .1s;
}
.rule:hover{background:var(--soft)}
.rule .code{font-family:var(--serif); font-size:14px; color:var(--accent); flex:none}
.rule .sch{font-family:var(--serif); font-size:14px; white-space:nowrap}
.rule .sch .ar{font-family:var(--sans); font-size:10px; color:var(--ink-3); margin:0 .4em}
.rule .sch .bar{color:var(--line); margin:0 .3em}
.rule.armed{background:var(--accent); border-color:var(--accent)}
.rule.armed .code,.rule.armed .sch,.rule.armed .ar,.rule.armed .bar{color:var(--accent-ink)}
.rule.dim{opacity:.3}

/* ── status ────────────────────────────────────────────── */
.status{
  display:flex; align-items:baseline; gap:10px;
  padding-block:11px; min-height:42px; font-size:13.5px; color:var(--ink-2);
}
.status .msg{flex:1}
.status .f{white-space:normal}
.status.ok{color:var(--closed)}
.status.err{color:var(--error)}
.status b{font-weight:500; color:var(--ink)}
.status.ok b,.status.err b{color:inherit; font-weight:600}
.status .acts{display:flex; gap:2px; flex:none}

/* ── formulas ──────────────────────────────────────────── */
.f{font-family:var(--serif); font-size:16.5px; line-height:1.3; white-space:nowrap}
.f i{font-style:italic}
.f .op{margin:0 .26em}
.f .op.neg{margin:0 .04em 0 0}
.f .pr{color:var(--ink-3)}
.sg{
  display:inline-block; min-width:1.35em; text-align:center; margin-right:.5em;
  font-family:var(--mono); font-size:10.5px; line-height:1.55; border-radius:3px;
  transform:translateY(-2px);
}
.sg.T{background:var(--ink); color:var(--bg)}
.sg.F{background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line)}

/* ── tree ──────────────────────────────────────────────── */
.canvas{
  flex:1; min-height:0; overflow:auto;
  padding:30px 20px 60px; background:var(--paper);
  border:1px solid var(--line); border-radius:10px; margin-bottom:18px;
}
.tree{display:flex; justify-content:center; min-width:min-content}
.seg{display:flex; flex-direction:column; align-items:center}
.lines{display:flex; flex-direction:column; gap:1px}

.line{
  display:flex; align-items:baseline; gap:8px; white-space:nowrap;
  padding:2px 8px 2px 4px; border-radius:5px;
  border:1px solid transparent; background:transparent; text-align:left;
}
.line .num{
  font-family:var(--mono); font-size:10.5px; font-variant-numeric:tabular-nums;
  color:var(--ink-3); width:2.2em; text-align:right; flex:none;
}
.line .tick{font-family:var(--mono); font-size:11px; width:1em; flex:none; color:var(--closed); opacity:0}
.line.used .tick{opacity:1}
.line .body{flex:1}
.line .just{font-family:var(--mono); font-size:10px; color:var(--ink-3); padding-left:18px; flex:none}
.line .just .rc{font-family:var(--serif); font-size:12.5px}
.line.used .f{opacity:.6}
button.line{transition:background .1s, border-color .1s}
button.line:hover{background:var(--soft); border-color:var(--line)}
button.line.sel{border-color:var(--accent); background:var(--accent-soft)}
button.line.sel .num{color:var(--accent)}
button.line.pick{border-color:var(--error)}
.line.hi{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--accent-soft)} to{background:transparent}}

.fork{position:relative; display:flex; align-items:flex-start; justify-content:center}
.fork::before{content:""; position:absolute; top:0; left:50%; width:1px; height:15px; background:var(--line)}
.fork::after{content:""; position:absolute; top:15px; left:25%; right:25%; height:1px; background:var(--line)}
.branch-col{position:relative; padding:34px 20px 0; display:flex; justify-content:center; flex:none}
.branch-col::before{content:""; position:absolute; top:15px; left:50%; width:1px; height:19px; background:var(--line)}

.tip{position:relative; padding-top:20px; display:flex; flex-direction:column; align-items:center; gap:5px}
.tip::before{content:""; position:absolute; top:2px; left:50%; width:1px; height:14px; background:var(--line)}
.tip .mark{font-family:var(--serif); font-size:20px; line-height:1}
.tip.closed .mark{color:var(--closed)}
.tip.open .mark{color:var(--open)}
.note{font-family:var(--mono); font-size:10px; padding:2px 7px; border-radius:20px; white-space:nowrap}
.tip.closed .note{background:var(--closed-soft); color:var(--closed)}
.tip.open .note{background:var(--open-soft); color:var(--open)}
.tip .acts{display:flex; gap:4px}
.tipbtn{
  border:1px solid var(--line); background:var(--paper); border-radius:6px;
  padding:3px 9px; font-size:11.5px; color:var(--ink-2);
}
.tipbtn.c:hover{border-color:var(--closed); color:var(--closed)}
.tipbtn.o:hover{border-color:var(--open); color:var(--open)}
.tip .prompt{font-family:var(--mono); font-size:10px; color:var(--error)}

@media (max-width:760px){
  #app{height:auto; min-height:100%; padding-inline:16px}
  .canvas{min-height:460px}
  .wordmark{display:none}
  .pad button{min-width:34px; padding:6px 7px; font-size:16px}
  .padhint{flex-basis:100%; margin:2px 0 0}
  .rules{gap:12px 18px}
  .rule .sch{font-size:13px}
}
.theme{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-2);
  border-radius:6px; padding:3px 9px; font-size:14px; line-height:1.35;
  cursor:pointer; flex:none;
}
.theme:hover{border-color:var(--accent); color:var(--accent)}
/* ── modal additions ───────────────────────────────────── */
.wl{font-family:var(--mono); font-size:10.5px; color:var(--accent); margin-right:6px}
.rr{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin:0 5px}
.line.rel .body{opacity:.95}
.line.rel .wl{color:var(--ink-2)}
.f .md{margin-right:.08em}
.condwrap{display:inline-flex; align-items:stretch; gap:0}
.condsw{
  font-family:var(--mono); font-size:10px; min-width:20px; padding:0 5px;
  border:1px solid var(--line); border-right:0; border-radius:6px 0 0 6px;
  background:var(--paper); color:var(--ink-3);
}
.condsw.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rule.cond{border-radius:0 6px 6px 0}
.rule.cond.off{opacity:.3}
.logicname{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); align-self:center; white-space:nowrap; padding-left:2px;
}
.logicname b{color:var(--accent); font-weight:500}
.golink{color:var(--accent); text-decoration:underline; text-underline-offset:3px}
.tip.open .note{font-family:var(--mono); font-size:9.5px}
</style>
<script>
/* stamp the saved theme before anything paints, so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("logic.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>

<body>
<div id="app">
  <div class="top">
    <span class="wordmark"><span>◻</span> Modal tableaux</span>
    <a class="sibling" href="index.html">← All solvers</a>
    <button class="theme" id="themeBtn" type="button">◐</button>
    <form id="entry">
      <div class="tf" role="group" aria-label="Sign for the root formula">
        <button type="button" data-sign="T" aria-pressed="false">T</button>
        <button type="button" data-sign="F" aria-pressed="true">F</button>
      </div>
      <input type="text" id="formula" spellcheck="false" autocomplete="off"
             aria-label="Formula" value="<>(p | <>p) -> <>p">
      <button type="submit" class="go">Build tree</button>
      <div class="pad" id="pad" role="group" aria-label="Insert a connective">
        <button type="button" data-sym="¬" aria-label="Insert negation" title="negation — also typed as ~ or !">¬</button>
        <button type="button" data-sym="∧" aria-label="Insert conjunction" title="conjunction — also typed as &amp; or /\">∧</button>
        <button type="button" data-sym="∨" aria-label="Insert disjunction" title="disjunction — also typed as | or \/">∨</button>
        <button type="button" data-sym="⊃" aria-label="Insert implication" title="implication — also typed as -&gt;, =&gt; or →">⊃</button>
        <button type="button" data-sym="≡" aria-label="Insert biconditional" title="biconditional — also typed as &lt;-&gt;, &lt;=&gt; or ↔">≡</button>
        <span class="gap"></span>
        <button type="button" data-sym="□" aria-label="Insert box" title="necessarily — also typed as []">□</button>
        <button type="button" data-sym="◇" aria-label="Insert diamond" title="possibly — also typed as &lt;&gt;">◇</button>
        <button type="button" data-sym="(" aria-label="Insert opening bracket">(</button>
        <button type="button" data-sym=")" aria-label="Insert closing bracket">)</button>
        <span class="padhint"><code>[]</code> is □ and <code>&lt;&gt;</code> is ◇; the switches below pick the logic</span>
      </div>
    </form>
  </div>

  <div class="rules" id="rules"></div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="msg"></span>
    <span class="acts">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="reset">Restart</button>
    </span>
  </div>

  <div class="canvas" id="canvas"></div>
</div>

<script>
"use strict";

/* ═════════════════════════════════════════════ logging */
/* One line per formula submitted: someone types a formula, presses the button,
   and that is recorded. Nothing else is — no rule steps, no verdicts, no page
   views. Posts to the host that served this page, same origin; a failure is
   swallowed, so logging can never break the tool. LOG_URL = "" switches it off. */
var LOG_URL = "log.php";
var LOG_PAGE = "modaltab";
var LOG_READY = false;      /* the formula a page loads with is not a submission */

function logFormula(data){
  if (!LOG_URL) return;
  try {
    var ev = {t:new Date().toISOString(), p:LOG_PAGE};
    Object.keys(data).forEach(function(k){
      var v = data[k];
      ev[k] = (typeof v === "string" && v.length > 300) ? v.slice(0, 300) : v;
    });
    var body = JSON.stringify([ev]);
    if (navigator.sendBeacon &&
        navigator.sendBeacon(LOG_URL, new Blob([body], {type:"application/json"}))) return;
    fetch(LOG_URL, {method:"POST", body:body, keepalive:true,
                    headers:{"Content-Type":"application/json"}}).catch(function(){});
  } catch (e){}
}


/* ═════════════════════════════════════════════ formulas */
/* Propositional, plus the two modalities. □ and ◇ bind as tightly as ¬ does,
   so □p ∧ q is (□p) ∧ q and the other reading needs brackets. */
var OPCH = {and:"∧", or:"∨", imp:"⊃", iff:"≡"};
var MDCH = {box:"□", dia:"◇"};

function show(g, esc, wrap, neg, opw, cst, mod){
  cst = cst || function(t){ return t; };
  mod = mod || function(m){ return m; };
  function needs(c, pk, left){
    if (c.k === "atom" || c.k === "not" || c.k === "top" || c.k === "bot" ||
        c.k === "box" || c.k === "dia") return false;
    if (pk === "not" || pk === "box" || pk === "dia") return true;
    if ((pk === "and" || pk === "or") && c.k === pk && left) return false;
    return true;
  }
  function go(h, pk, left){ var s = body(h); return needs(h, pk, left) ? wrap(s) : s; }
  function body(h){
    if (h.k === "atom") return esc(h.n);
    if (h.k === "top") return cst("⊤");
    if (h.k === "bot") return cst("⊥");
    if (h.k === "not") return neg() + go(h.a, "not", false);
    if (h.k === "box" || h.k === "dia") return mod(MDCH[h.k]) + go(h.a, h.k, false);
    return go(h.a, h.k, true) + opw(OPCH[h.k]) + go(h.b, h.k, false);
  }
  return body(g);
}
function fmtHTML(g){
  return show(g,
    function(n){ return "<i>" + n + "</i>"; },
    function(s){ return '<span class="pr">(</span>' + s + '<span class="pr">)</span>'; },
    function(){ return '<span class="op neg">¬</span>'; },
    function(o){ return '<span class="op">' + o + "</span>"; },
    function(t){ return '<span class="cst">' + t + "</span>"; },
    function(m){ return '<span class="md">' + m + "</span>"; });
}
function fmtText(g){
  return show(g, function(n){ return n; }, function(s){ return "(" + s + ")"; },
    function(){ return "¬"; }, function(o){ return o; }, function(t){ return t; },
    function(m){ return m; });
}
function atomsOf(g, out){
  out = out || [];
  if (g.k === "atom"){ if (out.indexOf(g.n) < 0) out.push(g.n); }
  else if (g.k === "top" || g.k === "bot"){ /* none */ }
  else if (g.k === "not" || g.k === "box" || g.k === "dia") atomsOf(g.a, out);
  else { atomsOf(g.a, out); atomsOf(g.b, out); }
  return out;
}
function eqF(a, b){
  if (a.k !== b.k) return false;
  if (a.k === "atom") return a.n === b.n;
  if (a.k === "top" || a.k === "bot") return true;
  if (a.k === "not" || a.k === "box" || a.k === "dia") return eqF(a.a, b.a);
  return eqF(a.a, b.a) && eqF(a.b, b.b);
}
/* every subformula, innermost first, which is the order they get evaluated in */
function subsOf(g, out){
  out = out || [];
  if (g.k === "not" || g.k === "box" || g.k === "dia") subsOf(g.a, out);
  else if (g.k !== "atom" && g.k !== "top" && g.k !== "bot"){ subsOf(g.a, out); subsOf(g.b, out); }
  if (!out.some(function(x){ return eqF(x, g); })) out.push(g);
  return out;
}

/* ═════════════════════════════════════════════ parser */
var SYMS = [
  ["<->","iff"], ["<=>","iff"], ["↔","iff"], ["≡","iff"],
  ["->","imp"], ["=>","imp"], ["→","imp"], ["⊃","imp"],
  ["/\\","and"], ["&&","and"], ["∧","and"], ["&","and"], ["^","and"],
  ["\\/","or"], ["||","or"], ["∨","or"], ["|","or"],
  ["¬","not"], ["~","not"], ["!","not"],
  ["[]","box"], ["□","box"], ["<>","dia"], ["◇","dia"],
  ["⊤","top"], ["⊥","bot"], ["1","top"], ["0","bot"],
  ["(","lp"], [")","rp"]
];
function tokenize(src){
  var t = [], i = 0;
  outer: while (i < src.length){
    var c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[A-Za-z]/.test(c)){
      var j = i + 1;
      while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      t.push({t:"atom", v:src.slice(i, j), i:i}); i = j; continue;
    }
    for (var k = 0; k < SYMS.length; k++){
      if (src.startsWith(SYMS[k][0], i)){
        t.push({t:SYMS[k][1], v:SYMS[k][0], i:i}); i += SYMS[k][0].length; continue outer;
      }
    }
    throw new Error("I don’t recognise “" + c + "” at position " + (i + 1) + ".");
  }
  t.push({t:"end", v:"", i:src.length});
  return t;
}
function parse(src){
  if (!src.trim()) throw new Error("Nothing to evaluate — type a formula.");
  var t = tokenize(src), p = 0;
  function peek(){ return t[p].t; }
  function eat(k){ return t[p].t === k ? t[p++] : null; }
  function iff(){ var l = impR(); while (peek() === "iff"){ p++; l = {k:"iff", a:l, b:impR()}; } return l; }
  function impR(){ var l = or(); if (peek() === "imp"){ p++; return {k:"imp", a:l, b:impR()}; } return l; }
  function or(){ var l = and(); while (peek() === "or"){ p++; l = {k:"or", a:l, b:and()}; } return l; }
  function and(){ var l = un(); while (peek() === "and"){ p++; l = {k:"and", a:l, b:un()}; } return l; }
  function un(){
    if (peek() === "not"){ p++; return {k:"not", a:un()}; }
    if (peek() === "box"){ p++; return {k:"box", a:un()}; }
    if (peek() === "dia"){ p++; return {k:"dia", a:un()}; }
    if (eat("top")) return {k:"top"};
    if (eat("bot")) return {k:"bot"};
    if (eat("lp")){ var f = iff(); if (!eat("rp")) throw new Error("A “(” is never closed — add the matching “)”."); return f; }
    var a = eat("atom");
    if (a) return {k:"atom", n:a.v};
    if (peek() === "rp") throw new Error("There is a “)” with no “(” to match it.");
    if (peek() === "end") throw new Error("The formula stops early — something is missing after the last connective.");
    throw new Error("Expected a letter, a modality or “(” at position " + (t[p].i + 1) + ", found “" + t[p].v + "”.");
  }
  var f = iff();
  if (peek() !== "end") throw new Error("Unexpected “" + t[p].v + "” at position " + (t[p].i + 1) + " — is a connective missing?");
  return f;
}

/* ═════════════════════════════════════════════ the calculus */
/* Labelled tableaux. A line is either a signed formula at a world, w: T A,
   or an accessibility atom, w R v. Writing the relation down rather than
   hiding it in the shape of the prefixes is what lets an open branch be read
   straight off as a Kripke structure — the worlds are the labels, the arrows
   are the R-lines, and the valuation is the atoms. */
function T(f){ return {s:"T", f:f}; }
function F(f){ return {s:"F", f:f}; }
function key(g){ return fmtText(g); }
function lkey(L){ return L.kind === "rel" ? "R" + L.a + ">" + L.b : L.w + L.s + key(L.f); }
var WN = function(i){ return "w" + i; };

/* The propositional rules are the ones from the tableaux page, applied at the
   line's own world: a connective cannot move you between worlds. */
function propRule(s, f){
  if (f.k === "atom" || f.k === "top" || f.k === "bot") return null;
  if (f.k === "box" || f.k === "dia") return null;
  if (f.k === "not") return {code: s === "T" ? "¬T" : "¬F", kind:"alpha",
                             out:[[ s === "T" ? F(f.a) : T(f.a) ]]};
  var a = f.a, b = f.b;
  switch (f.k){
    case "and": return s === "T" ? {code:"∧T", kind:"alpha", out:[[T(a), T(b)]]}
                                 : {code:"∧F", kind:"beta",  out:[[F(a)], [F(b)]]};
    case "or":  return s === "T" ? {code:"∨T", kind:"beta",  out:[[T(a)], [T(b)]]}
                                 : {code:"∨F", kind:"alpha", out:[[F(a), F(b)]]};
    case "imp": return s === "T" ? {code:"⊃T", kind:"beta",  out:[[F(a)], [T(b)]]}
                                 : {code:"⊃F", kind:"alpha", out:[[T(a), F(b)]]};
    case "iff": return s === "T" ? {code:"≡T", kind:"beta",  out:[[T(a), T(b)], [F(a), F(b)]]}
                                 : {code:"≡F", kind:"beta",  out:[[T(a), F(b)], [F(a), T(b)]]};
  }
  return null;
}
/* Which modal rule a signed modality calls for. The two that say "every
   successor" are universal: they fire once per arrow, and may fire again when
   a new arrow turns up. The two that say "some successor" are existential:
   they make one new world and are done. */
function modalRule(s, f){
  if (f.k === "box") return s === "T" ? {code:"□T", mode:"all", inner:"T"}
                                      : {code:"□F", mode:"new", inner:"F"};
  if (f.k === "dia") return s === "T" ? {code:"◇T", mode:"new", inner:"T"}
                                      : {code:"◇F", mode:"all", inner:"F"};
  return null;
}
var RULES = [
  {code:"¬T", kind:"alpha", prem:"w: T ¬φ",      out:[["w: F φ"]]},
  {code:"¬F", kind:"alpha", prem:"w: F ¬φ",      out:[["w: T φ"]]},
  {code:"∧T", kind:"alpha", prem:"w: T (φ ∧ ψ)", out:[["w: T φ","w: T ψ"]]},
  {code:"∨F", kind:"alpha", prem:"w: F (φ ∨ ψ)", out:[["w: F φ","w: F ψ"]]},
  {code:"⊃F", kind:"alpha", prem:"w: F (φ ⊃ ψ)", out:[["w: T φ","w: F ψ"]]},
  {code:"∧F", kind:"beta",  prem:"w: F (φ ∧ ψ)", out:[["w: F φ"],["w: F ψ"]]},
  {code:"∨T", kind:"beta",  prem:"w: T (φ ∨ ψ)", out:[["w: T φ"],["w: T ψ"]]},
  {code:"⊃T", kind:"beta",  prem:"w: T (φ ⊃ ψ)", out:[["w: F φ"],["w: T ψ"]]},
  {code:"≡T", kind:"beta",  prem:"w: T (φ ≡ ψ)", out:[["w: T φ","w: T ψ"],["w: F φ","w: F ψ"]]},
  {code:"≡F", kind:"beta",  prem:"w: F (φ ≡ ψ)", out:[["w: T φ","w: F ψ"],["w: F φ","w: T ψ"]]},
  {code:"□T", kind:"all",   prem:"w: T □φ, wRv", out:[["v: T φ"]]},
  {code:"◇F", kind:"all",   prem:"w: F ◇φ, wRv", out:[["v: F φ"]]},
  {code:"□F", kind:"new",   prem:"w: F □φ",      out:[["wRv","v: F φ"]]},
  {code:"◇T", kind:"new",   prem:"w: T ◇φ",      out:[["wRv","v: T φ"]]}
];
/* The frame conditions, as rules that add the arrows the condition demands. */
var COND = [
  {k:"serial",     ax:"D", lbl:"ser", law:"every world needs a successor, so give one to any that has none"},
  {k:"reflexive",  ax:"T", lbl:"refl", law:"every world sees itself: add wRw"},
  {k:"transitive", ax:"4", lbl:"trans", law:"from wRv and vRu, add wRu"},
  {k:"symmetric",  ax:"B", lbl:"symm", law:"from wRv, add vRw"},
  {k:"euclidean",  ax:"5", lbl:"eucl", law:"from wRv and wRu, add vRu"}
];
function logicName(on){
  var ls = COND.filter(function(c){ return on[c.k]; }).map(function(c){ return c.ax; }).join("");
  var pretty = {"":"K", "D":"D", "T":"T", "T4":"S4", "TB":"B", "T4B":"S5", "T5":"S5", "T4B5":"S5",
                "T45":"S5", "TB5":"S5", "DT":"T", "4":"K4", "B":"KB", "5":"K5", "D4":"KD4", "DB":"KDB"};
  return pretty[ls] !== undefined ? pretty[ls] : "K" + ls;
}

function newModel(n){
  var R = [];
  for (var i = 0; i < n; i++){ R.push([]); for (var j = 0; j < n; j++) R[i].push(false); }
  return {n:n, R:R, V:{}};
}

/* ═════════════════════════════════════════════ tableau */
function newTab(){ return {lines:{}, segs:{}, root:null, nextLine:1, nextSeg:0, nextW:1}; }
function addSeg(tab, parent){
  var id = "s" + (tab.nextSeg++);
  tab.segs[id] = {id:id, parent:parent, lines:[], kids:[], state:"active", closure:null};
  if (parent) tab.segs[parent].kids.push(id);
  return id;
}
function addFml(tab, seg, w, s, f, src, rule){
  var id = tab.nextLine++;
  tab.lines[id] = {id:id, kind:"fml", w:w, s:s, f:f, src:src, rule:rule, seg:seg, used:false};
  tab.segs[seg].lines.push(id);
  return id;
}
function addRel(tab, seg, a, b, src, rule){
  var id = tab.nextLine++;
  tab.lines[id] = {id:id, kind:"rel", a:a, b:b, src:src, rule:rule, seg:seg, used:true};
  tab.segs[seg].lines.push(id);
  return id;
}
function pathLines(tab, seg){
  var out = [], chain = [];
  for (var c = seg; c; c = tab.segs[c].parent) chain.unshift(c);
  chain.forEach(function(s){ out = out.concat(tab.segs[s].lines); });
  return out;
}
function leaves(tab, seg, only){
  var sg = tab.segs[seg], out = [];
  if (!sg.kids.length){ if (!only || sg.state === only) out.push(seg); return out; }
  sg.kids.forEach(function(k){ out = out.concat(leaves(tab, k, only)); });
  return out;
}
function hasLine(tab, seg, k){
  return pathLines(tab, seg).some(function(id){ return lkey(tab.lines[id]) === k; });
}
function arrowsOn(tab, seg){
  return pathLines(tab, seg).map(function(id){ return tab.lines[id]; })
    .filter(function(L){ return L.kind === "rel"; });
}
function worldsOn(tab, seg){
  var ws = {0:1};
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "rel"){ ws[L.a] = 1; ws[L.b] = 1; } else ws[L.w] = 1;
  });
  return Object.keys(ws).map(Number).sort(function(a, b){ return a - b; });
}
/* a branch dies when one world has to make the same formula true and false */
function clashOn(tab, seg){
  var seen = {}, ids = pathLines(tab, seg);
  for (var i = 0; i < ids.length; i++){
    var L = tab.lines[ids[i]];
    if (L.kind !== "fml") continue;
    if (L.s === "T" && L.f.k === "bot") return [L.id, L.id];
    if (L.s === "F" && L.f.k === "top") return [L.id, L.id];
    var k = L.w + "|" + key(L.f);
    var opp = (L.s === "T" ? "F" : "T") + k;
    if (seen[opp] !== undefined) return [seen[opp], L.id];
    if (seen[L.s + k] === undefined) seen[L.s + k] = L.id;
  }
  return null;
}

/* ── what is still owed on a branch ── */
/* An α, β or existential line is owed until it has been used. A universal line
   is owed whenever an arrow exists whose target does not yet carry its inner
   formula — which is why a new arrow can wake an old line up again. A frame
   condition is owed whenever it demands an arrow the branch has not got. */
function owedFml(tab, seg){
  var out = [];
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind !== "fml") return;
    var p = propRule(L.s, L.f), m = modalRule(L.s, L.f);
    if (p && !L.used) out.push({id:id, why:p.code});
    else if (m && m.mode === "new" && !L.used) out.push({id:id, why:m.code});
    else if (m && m.mode === "all" && allTargets(tab, seg, L).length) out.push({id:id, why:m.code});
  });
  return out;
}
function allTargets(tab, seg, L){
  var m = modalRule(L.s, L.f);
  if (!m || m.mode !== "all") return [];
  return arrowsOn(tab, seg).filter(function(R){ return R.a === L.w; })
    .map(function(R){ return R.b; })
    .filter(function(v, i, arr){ return arr.indexOf(v) === i; })
    .filter(function(v){ return !hasLine(tab, seg, v + m.inner + key(L.f.a)); });
}
function owedCond(tab, seg){
  var out = [];
  COND.forEach(function(C){
    if (!S.on[C.k]) return;
    if (condWork(tab, seg, C.k).length) out.push(C);
  });
  return out;
}
/* the arrows a condition is missing on this branch, as [from, to] pairs;
   seriality instead reports the worlds that need a successor */
function condWork(tab, seg, k){
  var ws = worldsOn(tab, seg), ar = arrowsOn(tab, seg), has = {};
  ar.forEach(function(R){ has[R.a + ">" + R.b] = 1; });
  var out = [];
  function want(a, b){ if (!has[a + ">" + b]) out.push([a, b]); }
  if (k === "reflexive") ws.forEach(function(w){ want(w, w); });
  else if (k === "symmetric") ar.forEach(function(R){ want(R.b, R.a); });
  else if (k === "transitive")
    ar.forEach(function(P){ ar.forEach(function(Q){ if (P.b === Q.a) want(P.a, Q.b); }); });
  else if (k === "euclidean")
    ar.forEach(function(P){ ar.forEach(function(Q){ if (P.a === Q.a) want(P.b, Q.b); }); });
  else if (k === "serial"){
    /* Only a world that carries a formula is asked for a successor. One that
       carries none constrains nothing — a saturated branch could only have
       left it bare if no T□ or F◇ pointed at it — so it can be closed off
       with a loop when the structure is read, and the chain stops instead of
       running forever. */
    var holds = {};
    pathLines(tab, seg).forEach(function(id){
      var L = tab.lines[id];
      if (L.kind === "fml") holds[L.w] = 1;
    });
    ws.forEach(function(w){
      if (holds[w] && !ar.some(function(R){ return R.a === w; })) out.push([w, null]);
    });
  }
  return out.filter(function(p, i, arr){
    return arr.findIndex(function(q){ return q[0] === p[0] && q[1] === p[1]; }) === i; });
}

/* ── applying ── */
function applyFml(tab, lineId){
  var L = tab.lines[lineId];
  var p = propRule(L.s, L.f), m = modalRule(L.s, L.f);
  var tgt = leaves(tab, L.seg, "active"), added = 0;
  tgt.forEach(function(lf){
    if (p){
      if (p.kind === "alpha"){
        p.out[0].forEach(function(x){
          if (!hasLine(tab, lf, L.w + x.s + key(x.f))){ addFml(tab, lf, L.w, x.s, x.f, lineId, p.code); added++; }
        });
      } else {
        p.out.forEach(function(br){
          var c = addSeg(tab, lf);
          br.forEach(function(x){ addFml(tab, c, L.w, x.s, x.f, lineId, p.code); added++; });
        });
      }
      return;
    }
    if (m.mode === "new"){
      var v = tab.nextW++;
      addRel(tab, lf, L.w, v, lineId, m.code);
      addFml(tab, lf, v, m.inner, L.f.a, lineId, m.code);
      added += 2;
    } else {
      allTargets(tab, lf, L).forEach(function(v){
        addFml(tab, lf, v, m.inner, L.f.a, lineId, m.code); added++;
      });
    }
  });
  if (p || m.mode === "new") L.used = true;
  return added;
}
function applyCond(tab, seg, k){
  var tgt = leaves(tab, seg, "active"), added = 0;
  tgt.forEach(function(lf){
    condWork(tab, lf, k).forEach(function(pr){
      if (pr[1] === null){                    /* seriality: a successor out of nothing */
        var v = tab.nextW++;
        addRel(tab, lf, pr[0], v, null, "ser"); added++;
      } else if (!hasLine(tab, lf, "R" + pr[0] + ">" + pr[1])){
        addRel(tab, lf, pr[0], pr[1], null, COND.filter(function(c){ return c.k === k; })[0].lbl);
        added++;
      }
    });
  });
  return added;
}
/* The semantics, used for one thing only: checking a countermodel before the
   page claims it is one. A tool that hands you a structure should have looked
   at it first. */
function holdsAt(g, Mo, w){
  switch (g.k){
    case "atom": return !!(Mo.V[g.n] && Mo.V[g.n][w]);
    case "top":  return true;
    case "bot":  return false;
    case "not":  return !holdsAt(g.a, Mo, w);
    case "and":  return holdsAt(g.a, Mo, w) && holdsAt(g.b, Mo, w);
    case "or":   return holdsAt(g.a, Mo, w) || holdsAt(g.b, Mo, w);
    case "imp":  return !holdsAt(g.a, Mo, w) || holdsAt(g.b, Mo, w);
    case "iff":  return holdsAt(g.a, Mo, w) === holdsAt(g.b, Mo, w);
    case "box":
      for (var u = 0; u < Mo.n; u++) if (Mo.R[w][u] && !holdsAt(g.a, Mo, u)) return false;
      return true;
    case "dia":
      for (var v = 0; v < Mo.n; v++) if (Mo.R[w][v] && holdsAt(g.a, Mo, v)) return true;
      return false;
  }
  return false;
}
function badFrame(Mo){
  var n = Mo.n, R = Mo.R, a, b, c;
  if (S.on.serial) for (a = 0; a < n; a++) if (!R[a].some(Boolean)) return "serial";
  if (S.on.reflexive) for (a = 0; a < n; a++) if (!R[a][a]) return "reflexive";
  if (S.on.symmetric) for (a = 0; a < n; a++) for (b = 0; b < n; b++) if (R[a][b] && !R[b][a]) return "symmetric";
  if (S.on.transitive) for (a = 0; a < n; a++) for (b = 0; b < n; b++) for (c = 0; c < n; c++)
    if (R[a][b] && R[b][c] && !R[a][c]) return "transitive";
  if (S.on.euclidean) for (a = 0; a < n; a++) for (b = 0; b < n; b++) for (c = 0; c < n; c++)
    if (R[a][b] && R[a][c] && !R[b][c]) return "euclidean";
  return null;
}
/* does the structure read off the branch actually do what is claimed of it? */
function checkModel(mo){
  var bad = badFrame(mo.M);
  if (bad) return "the structure it gives is not " + bad + ", so it is not a frame of " + logicName(S.on);
  var v = holdsAt(S.root, mo.M, 0);
  if (v === (S.sign === "T")) return null;
  return "the structure it gives makes the root formula " + (v ? "true" : "false") +
         " at " + WN(0) + ", which is not what the branch says";
}

/* an open branch, read off as a structure */
function modelOn(tab, seg){
  var ws = worldsOn(tab, seg), idx = {};
  ws.forEach(function(w, i){ idx[w] = i; });
  var M = newModel(ws.length);
  arrowsOn(tab, seg).forEach(function(R){ M.R[idx[R.a]][idx[R.b]] = true; });
  /* a bare dead end gets a loop, so the structure really is serial */
  if (S.on.serial)
    for (var d = 0; d < M.n; d++) if (!M.R[d].some(Boolean)) M.R[d][d] = true;
  var at = [];
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "fml" && L.f.k === "atom" && at.indexOf(L.f.n) < 0) at.push(L.f.n);
  });
  at.sort();
  at.forEach(function(a){ var row = []; for (var i = 0; i < ws.length; i++) row.push(false); M.V[a] = row; });
  pathLines(tab, seg).forEach(function(id){
    var L = tab.lines[id];
    if (L.kind === "fml" && L.f.k === "atom" && L.s === "T") M.V[L.f.n][idx[L.w]] = true;
  });
  return {M:M, atoms:at, idx:idx, ws:ws};
}
function modelText(mo){
  var es = [];
  for (var a = 0; a < mo.M.n; a++) for (var b = 0; b < mo.M.n; b++) if (mo.M.R[a][b]) es.push(a + ">" + b);
  var vs = mo.atoms.map(function(at){
    var w = [];
    for (var i = 0; i < mo.M.n; i++) if (mo.M.V[at][i]) w.push(i);
    return at + "=" + w.join(",");
  });
  return "W=" + mo.M.n + "; R=" + es.join(",") + (vs.length ? "; " + vs.join("; ") : "");
}

/* ═════════════════════════════════════════════ state */
var MAXWORLDS = 40;
var S = {sign:"F", root:null, tab:null, sel:null, closing:null, undo:[], newLines:null,
         on:{serial:false, reflexive:false, transitive:false, symmetric:false, euclidean:false}};

var $ = function(s){ return document.querySelector(s); };
var fh = function(f){ return '<span class="f">' + fmtHTML(f) + "</span>"; };
var sf = function(w, s, f){
  return '<span class="wl">' + WN(w) + "</span>" +
    '<span class="f"><span class="sg ' + s + '">' + s + "</span>" + fmtHTML(f) + "</span>";
};
var rf = function(a, b){
  return '<span class="f"><span class="wl">' + WN(a) + '</span><span class="rr">R</span>' +
    '<span class="wl">' + WN(b) + "</span></span>";
};
function say(tone, html){
  $("#status").className = "status" + (tone ? " " + tone : "");
  $("#status").querySelector(".msg").innerHTML = html;
}
function snapshot(){
  S.undo.push(JSON.stringify({tab:S.tab, sel:S.sel, closing:S.closing}));
  if (S.undo.length > 120) S.undo.shift();
}

/* ═════════════════════════════════════════════ building */
function build(src){
  var f;
  try { f = parse(src); }
  catch (e){ if (LOG_READY) logFormula({f:src, err:"parse", sign:S.sign}); say("err", e.message); return; }
  if (LOG_READY) logFormula({f:src, sign:S.sign});
  S.root = f;
  S.tab = newTab();
  S.tab.root = addSeg(S.tab, null);
  addFml(S.tab, S.tab.root, 0, S.sign, f, null, null);
  S.sel = null; S.closing = null; S.undo = []; S.newLines = null;
  say("", "Start at <b>" + WN(0) + "</b> with " + sf(0, S.sign, f) + ". A branch dies when one world has to " +
      "make the same formula true and false; a branch that runs out of rules is a <b>countermodel</b> you " +
      "can open in the model lab. The logic is <b>" + logicName(S.on) + "</b>." +
      ((S.on.transitive || S.on.euclidean)
        ? " <b>Note:</b> with transitivity or euclideanness the search need not stop — a ◇ can keep asking " +
          "for a fresh world that the closure then reaches. Proofs still close; it is the <i>countermodels</i> " +
          "that can run away, and when they do the repeating pattern is the model."
        : ""));
  draw();
}

/* ═════════════════════════════════════════════ actions */
function selectLine(id){
  if (S.closing){ pickClosure(id); return; }
  var L = S.tab.lines[id];
  S.sel = (S.sel === id) ? null : id;
  if (S.sel !== null){
    if (L.kind === "rel")
      say("", "Line " + id + " is the arrow " + rf(L.a, L.b) + ". Arrows are not broken down — they are what " +
          "the □ and ◇ rules travel along.");
    else if (L.f.k === "atom" || L.f.k === "top" || L.f.k === "bot")
      say("", "Line " + id + " is atomic. Nothing to break down — atoms are what closes a branch.");
    else if (L.used && !modalRule(L.s, L.f))
      say("", "Line " + id + " is ticked: every open branch below it already carries its expansion.");
    else say("", "Line " + id + " selected — now choose its rule above.");
  }
  draw();
}
function clickRule(code){
  if (!S.tab) return;
  if (S.sel === null){ say("", "Click a line in the tree first, then choose its rule."); return; }
  var L = S.tab.lines[S.sel];
  var want = RULES.filter(function(x){ return x.code === code; })[0];
  if (L.kind === "rel"){
    say("err", "(" + code + ") needs a signed formula. Line " + S.sel + " is the arrow " + rf(L.a, L.b) + ".");
    return;
  }
  var r = propRule(L.s, L.f), m = modalRule(L.s, L.f);
  if (!r && !m){
    say("err", "(" + code + ") needs a compound formula. Line " + S.sel + " is atomic — nothing breaks down.");
    return;
  }
  var mine = r ? r.code : m.code;
  if (mine !== code){
    say("err", "(" + code + ") applies to " + want.prem + ". Line " + S.sel + " is " + sf(L.w, L.s, L.f) +
        ", so its rule is <b>(" + mine + ")</b>.");
    return;
  }
  if (!leaves(S.tab, L.seg, "active").length){
    say("err", "Every branch through line " + S.sel + " is already closed — nothing left to expand.");
    return;
  }
  if (m && m.mode === "all"){
    var tg = leaves(S.tab, L.seg, "active").reduce(function(t, lf){ return t + allTargets(S.tab, lf, L).length; }, 0);
    if (!tg){
      say("err", "(" + code + ") sends " + fh(L.f.a) + " along every arrow out of " + WN(L.w) +
          ", and every such world already carries it" +
          (arrowsOn(S.tab, leaves(S.tab, L.seg, "active")[0]).some(function(R){ return R.a === L.w; })
            ? "." : " — in fact " + WN(L.w) + " has no arrows out of it yet, so the rule has nowhere to send it.") +
          " Make an arrow first, with (□F), (◇T) or a frame condition.");
      return;
    }
  } else if (L.used){
    say("err", "Line " + S.sel + " is already used (✓). " +
        (m ? "An existential rule makes its one world and is finished." : "Applying its rule again adds nothing."));
    return;
  }
  if (m && m.mode === "new" && worldsOn(S.tab, leaves(S.tab, L.seg, "active")[0]).length >= MAXWORLDS){
    say("err", "This branch is up to " + MAXWORLDS + " worlds. With <b>transitivity</b> or " +
        "<b>euclideanness</b> switched on, a ◇ can keep demanding a fresh world for ever: the new arrows " +
        "the closure adds reach the new world, which wakes the ◇ again. That is not a mistake in your " +
        "working — it is why S4 and S5 need a loop check, which this page does not do. Look at the " +
        "formulas repeating at the last few worlds: that repetition is the countermodel.");
    return;
  }
  snapshot();
  var before = S.tab.nextLine;
  var n = applyFml(S.tab, S.sel);
  S.sel = null; S.newLines = [];
  for (var i = before; i < S.tab.nextLine; i++) S.newLines.push(i);
  say("ok", "(" + mine + ") applied — " + (
    r ? (r.kind === "beta" ? "a β-rule, so the branch splits in two." : "an α-rule, so the branch just grows.")
      : m.mode === "new" ? "a new world, with the arrow that reaches it."
                         : "sent along every arrow out of " + WN(L.w) + "."));
  draw(true);
  checkDone();
}
function clickCond(k){
  if (!S.tab) return;
  var C = COND.filter(function(c){ return c.k === k; })[0];
  if (!S.on[k]){
    say("err", "The logic is <b>" + logicName(S.on) + "</b>, which does not assume " + k +
        " frames. Switch " + k + " on above if that is the logic you want.");
    return;
  }
  var live = leaves(S.tab, S.tab.root, "active");
  var work = live.reduce(function(t, lf){ return t + condWork(S.tab, lf, k).length; }, 0);
  if (!work){ say("err", "Nothing to add: every open branch already satisfies " + k + "."); return; }
  snapshot();
  var before = S.tab.nextLine;
  applyCond(S.tab, S.tab.root, k);
  S.sel = null; S.newLines = [];
  for (var i = before; i < S.tab.nextLine; i++) S.newLines.push(i);
  say("ok", "<b>" + k + "</b> — " + C.law + ". " +
      "Those arrows may wake a (□T) or (◇F) line that had nowhere to go.");
  draw(true);
  checkDone();
}
function toggleCond(k){
  S.on[k] = !S.on[k];
  say("", "The logic is now <b>" + logicName(S.on) + "</b>" +
      (S.tab ? ". Rules already applied stay; the frame conditions only ever add arrows, so turning one on " +
               "mid-proof is safe." : "."));
  draw();
}

function startClosing(seg){
  S.closing = {seg:seg, picks:[]};
  S.sel = null;
  say("", "Click the two lines on that branch that contradict — the same formula at the <b>same world</b>, " +
      "once under T and once under F.");
  draw();
}
function pickClosure(id){
  var c = S.closing, tab = S.tab;
  if (pathLines(tab, c.seg).indexOf(id) < 0){
    say("err", "Line " + id + " is not on that branch.");
    return;
  }
  if (c.picks.indexOf(id) >= 0){ c.picks = c.picks.filter(function(x){ return x !== id; }); draw(); return; }
  c.picks.push(id);
  if (c.picks.length < 2){ draw(); return; }
  var A = tab.lines[c.picks[0]], B = tab.lines[c.picks[1]];
  if (A.kind !== "fml" || B.kind !== "fml"){
    say("err", "An arrow cannot close a branch — pick two signed formulas."); c.picks = []; draw(); return;
  }
  if (A.w !== B.w){
    say("err", "Those are at different worlds, " + WN(A.w) + " and " + WN(B.w) +
        ". A formula may be true in one world and false in another with no contradiction at all — that is " +
        "the whole point of the possible worlds.");
    c.picks = []; draw(); return;
  }
  if (key(A.f) !== key(B.f)){
    say("err", "Those are different formulas: " + fh(A.f) + " and " + fh(B.f) + ".");
    c.picks = []; draw(); return;
  }
  if (A.s === B.s){
    say("err", "Lines " + A.id + " and " + B.id + " are both signed <b>" + A.s + "</b>. You need one T and one F.");
    c.picks = []; draw(); return;
  }
  snapshot();
  tab.segs[c.seg].state = "closed";
  tab.segs[c.seg].closure = [A.id, B.id];
  S.closing = null;
  say("ok", "Branch closed — " + WN(A.w) + " would have to make " + fh(A.f) + " true and false at once.");
  draw();
  checkDone();
}
function markOpen(seg){
  var tab = S.tab, c = clashOn(tab, seg);
  if (c){
    var L = tab.lines[c[0]];
    say("err", "That branch already contradicts itself at " + WN(L.w) + " — line " + c[0] +
        (c[0] === c[1] ? "" : " against line " + c[1]) + ". It closes.");
    return;
  }
  var owed = owedFml(tab, seg), oc = owedCond(tab, seg);
  if (owed.length){
    var L2 = tab.lines[owed[0].id];
    say("err", "Not finished: line " + L2.id + ", " + sf(L2.w, L2.s, L2.f) + ", still owes its (" +
        owed[0].why + "). Every rule must be spent before a branch counts as open.");
    return;
  }
  if (oc.length){
    say("err", "Not finished: the logic is <b>" + logicName(S.on) + "</b> and this branch is not yet " +
        oc[0].k + ". Apply <b>" + oc[0].lbl + "</b> first — a countermodel has to be a frame of the logic.");
    return;
  }
  var mo0 = modelOn(tab, seg), why = checkModel(mo0);
  if (why){
    say("err", "Something is wrong: " + why + ". This is a bug in the tool, not in your working — " +
        "please report it.");
    return;
  }
  snapshot();
  tab.segs[seg].state = "open";
  var mo = modelOn(tab, seg);
  say("ok", "Branch open. It reads off as <code>" + modelText(mo) + "</code> — " +
      plural(mo.M.n, "world") + ", " + plural(mo.M.R.reduce(function(t, r){
        return t + r.filter(Boolean).length; }, 0), "arrow") + ".");
  draw();
  checkDone();
}
function plural(n, w, pl){ return n + " " + (n === 1 ? w : (pl || w + "s")); }

function checkDone(){
  var tab = S.tab, lv = leaves(tab, tab.root);
  if (lv.some(function(s){ return tab.segs[s].state === "active"; })) return;
  var open = lv.filter(function(s){ return tab.segs[s].state === "open"; });
  if (!open.length){
    say("ok", "<b>Tableau closed.</b> All " + plural(lv.length, "branch", "branches") + " died, so no " +
        logicName(S.on) + " structure makes " + sf(0, S.sign, S.root) + " — " +
        (S.sign === "F" ? "the formula is <b>valid in " + logicName(S.on) + "</b>."
                        : "the formula is <b>unsatisfiable in " + logicName(S.on) + "</b>."));
  } else {
    var mo = modelOn(tab, open[0]), why2 = checkModel(mo);
    if (why2){ say("err", "Something is wrong: " + why2 + " — please report it."); return; }
    say("ok", "<b>Tableau open.</b> The branch marked ○ gives a structure making " + sf(0, S.sign, S.root) +
        " — " + (S.sign === "F" ? "a <b>countermodel</b>, so the formula is not valid in " + logicName(S.on)
                                : "a <b>model</b>, so it is satisfiable") + ". " +
        '<a class="golink" href="kripke.html#' + encodeURIComponent(modelText(mo)) +
        '" target="_blank" rel="noopener">Open it in the model lab →</a>');
  }
}
function undo(){
  if (!S.undo.length){ say("", "Nothing to undo — you are back at the root."); return; }
  var s = JSON.parse(S.undo.pop());
  S.tab = s.tab; S.sel = s.sel; S.closing = s.closing;
  say("", "Stepped back one move.");
  draw();
}

/* ═════════════════════════════════════════════ drawing */
function draw(flash){
  drawRules();
  var c = $("#canvas");
  if (!S.tab){ c.innerHTML = ""; return; }
  c.innerHTML = '<div class="tree">' + segHTML(S.tab, S.tab.root) + "</div>";
  equalize(c);
  if (flash && S.newLines){
    S.newLines.forEach(function(id){
      var el = c.querySelector('[data-line="' + id + '"]');
      if (el) el.classList.add("hi");
    });
    S.newLines = null;
  }
}
function segHTML(tab, seg){
  var sg = tab.segs[seg], h = '<div class="seg"><div class="lines">';
  h += sg.lines.map(function(id){ return lineHTML(tab, id); }).join("") + "</div>";
  if (sg.kids.length){
    h += '<div class="fork">' + sg.kids.map(function(k){
      return '<div class="branch-col">' + segHTML(tab, k) + "</div>";
    }).join("") + "</div>";
  } else h += tipHTML(tab, seg);
  return h + "</div>";
}
function lineHTML(tab, id){
  var L = tab.lines[id], cls = ["line"];
  if (L.kind === "rel") cls.push("rel");
  else {
    var m = modalRule(L.s, L.f);
    var spent = m && m.mode === "all"
      ? !leaves(tab, L.seg, "active").some(function(lf){ return allTargets(tab, lf, L).length; })
      : L.used;
    if (spent && (propRule(L.s, L.f) || m)) cls.push("used");
  }
  if (S.sel === id) cls.push("sel");
  if (S.closing && S.closing.picks.indexOf(id) >= 0) cls.push("pick");
  return '<button type="button" class="' + cls.join(" ") + '" data-line="' + id + '">' +
    '<span class="num">' + id + '</span><span class="tick">✓</span>' +
    '<span class="body">' + (L.kind === "rel" ? rf(L.a, L.b) : sf(L.w, L.s, L.f)) + "</span>" +
    '<span class="just">' + (L.src ? L.src + ' <span class="rc">' + L.rule + "</span>"
                                   : L.rule ? '<span class="rc">' + L.rule + "</span>" : "") + "</span></button>";
}
function tipHTML(tab, seg){
  var sg = tab.segs[seg];
  if (sg.state === "closed")
    return '<div class="tip closed"><span class="mark">×</span><span class="note">closed · ' +
      sg.closure[0] + ", " + sg.closure[1] + "</span></div>";
  if (sg.state === "open"){
    var mo = modelOn(tab, seg);
    return '<div class="tip open"><span class="mark">○</span><span class="note">' +
      modelText(mo) + "</span></div>";
  }
  if (pathLines(tab, seg).length < 2) return "";
  if (S.closing && S.closing.seg === seg){
    var left = 2 - S.closing.picks.length;
    return '<div class="tip"><span class="prompt">pick ' + left + " more line" + (left === 1 ? "" : "s") +
      '</span><button class="tipbtn" data-act="cancel">cancel</button></div>';
  }
  return '<div class="tip"><div class="acts">' +
    '<button class="tipbtn c" data-act="close" data-seg="' + seg + '">Close ×</button>' +
    '<button class="tipbtn o" data-act="open" data-seg="' + seg + '">Open ○</button></div></div>';
}
function equalize(root){
  var forks = Array.prototype.slice.call(root.querySelectorAll(".fork")).reverse();
  forks.forEach(function(fork){
    var kids = Array.prototype.slice.call(fork.children).filter(function(n){
      return n.classList && n.classList.contains("branch-col");
    });
    kids.forEach(function(k){ k.style.width = ""; });
    var w = 0;
    kids.forEach(function(k){ w = Math.max(w, k.getBoundingClientRect().width); });
    kids.forEach(function(k){ k.style.width = w + "px"; });
  });
}
function drawRules(){
  var L = (S.tab && S.sel !== null) ? S.tab.lines[S.sel] : null;
  var mine = null;
  if (L && L.kind === "fml"){
    var p = propRule(L.s, L.f), m = modalRule(L.s, L.f);
    mine = p ? p.code : m ? m.code : null;
  }
  var h = "";
  [["alpha","α","extends the branch"], ["beta","β","splits the branch"],
   ["all","∀","sends it along every arrow"], ["new","∃","makes a new world"]].forEach(function(g){
    h += '<div class="rulegroup"><span class="glyph" title="' + g[2] + '">' + g[1] + '</span><div class="rulerow">';
    RULES.filter(function(x){ return x.kind === g[0]; }).forEach(function(R){
      var cls = "rule" + (mine ? (mine === R.code ? " armed" : " dim") : "");
      h += '<button type="button" class="' + cls + '" data-rule="' + R.code + '">' +
        '<span class="code">' + R.code + '</span><span class="sch">' + R.prem + '<span class="ar">⇒</span>' +
        R.out.map(function(b){ return b.join(", "); }).join('<span class="bar">|</span>') + "</span></button>";
    });
    h += "</div></div>";
  });
  /* the frame conditions: a switch for the logic, and a button to apply one */
  h += '<div class="rulegroup"><span class="glyph" title="the frame conditions of the logic">R</span>' +
       '<div class="rulerow">';
  COND.forEach(function(C){
    var live = S.on[C.k];
    var work = live && S.tab ? leaves(S.tab, S.tab.root, "active")
      .reduce(function(t, lf){ return t + condWork(S.tab, lf, C.k).length; }, 0) : 0;
    h += '<span class="condwrap">' +
      '<button type="button" class="condsw' + (live ? " on" : "") + '" data-cond-toggle="' + C.k +
        '" title="' + (live ? "On: " : "Off: ") + C.k + ' frames — axiom ' + C.ax + '">' + C.ax + "</button>" +
      '<button type="button" class="rule cond' + (live ? (work ? " armed" : " dim") : " off") +
        '" data-cond="' + C.k + '" title="' + C.law + '">' +
        '<span class="code">' + C.lbl + '</span><span class="sch">' + C.k + "</span></button></span>";
  });
  h += "</div></div>";
  h += '<div class="logicname">logic <b>' + logicName(S.on) + "</b></div>";
  $("#rules").innerHTML = h;
}
/* ═════════════════════════════════════════════ connective pad */
/* The caret is remembered so a pad press inserts where the student was
   typing, even on touch where the input loses focus first. */
var caret = null;
function rememberCaret(){
  var el = $("#formula");
  if (el.selectionStart !== null) caret = [el.selectionStart, el.selectionEnd];
}
["input","click","keyup","select","blur"].forEach(function(ev){
  $("#formula").addEventListener(ev, rememberCaret);
});

function insertSym(ch){
  var el = $("#formula"), v = el.value, a, b;
  if (document.activeElement === el && el.selectionStart !== null){
    a = el.selectionStart; b = el.selectionEnd;
  } else if (caret){ a = caret[0]; b = caret[1]; }
  if (a === undefined || a === null){ a = b = v.length; }
  el.value = v.slice(0, a) + ch + v.slice(b);
  var pos = a + ch.length;
  caret = [pos, pos];
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e){}
}

/* keep the caret: don't let the button take focus away from the input */
$("#pad").addEventListener("mousedown", function(e){
  if (e.target.closest("[data-sym]")) e.preventDefault();
});

/* ═════════════════════════════════════════════ wiring */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-sym],[data-line],[data-rule],[data-cond],[data-cond-toggle],[data-act],[data-sign]");
  if (!t) return;
  if (t.hasAttribute("data-sym")){ insertSym(t.dataset.sym); return; }
  if (t.hasAttribute("data-sign")){
    S.sign = t.dataset.sign;
    document.querySelectorAll("[data-sign]").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.sign === S.sign));
    });
    build($("#formula").value);
    return;
  }
  if (t.hasAttribute("data-line")){ selectLine(+t.dataset.line); return; }
  if (t.hasAttribute("data-rule")){ clickRule(t.dataset.rule); return; }
  if (t.hasAttribute("data-cond-toggle")){ toggleCond(t.dataset.condToggle); return; }
  if (t.hasAttribute("data-cond")){ clickCond(t.dataset.cond); return; }
  var a = t.dataset.act;
  if (a === "close") startClosing(t.dataset.seg);
  else if (a === "open") markOpen(t.dataset.seg);
  else if (a === "cancel"){ S.closing = null; say("", "Closure cancelled."); draw(); }
});

$("#entry").addEventListener("submit", function(e){ e.preventDefault(); build($("#formula").value); });
$("#undo").addEventListener("click", undo);
$("#reset").addEventListener("click", function(){
  /* a restart re-runs the formula already in the box; not a submission */
  var was = LOG_READY; LOG_READY = false;
  build($("#formula").value);
  LOG_READY = was;
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){
    if (S.closing){ S.closing = null; draw(); }
    else if (S.sel !== null){ S.sel = null; draw(); }
  }
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});

window.addEventListener("resize", function(){ if (S.tab) equalize($("#canvas")); });

build($("#formula").value);
LOG_READY = true;
if (document.fonts) document.fonts.ready.then(function(){ if (S.tab) equalize($("#canvas")); });

/* ── theme toggle ─────────────────────────────────────── */
function themeNow(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch (e){ return "light"; }
}
function syncTheme(){
  var b = document.getElementById("themeBtn"), next = themeNow() === "dark" ? "light" : "dark";
  b.title = "Switch to the " + next + " theme";
  b.setAttribute("aria-label", b.title);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("logic.theme", next); } catch (e){}
  syncTheme();
});
syncTheme();
</script>
</body>
</html>
