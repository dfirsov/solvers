<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Natural deduction for predicate logic: the quantifier rules with their eigenvariable conditions, eliminations running forward and introductions backward until the two halves meet.">
<title>Predicate Natural Deduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F3F4F8;
  --paper:#FFFFFF;
  --soft:#E7EAF2;
  --ink:#171A26;
  --ink-2:#5D6379;
  --ink-3:#8A91A6;
  --line:#D3D7E4;
  --accent:#2E3FA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E4FB;
  --closed:#1F7A5C;
  --closed-soft:#D8EEE5;
  --open:#A46200;
  --open-soft:#FBEEDA;
  --error:#B3261E;
  --error-soft:#FAE0DE;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:"Newsreader", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --paper:#191C29; --soft:#232736;
    --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
    --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
    --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
    --error:#F3897D; --error-soft:#3B1D1A;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111320; --paper:#191C29; --soft:#232736;
  --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
  --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
  --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
  --error:#F3897D; --error-soft:#3B1D1A;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

#app{height:100%; display:flex; flex-direction:column; padding-inline:20px; max-width:1400px; margin:0 auto}

/* ── input row ─────────────────────────────────────────── */
.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.wordmark{font-family:var(--serif); font-size:17px; color:var(--ink-2); white-space:nowrap}
.wordmark span{color:var(--accent)}
.sibling{font-size:12px; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px}
.sibling:hover{color:var(--accent)}
form{display:flex; align-items:center; gap:8px; flex:1; min-width:280px; flex-wrap:wrap}
input[type=text]{
  flex:1; min-width:0; font-family:var(--mono); font-size:15px;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.go{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:7px; padding:8px 16px; font-weight:500;
}
.go:hover{filter:brightness(1.08)}
.link{
  border:0; background:transparent; color:var(--ink-3); padding:6px 4px;
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--ink)}

.pad{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-basis:100%}
.pad button{
  font-family:var(--serif); font-size:17px; line-height:1;
  min-width:36px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s;
}
.pad button:hover{background:var(--soft); border-color:var(--ink-3)}
.pad button:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pad .gap{width:10px}
.padhint{font-size:12px; color:var(--ink-3); margin-left:4px}
.padhint code{font-family:var(--mono); font-size:11.5px}

/* ── rule strip ────────────────────────────────────────── */
.strip{display:flex; align-items:center; gap:8px 18px; flex-wrap:wrap}
.strip.a{padding-block:2px 7px}
.strip.b{padding-block:0 13px; border-bottom:1px solid var(--line)}
.glabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap; flex:none;
}
.glabel i{font-style:normal; color:var(--ink-3); opacity:.7}
.group{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.rule{
  font-family:var(--serif); font-size:15px; line-height:1;
  min-width:34px; padding:6px 7px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s, opacity .1s;
}
.rule:hover{background:var(--soft); border-color:var(--ink-3)}
.rule.armed{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rule.dim{opacity:.32}
.rule sub{font-size:.7em}
.rsep{width:1px; align-self:stretch; min-height:18px; background:var(--line); margin-inline:5px; flex:none}
.done{
  border:1px solid var(--closed); background:transparent; color:var(--closed);
  border-radius:7px; padding:6px 16px; font-weight:500; flex:none;
}
.done:hover{background:var(--closed-soft)}
.done:disabled{opacity:.4; cursor:not-allowed}
.done:disabled:hover{background:transparent}

/* ── status ────────────────────────────────────────────── */
.status{
  display:flex; align-items:baseline; gap:10px;
  padding-block:11px; min-height:42px; font-size:13.5px; color:var(--ink-2);
}
.status .msg{flex:1}
.status.ok{color:var(--closed)}
.status.err{color:var(--error)}
.status b{font-weight:500; color:var(--ink)}
.status.ok b,.status.err b{color:inherit; font-weight:600}
.status .acts{display:flex; gap:2px; flex:none}
.f{font-family:var(--serif); font-size:15.5px}
.f i{font-style:italic}
.f .op{margin:0 .26em}
.f .op.neg{margin:0 .04em 0 0}
.f .pr{color:var(--ink-3)}
.f .cst{font-style:normal; color:var(--accent)}

/* ── the board ─────────────────────────────────────────── */
.board{
  flex:1; min-height:0; overflow:auto; margin-bottom:18px;
  display:flex; flex-direction:column;
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
}
.band{padding:12px 16px 16px; border-bottom:1px solid var(--line)}
.band:last-child{border-bottom:0}
.band .bl{
  display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:10px;
}
.band .bl i{font-style:normal; opacity:.75}
.band .row{display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px 26px}
.band .none{font-size:12.5px; color:var(--ink-3); font-style:italic}
.scopeband{background:var(--soft); padding-block:9px 11px}
.scopeband .row{gap:6px}

.frag{
  /* extra room on the right: rule names hang off the end of their bar */
  display:inline-block; padding:7px 38px 5px 12px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper);
  transition:border-color .1s, background .1s, opacity .1s;
}
.frag:hover{border-color:var(--ink-3); background:var(--soft)}
.frag.sel{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent)}
.frag.fits{border-color:var(--closed); background:var(--closed-soft)}
.frag.fits::after{
  content:"joins"; display:block; margin-top:4px; text-align:center;
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--closed);
}
.frag.out{opacity:.4}
.frag.out:hover{opacity:.7}

.chip{
  font-family:var(--serif); font-size:14.5px; line-height:1.2;
  padding:4px 10px; border-radius:20px;
  border:1px dashed var(--open); background:var(--paper); color:var(--ink);
}
.chip:hover{background:var(--open-soft)}
.chip sup{font-family:var(--mono); font-size:.6em; color:var(--open); vertical-align:super; margin-left:2px}
.chip .pm{font-family:var(--mono); font-size:.58em; color:var(--ink-3); margin-left:5px;
          letter-spacing:.06em; text-transform:uppercase}

.gtree{display:inline-flex; flex-direction:column; align-items:flex-start}
.gtree .gl{
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); margin-bottom:6px;
}
.gtree.claim .gl{color:var(--open)}

/* ── the proof tree ────────────────────────────────────── */
.pn{display:inline-flex; flex-direction:column; align-items:center; vertical-align:bottom}
.pn-kids{display:flex; align-items:flex-end; gap:26px}
.pn-bar{
  align-self:stretch; height:0; border-top:1.3px solid var(--ink-2);
  margin:5px 0 3px; position:relative;
}
.pn-rule{
  position:absolute; left:100%; top:-8px; padding-left:7px;
  font-family:var(--mono); font-size:10px; color:var(--accent); white-space:nowrap;
}
.pn-f{white-space:nowrap; padding:1px 3px; font-family:var(--serif); font-size:16px}
.pn-f i{font-style:italic}
.pn-f .op{margin:0 .24em}
.pn-f .op.neg{margin:0 .04em 0 0}
.pn-f .pr{color:var(--ink-3)}
.pn-f .cst{font-style:normal; color:var(--accent)}
.pn-ass{color:var(--ink-2)}
.pn-ass .brk{color:var(--open)}
.pn-ass sup{font-family:var(--mono); font-size:.62em; color:var(--open); vertical-align:super}
.goal{
  border:1px dashed var(--open); border-radius:6px; background:var(--open-soft);
  cursor:pointer; padding:2px 8px;
}
.goal:hover{border-color:var(--accent)}
.goal.sel{border-style:solid; border-color:var(--accent); background:var(--accent-soft);
          box-shadow:0 0 0 1px var(--accent)}
.goal.dead{border-color:var(--error); background:var(--error-soft)}
.goal .q{font-family:var(--mono); font-size:10px; color:var(--open); margin-right:5px}
.goal.sel .q{color:var(--accent)}
.goal.dead .q{color:var(--error)}

/* ── the ask panel ─────────────────────────────────────── */
.ask{
  border:1px solid var(--accent); background:var(--accent-soft);
  border-radius:9px; padding:11px 13px; margin-bottom:14px;
}
.ask p{margin:0 0 9px; font-size:13px}
.ask .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ask input[type=text]{font-size:14px; padding:6px 10px; flex:1; min-width:140px}
.ask .sug{
  font-family:var(--serif); font-size:14.5px; padding:5px 10px; border-radius:6px;
  border:1px solid var(--accent); background:var(--paper); color:var(--ink);
}
.ask .sug:hover{background:var(--accent); color:var(--accent-ink)}
.ask .sug:hover i{color:var(--accent-ink)}
.ask .cancel{border:0; background:transparent; color:var(--ink-3); text-decoration:underline;
             text-underline-offset:3px; font-size:12.5px; padding:5px 2px}

/* ── verdict ───────────────────────────────────────────── */
.out{
  border:1px solid var(--line); background:var(--paper);
  border-radius:9px; padding:13px 15px; margin-bottom:14px;
}
.out .onote{margin:0; font-size:13px; color:var(--ink-2)}
.out .onote code{font-family:var(--mono); font-size:12px; color:var(--ink)}

@media (max-width:980px){
  #app{height:auto; min-height:100%; padding-inline:16px}
  .board{min-height:420px}
  .wordmark{display:none}
  .pad button{min-width:34px; padding:6px 7px; font-size:16px}
  .padhint{flex-basis:100%; margin:2px 0 0}
}
.theme{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-2);
  border-radius:6px; padding:3px 9px; font-size:14px; line-height:1.35;
  cursor:pointer; flex:none;
}
.theme:hover{border-color:var(--accent); color:var(--accent)}
</style>
<script>
/* stamp the saved theme before anything paints, so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("logic.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>

<body>
<div id="app">
  <div class="top">
    <span class="wordmark"><span>∴</span> PREDICATE</span>
    <a class="sibling" href="index.html">← All solvers</a>
    <button class="theme" id="themeBtn" type="button">◐</button>
    <form id="entry">
      <input type="text" id="formula" spellcheck="false" autocomplete="off"
             aria-label="Sequent or formula" value="forall x. (P(x) -> Q(x)), exists x. P(x) |- exists x. Q(x)">
      <button type="submit" class="go">Start proof</button>
      <div class="pad" id="pad" role="group" aria-label="Insert a connective">
        <button type="button" data-sym="¬" aria-label="Insert negation" title="negation — also typed as ~ or !">¬</button>
        <button type="button" data-sym="∧" aria-label="Insert conjunction" title="conjunction — also typed as &amp; or /\">∧</button>
        <button type="button" data-sym="∨" aria-label="Insert disjunction" title="disjunction — also typed as | or \/">∨</button>
        <button type="button" data-sym="⊃" aria-label="Insert implication" title="implication — also typed as -&gt;, =&gt; or →">⊃</button>
        <button type="button" data-sym="≡" aria-label="Insert biconditional" title="biconditional — also typed as &lt;-&gt;, &lt;=&gt; or ↔">≡</button>
        <span class="gap"></span>
        <button type="button" data-sym="∀" aria-label="Insert universal quantifier" title="for all — also typed as forall or all">∀</button>
        <button type="button" data-sym="∃" aria-label="Insert existential quantifier" title="there exists — also typed as exists or some">∃</button>
        <button type="button" data-sym="(" aria-label="Insert opening bracket">(</button>
        <button type="button" data-sym=")" aria-label="Insert closing bracket">)</button>
        <button type="button" data-sym="⊢" aria-label="Insert turnstile" title="turnstile — also typed as |-">⊢</button>
        <span class="padhint">capitals are predicates, lowercase are terms — <code>forall x. P(x) -&gt; Q(x)</code></span>
      </div>
    </form>
  </div>

  <div class="strip b">
    <span class="glabel" title="Nothing selected acts on the goal; facts selected act on them">Rules
      <i>↑ goal · ↓ facts</i></span>
    <div class="group" id="rules"></div>
    <button type="button" class="rule" id="claimBtn" data-claim="1"
            title="Derive something first, then use it as a premise">Claim…</button>
    <button class="done" id="doneBtn" disabled>Done</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="msg"></span>
    <span class="acts">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="reset">Restart</button>
    </span>
  </div>

  <div class="ask" id="ask" hidden></div>
  <div class="out" id="out" hidden></div>

  <div class="board" id="board"></div>
</div>

<script>
"use strict";

/* ═════════════════════════════════════════════ logging */
/* One line per formula submitted: someone types a formula, presses the button,
   and that is recorded. Nothing else is — no rule steps, no verdicts, no page
   views. Posts to the host that served this page, same origin; a failure is
   swallowed, so logging can never break the tool. LOG_URL = "" switches it off. */
var LOG_URL = "log.php";
var LOG_PAGE = "predicate";
var LOG_READY = false;      /* the formula a page loads with is not a submission */

function logFormula(data){
  if (!LOG_URL) return;
  try {
    var ev = {t:new Date().toISOString(), p:LOG_PAGE};
    Object.keys(data).forEach(function(k){
      var v = data[k];
      ev[k] = (typeof v === "string" && v.length > 300) ? v.slice(0, 300) : v;
    });
    var body = JSON.stringify([ev]);
    if (navigator.sendBeacon &&
        navigator.sendBeacon(LOG_URL, new Blob([body], {type:"application/json"}))) return;
    fetch(LOG_URL, {method:"POST", body:body, keepalive:true,
                    headers:{"Content-Type":"application/json"}}).catch(function(){});
  } catch (e){}
}

/* ═════════════════════════════════════════════ formulas */
/* First order. A term is a lowercase name; a predicate is an uppercase name
   with a fixed arity, nullary ones being ordinary propositional letters.
   Whether a name is a variable or a constant is not spelled — it is decided
   by whether a quantifier binds it, which is how a logician reads it. */
var OPCH = {and:"∧", or:"∨", imp:"⊃", iff:"≡"};
var QCH = {all:"∀", ex:"∃"};

function tm(n){ return {k:"tm", n:n}; }
function pred(n, args){ return {k:"pred", n:n, args:args || []}; }

function show(g, esc, wrap, neg, opw, cst, prd, qnt){
  cst = cst || function(t){ return t; };
  /* "tail" is: nothing can follow this subformula inside its brackets. A
     quantifier's scope runs as far right as it can, so it only needs brackets
     when something *does* follow — ¬∃xP(x) is unambiguous, ¬(∃xP(x))∧Q is not. */
  function needs(c, pk, left, tail){
    if (c.k === "pred" || c.k === "not" || c.k === "top" || c.k === "bot") return false;
    if (c.k === "all" || c.k === "ex") return pk !== null && !tail;
    if (pk === "not") return true;
    if ((pk === "and" || pk === "or") && c.k === pk && left) return false;
    return true;
  }
  function go(h, pk, left, tail){
    var w = needs(h, pk, left, tail);
    var s = body(h, w || tail);      /* inside brackets, the child is at the end again */
    return w ? wrap(s) : s;
  }
  function body(h, tail){
    if (h.k === "pred") return prd(h.n, h.args.map(function(t){ return t.n; }));
    if (h.k === "top") return cst("⊤");
    if (h.k === "bot") return cst("⊥");
    if (h.k === "not") return neg() + go(h.a, "not", false, tail);
    /* the body of a quantifier is always bracketed unless it is atomic or
       another quantifier — the scope is the thing students get wrong */
    if (h.k === "all" || h.k === "ex") return qnt(QCH[h.k], h.v) + go(h.a, null, false, true);
    return go(h.a, h.k, true, false) + opw(OPCH[h.k]) + go(h.b, h.k, false, tail);
  }
  return body(g, true);
}
function fmtHTML(g){
  return show(g,
    null,
    function(s){ return '<span class="pr">(</span>' + s + '<span class="pr">)</span>'; },
    function(){ return '<span class="op neg">¬</span>'; },
    function(o){ return '<span class="op">' + o + "</span>"; },
    function(t){ return '<span class="cst">' + t + "</span>"; },
    function(n, as){
      return "<b>" + n + "</b>" + (as.length ? '<span class="pr">(</span>' +
        as.map(function(t){ return "<i>" + t + "</i>"; }).join('<span class="pr">,</span>') +
        '<span class="pr">)</span>' : "");
    },
    function(q, v){ return '<span class="qu">' + q + "</span><i>" + v + "</i>"; });
}
function fmtText(g){
  return show(g, null, function(s){ return "(" + s + ")"; },
    function(){ return "¬"; }, function(o){ return o; }, function(t){ return t; },
    function(n, as){ return n + (as.length ? "(" + as.join(",") + ")" : ""); },
    function(q, v){ return q + v; });
}

/* ── binding ── */
function freeIn(g, out, bound){
  out = out || []; bound = bound || [];
  if (g.k === "pred"){
    g.args.forEach(function(t){
      if (bound.indexOf(t.n) < 0 && out.indexOf(t.n) < 0) out.push(t.n);
    });
    return out;
  }
  if (g.k === "top" || g.k === "bot") return out;
  if (g.k === "not") return freeIn(g.a, out, bound);
  if (g.k === "all" || g.k === "ex") return freeIn(g.a, out, bound.concat([g.v]));
  freeIn(g.a, out, bound); freeIn(g.b, out, bound);
  return out;
}
function namesIn(g, out){
  out = out || [];
  if (g.k === "pred"){
    g.args.forEach(function(t){ if (out.indexOf(t.n) < 0) out.push(t.n); });
    return out;
  }
  if (g.k === "top" || g.k === "bot") return out;
  if (g.k === "not") return namesIn(g.a, out);
  if (g.k === "all" || g.k === "ex"){
    if (out.indexOf(g.v) < 0) out.push(g.v);
    return namesIn(g.a, out);
  }
  namesIn(g.a, out); namesIn(g.b, out);
  return out;
}
function fresh(avoid, hint){
  var base = hint || "a";
  for (var i = 0; i < 400; i++){
    var n = i === 0 ? base : base + (i + 1);
    if (avoid.indexOf(n) < 0) return n;
  }
  return base + "_" + Math.random().toString(36).slice(2, 5);
}
/* substitution that renames a binder rather than letting it capture */
function subst(g, x, t){
  if (g.k === "pred"){
    return pred(g.n, g.args.map(function(a){ return a.n === x ? tm(t) : tm(a.n); }));
  }
  if (g.k === "top" || g.k === "bot") return g;

/* equality up to the names of bound variables */

    return a.args.every(function(t, i){
      var ia = la.indexOf(t.n), ib = lb.indexOf(b.args[i].n);

  if (a.k === "top" || a.k === "bot") return true;
  if (a.k === "not") return eqF(a.a, b.a, la, lb);
  if (a.k === "all" || a.k === "ex")
    return eqF(a.a, b.a, [a.v].concat(la), [b.v].concat(lb));

var BOT = {k:"bot"}, TOP = {k:"top"};

function imp(a, b){ return {k:"imp", a:a, b:b}; }

/* ═════════════════════════════════════════════ parser */
var SYMS = [
  ["<->","iff"], ["<=>","iff"], ["↔","iff"], ["≡","iff"],
  ["->","imp"], ["=>","imp"], ["→","imp"], ["⊃","imp"],
  ["/\\","and"], ["&&","and"], ["∧","and"], ["&","and"], ["^","and"],
  ["\\/","or"], ["||","or"], ["∨","or"], ["|","or"],
  ["¬","not"], ["~","not"], ["!","not"],
  ["⊤","top"], ["⊥","bot"], ["1","top"], ["0","bot"],
  ["∀","all"], ["∃","ex"],
  ["(","lp"], ["[","lp"], [")","rp"], ["]","rp"], [",","comma"], [".","dot"]
];
var WORDS = {forall:"all", all:"all", exists:"ex", some:"ex", "∀":"all", "∃":"ex"};

function tokenize(src){
  var t = [], i = 0;
  outer: while (i < src.length){
    var c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[A-Za-z]/.test(c)){
      /* A capital always starts a predicate, so a lowercase run stops before one:
         that is what lets ∀xP(x) be read without a separator, rather than as a
         variable called xP. */
      var run = /[a-z]/.test(c) ? /[a-z0-9_]/ : /[A-Za-z0-9_]/;
      var j = i + 1;
      while (j < src.length && run.test(src[j])) j++;
      var w = src.slice(i, j);
      if (WORDS[w]) t.push({t:WORDS[w], v:w, i:i});
      else t.push({t:/[A-Z]/.test(w[0]) ? "P" : "x", v:w, i:i});
      i = j; continue;
    }
    for (var k = 0; k < SYMS.length; k++){
      if (src.startsWith(SYMS[k][0], i)){
        t.push({t:SYMS[k][1], v:SYMS[k][0], i:i}); i += SYMS[k][0].length; continue outer;
      }
    }

}
function parse(src){

  function impR(){ var l = or(); if (peek() === "imp"){ p++; return {k:"imp", a:l, b:impR()}; } return l; }
  function or(){ var l = and(); while (peek() === "or"){ p++; l = {k:"or", a:l, b:and()}; } return l; }
  function and(){ var l = un(); while (peek() === "and"){ p++; l = {k:"and", a:l, b:un()}; } return l; }
  function un(){
    if (peek() === "not"){ p++; return {k:"not", a:un()}; }
    if (peek() === "all" || peek() === "ex"){
      var q = t[p++].t;
      var v = eat("x");
      if (!v) throw new Error("A quantifier needs a variable after it — a lowercase name, as in ∀x.");
      eat("dot");
      /* the scope runs as far right as it can, the usual reading */
      return {k:q, v:v.v, a:iff()};
    }
    if (eat("top")) return TOP;
    if (eat("bot")) return BOT;
    if (eat("lp")){ var f = iff(); if (!eat("rp")) throw new Error("A “(” is never closed — add the matching “)”."); return f; }
    var a = eat("P");
    if (a){
      if (!eat("lp")) return pred(a.v, []);
      var args = [];
      do {
        var x = eat("x");
        if (!x) throw new Error("“" + a.v + "” takes terms in its brackets — lowercase names like x or a.");
        args.push(tm(x.v));
      } while (eat("comma"));
      if (!eat("rp")) throw new Error("The brackets after “" + a.v + "” are never closed.");
      return pred(a.v, args);
    }
    if (peek() === "x") throw new Error("“" + t[p].v + "” is a term, not a formula. Predicates start with a " +
      "capital letter, as in P(" + t[p].v + ").");
    if (peek() === "rp") throw new Error("There is a “)” with no “(” to match it.");
    if (peek() === "end") throw new Error("The formula stops early — something is missing after the last connective.");
    throw new Error("Expected a predicate or “(” at position " + (t[p].i + 1) + ", found “" + t[p].v + "”.");
  }
  var f = iff();
  if (peek() !== "end") throw new Error("Unexpected “" + t[p].v + "” at position " + (t[p].i + 1) + " — is a connective missing?");

}
/* every predicate must be used at one arity throughout */
function checkArity(fs){
  var seen = {};

    if (g.k === "pred"){
      if (seen[g.n] === undefined) seen[g.n] = g.args.length;
      else if (seen[g.n] !== g.args.length)
        throw new Error("“" + g.n + "” is used with " + seen[g.n] + " argument" + (seen[g.n] === 1 ? "" : "s") +
          " in one place and " + g.args.length + " in another. A predicate keeps one arity throughout.");
      return;
    }
    if (g.k === "top" || g.k === "bot") return;
    if (g.k === "not" || g.k === "all" || g.k === "ex") return walk(g.a);
    walk(g.a); walk(g.b);

  fs.forEach(walk);

/* "A, B |- C" — premises before the turnstile, or just a formula to prove */
function parseSequent(src){
  var parts = src.split(/⊢|\|-/);
  if (parts.length > 2) throw new Error("Only one ⊢ please — premises on the left, the conclusion on the right.");
  var left = parts.length === 2 ? parts[0] : "", right = parts.length === 2 ? parts[1] : parts[0];
  if (!right.trim()) throw new Error("Nothing to prove — put the conclusion after the ⊢.");
  /* split on commas that are not inside a predicate's brackets */
  function pieces(s){
    var out = [], depth = 0, cur = "";
    for (var i = 0; i < s.length; i++){
      var c = s[i];
      if (c === "(" || c === "[") depth++;
      if (c === ")" || c === "]") depth--;
      if (c === "," && depth === 0){ out.push(cur); cur = ""; continue; }
      cur += c;
    }
    out.push(cur);
    return out.map(function(x){ return x.trim(); }).filter(function(x){ return x.length; });
  }
  var prems = pieces(left).map(parse);
  var concl = parse(right);
  checkArity(prems.concat([concl]));
  return {prems:prems, concl:concl};
}

/* ═════════════════════════════════════════════ small models */
/* Validity is undecidable here, so nothing can confirm a sequent is provable.
   A countermodel in a small domain is still decisive the other way, and that
   is worth having: it is what turns "I cannot find a proof" into "there is
   none". Domains up to MAXDOM elements, every interpretation of every
   predicate tried. */
var MAXDOM = 3;

function holdsIn(g, M, env){
  switch (g.k){
    case "pred": {
      var idx = 0;
      for (var i = 0; i < g.args.length; i++){
        var a = g.args[i];
        idx = idx * M.n + (env[a.n] !== undefined ? env[a.n] : M.c[a.n]);
      }
      return !!M.I[g.n][idx];
    }
    case "top": return true;
    case "bot": return false;
    case "not": return !holdsIn(g.a, M, env);
    case "and": return holdsIn(g.a, M, env) && holdsIn(g.b, M, env);
    case "or":  return holdsIn(g.a, M, env) || holdsIn(g.b, M, env);
    case "imp": return !holdsIn(g.a, M, env) || holdsIn(g.b, M, env);
    case "iff": return holdsIn(g.a, M, env) === holdsIn(g.b, M, env);
    case "all": case "ex": {
      var any = false, all = true;
      for (var d = 0; d < M.n; d++){
        var e2 = {};
        Object.keys(env).forEach(function(k){ e2[k] = env[k]; });
        e2[g.v] = d;
        var r = holdsIn(g.a, M, e2);

      return g.k === "all" ? all : any;
    }

}
/* the predicates and the free names a set of formulas mentions */
function signature(fs){
  var preds = {}, consts = [];
  function walk(g, bound){
    if (g.k === "pred"){
      preds[g.n] = g.args.length;
      g.args.forEach(function(t){
        if (bound.indexOf(t.n) < 0 && consts.indexOf(t.n) < 0) consts.push(t.n);
      });
      return;
    }
    if (g.k === "top" || g.k === "bot") return;
    if (g.k === "not") return walk(g.a, bound);
    if (g.k === "all" || g.k === "ex") return walk(g.a, bound.concat([g.v]));
    walk(g.a, bound); walk(g.b, bound);

    /* how many bits each predicate's table needs, and each constant's value */
    var sizes = pnames.map(function(q){ return Math.pow(n, sig.preds[q]); });
    var bits = sizes.reduce(function(a, b){ return a + b; }, 0);
    if (bits > 20) break;                       /* 2^20 tables is plenty far */
    var tables = 1 << bits, worlds = Math.pow(n, sig.consts.length);
    if (tables * worlds > 400000) break;
    for (var t = 0; t < tables; t++){
      var I = {}, at = 0;
      pnames.forEach(function(q, qi){
        var arr = [];
        for (var b = 0; b < sizes[qi]; b++) arr.push((t >> (at + b)) & 1);
        at += sizes[qi];
        I[q] = arr;
      });
      for (var w = 0; w < worlds; w++){
        var c = {}, rest = w;
        sig.consts.forEach(function(nm){ c[nm] = rest % n; rest = Math.floor(rest / n); });

}
function modelText(M){
  var dom = [];
  for (var i = 0; i < M.n; i++) dom.push(i + 1);
  var bits = ["a domain of " + M.n + " (" + dom.join(", ") + ")"];
  M.consts.forEach(function(nm){ bits.push("<i>" + nm + "</i> = " + (M.c[nm] + 1)); });
  Object.keys(M.preds).forEach(function(q){
    var ar = M.preds[q], holds = [];
    for (var idx = 0; idx < M.I[q].length; idx++){
      if (!M.I[q][idx]) continue;
      if (!ar){ holds.push("true"); continue; }
      var tuple = [], rest = idx;
      for (var d = ar - 1; d >= 0; d--){ tuple[d] = (rest % M.n) + 1; rest = Math.floor(rest / M.n); }

    }
    bits.push("<b>" + q + "</b> holds of " + (holds.length ? holds.join(", ") : "nothing"));

/* ═════════════════════════════════════════════ proof nodes */
/* Every node carries the formula standing at that point in the tree.
     rule === null   an open goal, still to be proved
     rule === "Ass"  an assumption leaf, bracketed when it gets discharged
     otherwise       derived from kids by that rule
   Facts live in the same pool as tree nodes but hang loose until grafted:
   they are the forward half of the proof, growing down from the assumptions
   while the goals grow up from the conclusion. */
function newProof(){ return {nodes:{}, next:1, root:null, nextLab:1, claims:[], frags:[], params:[]}; }

/* Which undischarged assumptions a finished fragment leans on. A fragment can
   only be joined to a goal that has all of them in scope — that is the whole
   bookkeeping behind "joinable where". Premises carry no label and are free. */
function depsOf(P, id, out, disch){
  out = out || []; disch = disch || [];
  var n = P.nodes[id];
  if (n.rule === "Ass"){
    if (n.lab !== null && disch.indexOf(n.lab) < 0 && out.indexOf(n.lab) < 0) out.push(n.lab);
    return out;
  }
  /* a rule inside the fragment may have discharged the very assumption a leaf
     below it rests on — that one is paid off and is not a dependency.
     ∨E is the awkward one: its two labels belong to the two case branches,
     not to the derivation of the disjunction itself. */
  if (n.rule === "∨E" && n.kids.length === 3){
    depsOf(P, n.kids[0], out, disch);
    depsOf(P, n.kids[1], out, disch.concat(n.disch != null ? [n.disch] : []));
    depsOf(P, n.kids[2], out, disch.concat(n.disch2 != null ? [n.disch2] : []));
    return out;
  }

  if (n.disch != null) d = d.concat([n.disch]);
  if (n.disch2 != null) d = d.concat([n.disch2]);

function joinable(P, fid, g){
  if (!g || g.rule !== null) return false;
  if (!eqF(P.nodes[fid].f, g.f)) return false;

}
function inScopeOf(P, fid, g){
  if (!g) return false;
  return depsOf(P, fid).every(function(l){ return g.scope.indexOf(l) >= 0; });
}
/* Same walk as depsOf, but keeping the formulas: the eigenvariable conditions

function openAss(P, id, out, disch){
  out = out || []; disch = disch || [];
  var n = P.nodes[id];
  if (n.rule === "Ass"){
    if (n.lab !== null && disch.indexOf(n.lab) < 0) out.push({lab:n.lab, f:n.f});
    return out;
  }
  if (n.rule === "∨E" && n.kids.length === 3){
    openAss(P, n.kids[0], out, disch);
    openAss(P, n.kids[1], out, disch.concat(n.disch != null ? [n.disch] : []));

  }

  if (n.disch != null) d = d.concat([n.disch]);
  if (n.disch2 != null) d = d.concat([n.disch2]);

/* Every name the proof has met: the sequent's, plus the parameters ∀I and ∃E
   have introduced, plus anything ∀E has instantiated at. A new parameter has
   to avoid all of them — that single precaution is what makes the
   eigenvariable conditions hold, because everything already in scope where a
   parameter is born was written down before it existed, and so cannot mention
   it. done() audits the finished tree rather than taking that on trust. */
function scanNames(how){
  var P = S.P, out = S.vars.slice();
  if (!P) return out;
  P.params.forEach(function(p){ if (out.indexOf(p) < 0) out.push(p); });
  Object.keys(P.nodes).forEach(function(k){
    var n = P.nodes[k];
    how(n.f, out);
    (n.ctx || []).forEach(function(e){ how(e.f, out); });
  });

}
/* the names that can stand as a term: free ones, never a bound variable */
function knownNames(){ return scanNames(function(g, out){ freeIn(g, out); }); }
/* a new parameter dodges bound names too — legal either way, but ∃a2R(a,a2)
   is easier to read than watching a binder get renamed under you */
function freshParam(){ return fresh(scanNames(namesIn), "a"); }

/* ∃I forwards: the goal ∃x A says what to abstract, so the witness can be
   looked for rather than asked about. Only finitely many names are in play. */
function witnessFor(g, f){
  var cand = knownNames();
  if (!cand.length) cand = ["a"];
  for (var i = 0; i < cand.length; i++)
    if (eqF(subst(g.a, g.v, cand[i]), f)) return cand[i];
  return null;
}

/* a claim that has just been finished stops being a goal and becomes a fact */
function promoteClaims(){
  var P = S.P;
  P.claims = P.claims.filter(function(id){
    if (!P.nodes[id]) return false;
    if (openGoals(P, id).length) return true;
    P.frags.push(id);
    return false;
  });
}

function mk(P, f, rule, kids){
  var id = P.next++;
  P.nodes[id] = {id:id, f:f, rule:rule || null, kids:kids || [], lab:null, disch:null,
                 ctx:null, facts:null};
  return id;
}
function openGoals(P, id, out){
  out = out || [];
  var n = P.nodes[id];
  if (n.rule === null){ out.push(id); return out; }
  n.kids.forEach(function(k){ openGoals(P, k, out); });
  return out;
}
function usesRule(P, id, code){
  var n = P.nodes[id];
  if (n.rule === code) return true;
  return n.kids.some(function(k){ return usesRule(P, k, code); });
}
function countRules(P, id){
  var n = P.nodes[id];
  return (n.rule && n.rule !== "Ass" ? 1 : 0) +
         n.kids.reduce(function(a, k){ return a + countRules(P, k); }, 0);

/* ═════════════════════════════════════════════ the rules */
/* Natural deduction runs in two directions at once, and most rules can go
   either way. Eliminations only ever run forward, out of what you already
   have. Introductions mostly run either way: A and B give A ∧ B going down,
   and a goal A ∧ B splits into A and B going up. The three that discharge an
   assumption — ⊃I, ¬I, RAA — can only run backward, because the assumption
   has to be opened before anything can be derived under it.

   Which direction fires is decided by the selection: facts picked out in the
   Derived means forward, nothing picked means backward on the goal. */
function and_(a, b){ return {k:"and", a:a, b:b}; }
function iff_(a, b){ return {k:"iff", a:a, b:b}; }

var RULES = [

   fwd:{n:2, out:function(a, b){ return and_(a, b); },
        roles:function(a, b, goal){
          /* either order builds a conjunction; if one of them is the goal, build that one */
          if (goal && goal.k === "and" && eqF(goal.a, b) && eqF(goal.b, a)) return [1, 0];

  {code:"∧E₁", lbl:"∧E<sub>1</sub>", law:"from A ∧ B take A",

   law:"A gives A ∨ B for any B — or, on a goal A ∨ B, prove the left half A",
   back:function(g){ return g.k === "or" ? [{f:g.a}] : null; },
   fwd:{n:1, asks:"right", roles:function(){ return [0]; },

   law:"B gives A ∨ B for any A — or, on a goal A ∨ B, prove the right half B",

  {code:"¬I", lbl:"¬I", law:"to prove ¬A, assume A and derive ⊥",

   fwd:{n:2, out:function(){ return BOT; },
        roles:function(a, b){

  {code:"≡I", lbl:"≡I",

   fwd:{n:2, out:function(a){ return iff_(a.a, a.b); },
        roles:function(a, b, goal){
          if (!(a.k === "imp" && b.k === "imp" && eqF(a.a, b.b) && eqF(a.b, b.a))) return null;

          return [0, 1];
        }}},

  {code:"≡E₁", lbl:"≡E<sub>1</sub>", law:"from A ≡ B take A ⊃ B",
   fwd:{n:1, ok:function(a){ return a.k === "iff"; }, out:function(a){ return imp(a.a, a.b); }}},

  {code:"≡E₂", lbl:"≡E<sub>2</sub>", law:"from A ≡ B take B ⊃ A",
   fwd:{n:1, ok:function(a){ return a.k === "iff"; }, out:function(a){ return imp(a.b, a.a); }}},

  {code:"∀I", lbl:"∀I",
   law:"to prove ∀x A, prove A of a fresh parameter that nothing else constrains",
   back:function(g){
     if (g.k !== "all") return null;
     var p = freshParam();
     return [{f:subst(g.a, g.v, p), param:p}];
   }},

  {code:"∀E", lbl:"∀E", law:"from ∀x A take A with any term you like put for x",
   fwd:{n:1, ok:function(a){ return a.k === "all"; }, asksTerm:true,
        out:function(a, b, goal, t){ return subst(a.a, a.v, t); }}},

  {code:"∃I", lbl:"∃I",
   law:"A about a witness gives ∃x A — or, on a goal ∃x A, name the witness",
   back:function(g){ return g.k === "ex" ? [{f:g.a}] : null; },
   term:true,
   fwd:{n:1, asksExists:true, roles:function(){ return [0]; },
        out:function(a, b, goal, g){ return g; }}},

  {code:"∃E", lbl:"∃E",
   law:"from ∃x A, give the thing a name and prove the goal from A about that name",
   fwd:{n:1, splits:"ex", ok:function(a){ return a.k === "ex"; }, out:function(a){ return a; }}},

  {code:"⊥E", lbl:"⊥E",
   law:"⊥ gives anything — forward onto the goal, or backward to make ⊥ the new goal",
   back:function(g){ return g.k === "bot" ? null : [{f:BOT}]; },
   fwd:{n:1, ok:function(a){ return a.k === "bot"; },
        out:function(a, b, goal){ return goal; }}},

  {code:"⊤I", lbl:"⊤I", law:"⊤ holds outright",
   back:function(g){ return g.k === "top" ? [] : null; }},

  {code:"RAA", lbl:"RAA", law:"to prove A, assume ¬A and derive ⊥ — the classical rule",
   back:function(g){ return [{f:BOT, assume:neg(g)}]; }}
];
function ruleOf(code){ return RULES.filter(function(r){ return r.code === code; })[0]; }

/* Null when the rule does not fit the chosen premises; otherwise the order the
   rule wants them in. Clicking the same two facts the other way round must
   arm exactly the same rules, so arming and applying both go through here. */
function fwdRoles(r, fs, goal){
  if (!r.fwd || r.fwd.n !== fs.length) return null;
  if (r.fwd.roles) return r.fwd.roles(fs[0], fs[1], goal);
  return r.fwd.ok(fs[0], fs[1]) ? (r.fwd.n === 2 ? [0, 1] : [0]) : null;
}
/* Same question, but for a concrete selection at a concrete goal, so it also
   answers the scope condition ∨E needs. Arming asks this, and so does
   applying — a rule must never light up and then refuse. */
function fwdReady(r, ids, g){
  if (!S.P || !g) return null;
  var P = S.P;
  /* Every premise must be in scope here. Combining a tree from another branch
     would only ever make a bigger tree that is still out of scope — and since
     a rule consumes what it is applied to, it would destroy something that is
     perfectly usable back where it came from. */
  if (!ids.every(function(i){ return inScopeOf(P, i, g); })) return null;
  return fwdRoles(r, ids.map(function(i){ return P.nodes[i].f; }), g.f);
}

/* why a tree cannot be touched from where the student is standing */
function outOfScopeMsg(fid, g){
  var P = S.P, d = depsOf(P, fid);
  return "That tree rests on " + plural(d.length, "assumption") + " (" + d.join(", ") +
    ") made in another branch, and nothing here discharges " + (d.length === 1 ? "it" : "them") +
    ". An assumption is only available under the rule that opened it" +
    (eqF(P.nodes[fid].f, g.f) ? ", so even though it proves " + fh(g.f) + " it cannot close this goal" : "") +
    " — write down what <i>this</i> branch assumes instead.";
}

/* ═════════════════════════════════════════════ state */
var MAXVARS = 8;
var S = {seq:null, vars:[], P:null, sel:null, pick:[], undo:[], phase:"empty"};

var $ = function(s){ return document.querySelector(s); };
var fh = function(f){ return '<span class="f">' + fmtHTML(f) + "</span>"; };
var plural = function(n, w){ return n + " " + w + (n === 1 ? "" : "s"); };

function say(tone, html){
  var el = $("#status");
  el.className = "status " + (tone || "");
  el.querySelector(".msg").innerHTML = html;
}
function snapshot(){
  S.undo.push(JSON.stringify({P:S.P, sel:S.sel}));
  if (S.undo.length > 80) S.undo.shift();
}
function goalNode(){ return S.sel !== null && S.P ? S.P.nodes[S.sel] : null; }

/* ═════════════════════════════════════════════ building */
function build(src){
  var seq;
  try { seq = parseSequent(src); }
  catch (e){ if (LOG_READY) logFormula({f:src, err:"parse"}); say("err", e.message); return; }

  var vars = [], all = [];
  seq.prems.concat([seq.concl]).forEach(function(f){ freeIn(f, vars); namesIn(f, all); });
  if (all.length > MAXVARS){
    if (LOG_READY) logFormula({f:src, err:"too-many-vars"});
    say("err", "That sequent uses " + plural(all.length, "name") + ", more than this page checks. Try " +
        MAXVARS + " or fewer.");
    return;
  }
  if (LOG_READY) logFormula({f:src});

  S.seq = seq;
  S.vars = vars;
  S.P = newProof();
  var root = mk(S.P, seq.concl, null, []);
  S.P.root = root;
  S.P.nodes[root].ctx = seq.prems.map(function(f){ return {f:f, lab:null}; });
  S.P.nodes[root].scope = [];
  S.P.frags = [];
  S.sel = root; S.pick = []; S.undo = []; S.phase = "work";
  hideAsk(); hideOut();

  /* No validity pre-check here: first-order validity is undecidable, so the
     most that can be said is that no small model refutes it. */
  var cm = smallCountermodel(seq.prems, seq.concl);
  if (cm){
    say("err", "That sequent is <b>not valid</b> — " + modelText(cm) + " makes every premise true and " +
        fh(seq.concl) + " false, so no proof exists. Check the formula before proving it.");
  } else {
    say("", "Work <b>down</b> from the facts with the elimination rules and <b>up</b> from the goal with the " +
        "introduction rules; join a derived tree to a goal when they match. Unlike the propositional page " +
        "this one cannot tell you in advance whether a sequent is provable — first-order validity is " +
        "undecidable, so the best it does is look for a countermodel in a small domain.");
  }
  draw();
}

/* ═════════════════════════════════════════════ applying a rule */
function applyRule(code){
  if (!guard()) return;
  var r = ruleOf(code), n = goalNode();
  if (!n){ say("", "Click an open goal in the tree first."); return; }
  if (S.pick.length) forward(r, n); else backward(r, n);
}

/* ── forward: down from facts you already have ── */
function forward(r, n){
  var P = S.P;
  if (!r.fwd){
    say("err", "<b>" + r.code + "</b> only runs backwards, on the goal — " + r.law +
        ". Clear the selection with Escape and try it on the goal.");
    return;
  }
  if (S.pick.length !== r.fwd.n){
    say("err", "<b>" + r.code + "</b> takes " + plural(r.fwd.n, "tree") + " going forwards — " +
        r.law + ". You have " + S.pick.length + " selected under Derived.");
    return;
  }
  var stray = S.pick.filter(function(i){ return !inScopeOf(P, i, n); });
  if (stray.length){ say("err", outOfScopeMsg(stray[0], n)); return; }
  var fs = S.pick.map(function(i){ return P.nodes[i].f; });
  var ord = fwdRoles(r, fs, n.f);
  if (!ord){ say("err", whyNot(r, fs)); return; }
  var pk = ord.map(function(i){ return S.pick[i]; });
  fs = ord.map(function(i){ return fs[i]; });
  if (r.fwd.asks){ askDisjunct(r, n, pk[0]); return; }
  if (r.fwd.asksTerm){ askInstance(r, n, pk[0]); return; }
  if (r.fwd.asksExists){ askExists(r, n, pk[0]); return; }
  snapshot();
  if (r.fwd.splits === "ex"){ splitOnExists(n, pk[0]); return; }
  if (r.fwd.splits){ splitOnDisjunction(n, pk[0]); return; }

  var got = r.fwd.out(fs[0], fs[1], n.f);
  var used = pk;
  var id = mk(P, got, r.code, used);
  P.frags = P.frags.filter(function(x){ return used.indexOf(x) < 0; }).concat([id]);
  S.pick = [];
  say("ok", "<b>" + r.code + "</b> — " + r.law + ". Those trees grew into one, rooted at " + fh(got) + "." +
      (joinable(P, id, n) ? " That matches the goal — click it to join them."
       : eqF(got, n.f) ? " It matches the goal, but leans on an assumption not in scope there."
       : "") );
  draw();
}

/* ── backward: up from the goal ── */
function backward(r, n){
  var P = S.P;
  if (!r.back){
    say("err", "<b>" + r.code + "</b> only runs forwards, out of what you already have — " + r.law +
        ". Click " + (r.fwd.n === 1 ? "a tree" : plural(r.fwd.n, "tree")) +
        " under <b>Derived</b> to select " + (r.fwd.n === 1 ? "it" : "them") + " first" +
        (S.P.frags.length ? "" : " — there is nothing there yet, so write an assumption down") + ".");
    return;
  }
  var subs = r.back(n.f);
  if (!subs){
    say("err", "<b>" + r.code + "</b> cannot be what proves " + fh(n.f) + " — " + r.law + ".");
    return;
  }
  if (r.term){ askWitness(r, n); return; }
  snapshot();
  var kids = [];
  subs.forEach(function(sub){
    var id = mk(P, sub.f, null, []);
    var kid = P.nodes[id];
    kid.ctx = n.ctx.slice();
    kid.scope = n.scope.slice();
    if (sub.assume){
      var lab = P.nextLab++;
      kid.ctx = kid.ctx.concat([{f:sub.assume, lab:lab}]);
      kid.scope = kid.scope.concat([lab]);
      n.disch = lab;
    }
    if (sub.param){ n.par = sub.param; P.params.push(sub.param); }
    kids.push(id);
  });
  n.rule = r.code; n.kids = kids; n.ctx = null; n.scope = null;
  S.pick = [];
  S.sel = firstOpenIn(kids) || firstOpen();

  var msg = "<b>" + r.code + "</b> — " + r.law + ".";
  if (n.par && r.code === "∀I"){
    msg += " <i>" + n.par + "</i> is a brand-new name, so nothing in scope here says anything about it — " +
           "prove it of <i>" + n.par + "</i> and it holds of everything.";
  }
  if (subs.length && subs[0].assume){
    msg += " " + fh(subs[0].assume) + " is assumed as " + n.disch +
           ", and this same " + r.code + " discharges it again.";
  }
  say("ok", msg + remaining());
  draw();
}

function whyNot(r, fs){
  var a = fs[0], b = fs[1];
  if (r.code === "⊃E"){
    if (a.k !== "imp" && b.k !== "imp") return "<b>⊃E</b> needs an implication. Neither " + fh(a) +
      " nor " + fh(b) + " is one.";
    var im = a.k === "imp" ? a : b, mi = a.k === "imp" ? b : a;
    return "⊃E would need " + fh(mi) + " to be exactly the antecedent of " + fh(im) + ", which is " +
      fh(im.a) + ".";
  }
  if (r.code === "¬E"){
    if (a.k !== "not" && b.k !== "not") return "<b>¬E</b> needs a negation. Neither " + fh(a) +
      " nor " + fh(b) + " is one.";
    var ng = a.k === "not" ? a : b, ot = a.k === "not" ? b : a;
    return "¬E would need " + fh(ot) + " to be exactly " + fh(ng.a) + ", the formula " + fh(ng) +
      " denies.";
  }
  if (r.code === "∃I"){
    var gl = goalNode();
    if (!gl || gl.f.k !== "ex") return "<b>∃I</b> forwards needs the goal to be an existential — it is " +
      "the goal that says which part of " + fh(a) + " to hide behind a quantifier. Select the goal " +
      "first, or run ∃I backwards on it.";
    return "∃I would need " + fh(a) + " to be " + fh(gl.f.a) + " with some one name put for <i>" +
      gl.f.v + "</i>, and no name makes those match.";
  }
  if (r.code === "≡I") return "≡I going forwards needs <i>A ⊃ B</i> and <i>B ⊃ A</i>. " +
    fh(a) + " and " + fh(b) + " are not a matching pair.";
  return "<b>" + r.code + "</b> does not apply to " + fh(a) + " — " + r.law + ".";
}

/* ── ∨E: the goal has to be proved twice over, once from each disjunct ── */
function splitOnDisjunction(n, factId){
  var P = S.P, d = P.nodes[factId].f;
  var kids = [factId];
  P.frags = P.frags.filter(function(x){ return x !== factId; });
  [d.a, d.b].forEach(function(side){
    var lab = P.nextLab++;
    var id = mk(P, n.f, null, []);
    var kid = P.nodes[id];
    kid.ctx = n.ctx.concat([{f:side, lab:lab}]);
    kid.scope = n.scope.concat([lab]);
    kids.push(id);
  });
  n.rule = "∨E"; n.kids = kids; n.disch = P.nextLab - 2; n.disch2 = P.nextLab - 1;
  n.ctx = null; n.scope = null;
  S.pick = [];
  S.sel = firstOpenIn(kids) || firstOpen();
  say("ok", "<b>∨E</b> — " + fh(d) + " splits the proof: the goal has to follow from " + fh(d.a) +
      " (assumed " + n.disch + ") and again from " + fh(d.b) + " (assumed " + n.disch2 + ")." + remaining());
  draw();
}

/* ── ∃E: name the witness, then the goal must follow without knowing which ── */
function splitOnExists(n, factId){
  var P = S.P, d = P.nodes[factId].f;
  var p = freshParam();
  var lab = P.nextLab++;
  var id = mk(P, n.f, null, []);
  var kid = P.nodes[id];
  kid.ctx = n.ctx.concat([{f:subst(d.a, d.v, p), lab:lab}]);
  kid.scope = n.scope.concat([lab]);
  n.rule = "∃E"; n.kids = [factId, id]; n.disch = lab; n.par = p;
  n.ctx = null; n.scope = null;
  P.params.push(p);
  P.frags = P.frags.filter(function(x){ return x !== factId; });
  S.pick = [];
  S.sel = firstOpenIn([id]) || firstOpen();
  say("ok", "<b>∃E</b> — " + fh(d) + " says something exists; call it <i>" + p + "</i>. " +
      fh(P.nodes[id].ctx[P.nodes[id].ctx.length - 1].f) + " is assumed as " + lab +
      ", and the goal has to follow from that alone — <i>" + p + "</i> is a name, not a description, " +
      "so the proof cannot lean on which thing it is." + remaining());
  draw();
}

/* ═════════════════════════════════════════════ claims */
/* Some minor premises are not lying around — they have to be derived first.
   A claim is a second goal in the same scope; once proved it joins the facts,
   and that is how the forward half of the proof gets started from nothing. */
/* A small prompt for the one thing the tool cannot work out on its own: a
   formula the rule does not determine. Suggestions come from the goal. */
function askFormula(prompt, sugg, onOk){
  var a = $("#ask");
  a.hidden = false;
  a.innerHTML = "<p>" + prompt + "</p><div class=\"row\">" +
    sugg.map(function(f, i){
      return '<button type="button" class="sug" data-sug="' + i + '">' + fmtHTML(f) + "</button>";
    }).join("") +
    '<input type="text" id="askF" spellcheck="false" autocomplete="off" placeholder="a formula">' +
    '<button type="button" class="sug" id="askGo">OK</button>' +
    '<button type="button" class="cancel" id="askX">cancel</button></div>';
  function take(f){
    var vars = [], ok = knownNames();
    freeIn(f, vars);
    if (vars.some(function(v){ return ok.indexOf(v) < 0; })){
      say("err", "That brings in a name the proof has never met. It can use " +
          ok.map(function(v){ return "<i>" + v + "</i>"; }).join(", ") +
          " — the sequent's names, and the parameters ∀I and ∃E have introduced.");
      return;
    }
    hideAsk();
    onOk(f);
  }
  sugg.forEach(function(f, i){
    a.querySelector('[data-sug="' + i + '"]').addEventListener("click", function(){ take(f); });
  });
  function typed(){
    var f;
    try { f = parse($("#askF").value); }
    catch (e){ say("err", e.message); return; }
    take(f);
  }
  $("#askGo").addEventListener("click", typed);
  $("#askX").addEventListener("click", function(){ hideAsk(); draw(); });
  $("#askF").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); typed(); } });
  $("#askF").focus();
}

/* The other prompt: a term rather than a formula. ∀E and ∃I both hinge on one
   choice the rule does not make for you. */
function askTerm(prompt, sugg, onOk){
  var a = $("#ask");
  a.hidden = false;
  a.innerHTML = "<p>" + prompt + "</p><div class=\"row\">" +
    sugg.map(function(t, i){
      return '<button type="button" class="sug" data-sug="' + i + '"><i>' + t + "</i></button>";
    }).join("") +
    '<input type="text" id="askF" spellcheck="false" autocomplete="off" placeholder="a term">' +
    '<button type="button" class="sug" id="askGo">OK</button>' +
    '<button type="button" class="cancel" id="askX">cancel</button></div>';
  function take(t){ hideAsk(); onOk(t); }
  sugg.forEach(function(t, i){
    a.querySelector('[data-sug="' + i + '"]').addEventListener("click", function(){ take(t); });
  });
  function typed(){
    var v = $("#askF").value.trim();
    if (!/^[a-z][a-z0-9_]*$/.test(v)){
      say("err", "A term is a lowercase name, like <i>x</i> or <i>a</i> — not a formula.");
      return;
    }
    take(v);
  }
  $("#askGo").addEventListener("click", typed);
  $("#askX").addEventListener("click", function(){ hideAsk(); draw(); });
  $("#askF").addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); typed(); } });
  $("#askF").focus();
}

/* ∃I forwards: unlike backwards, nothing says which part of the fact to hide,
   so the existential is asked for — and then checked to be one the fact really
   is an instance of. */
function askExists(r, n, fid){
  var P = S.P, a = P.nodes[fid].f, sugg = [];
  if (n.f.k === "ex" && witnessFor(n.f, a) !== null) sugg.push(n.f);
  askFormula("<b>∃I</b> hides part of " + fh(a) + " behind an existential. Which one? " +
             fh(a) + " has to be an instance of it" + (sugg.length ? " — the goal is one." : "."),
             sugg,
             function(g){
               if (g.k !== "ex"){
                 say("err", "∃I builds an existential, and " + fh(g) + " is not one.");
                 askExists(r, n, fid); return;
               }
               var w = witnessFor(g, a);
               if (w === null){
                 say("err", fh(a) + " is not " + fh(g.a) + " with a single name put for <i>" + g.v +
                     "</i>, so ∃I cannot take it to " + fh(g) + ".");
                 askExists(r, n, fid); return;
               }
               snapshot();
               var id = mk(P, g, "∃I", [fid]);
               P.nodes[id].par = w;
               P.frags = P.frags.filter(function(y){ return y !== fid; }).concat([id]);
               S.pick = [];
               say("ok", "<b>∃I</b> with witness <i>" + w + "</i> — " + fh(a) + " gives " + fh(g) + "." +
                   (joinable(P, id, n) ? " That matches the goal — click it to join." : ""));
               draw();
             });
}

/* ∀E forward: ∀x A holds of everything, so which instance is wanted? */
function askInstance(r, n, fid){
  var P = S.P, a = P.nodes[fid].f, sugg = knownNames();
  /* if the goal is an instance of it, that is almost certainly the one */
  var want = null;
  sugg.forEach(function(t){ if (want === null && eqF(subst(a.a, a.v, t), n.f)) want = t; });
  if (want) sugg = [want].concat(sugg.filter(function(t){ return t !== want; }));
  askTerm("<b>∀E</b> takes " + fh(a) + " down to <span class=\"f\">" +
          fmtHTML(a.a) + "</span> with a term for <i>" + a.v +
          "</i>. Which term?" + (want ? " The goal is the instance at <i>" + want + "</i>." : ""),
          sugg,
          function(t){
            snapshot();
            var got = subst(a.a, a.v, t);
            var id = mk(P, got, "∀E", [fid]);
            P.nodes[id].par = t;
            P.frags = P.frags.filter(function(y){ return y !== fid; }).concat([id]);
            S.pick = [];
            say("ok", "<b>∀E</b> at <i>" + t + "</i> — " + fh(a) + " gives " + fh(got) + "." +
                (joinable(P, id, n) ? " That matches the goal — click it to join." : ""));
            draw();
          });
}

/* ∃I backward: the goal says what to prove, but not of what */
function askWitness(r, n){
  var P = S.P, g = n.f, sugg = knownNames();
  askTerm("<b>∃I</b> proves " + fh(g) + " by proving it of one particular thing. " +
          "Which term should stand in for <i>" + g.v + "</i>?", sugg,
          function(t){
            snapshot();
            var id = mk(P, subst(g.a, g.v, t), null, []);
            P.nodes[id].ctx = n.ctx.slice();
            P.nodes[id].scope = n.scope.slice();
            n.rule = "∃I"; n.kids = [id]; n.par = t; n.ctx = null; n.scope = null;
            S.pick = []; S.sel = id;
            say("ok", "<b>∃I</b> with witness <i>" + t + "</i> — it is enough to prove " +
                fh(P.nodes[id].f) + "." + remaining());
            draw();
          });
}

/* ∨I forward: the other half of the disjunction is the student's to choose */
function askDisjunct(r, n, fid){
  var P = S.P, a = P.nodes[fid].f, side = r.fwd.asks, sugg = [];
  if (n.f.k === "or"){
    if (side === "right" && eqF(n.f.a, a)) sugg.push(n.f.b);
    if (side === "left"  && eqF(n.f.b, a)) sugg.push(n.f.a);
  }
  var shape = side === "right" ? fmtHTML(a) + " ∨ ?" : "? ∨ " + fmtHTML(a);
  askFormula("<b>" + r.code + "</b> weakens " + fh(a) + " to <span class=\"f\">" + shape +
             "</span>. Any formula will do — what should the other half be?" +
             (sugg.length ? " The goal wants one in particular." : ""),
             sugg,
             function(x){
               snapshot();
               var got = r.fwd.out(a, null, n.f, x);
               var id = mk(P, got, r.code, [fid]);
               P.frags = P.frags.filter(function(y){ return y !== fid; }).concat([id]);
               S.pick = [];
               say("ok", "<b>" + r.code + "</b> — " + fh(a) + " weakened to " + fh(got) + "." +
                   (joinable(P, id, n) ? " That matches the goal — click it to join." : ""));
               draw();
             });
}

function startClaim(){
  if (!guard()) return;
  if (!goalNode()){ say("", "Click an open goal first — a claim is proved in that goal's scope."); return; }
  askFormula("Derive something first, then use it as a premise. What should it be?", [], addClaim);
}
function addClaim(f){
  snapshot();
  var P = S.P, n = goalNode();
  var id = mk(P, f, null, []);
  P.nodes[id].ctx = n.ctx.slice();
  P.nodes[id].scope = n.scope.slice();
  P.nodes[id].claim = true;
  P.claims.push(id);
  S.sel = id; S.pick = [];
  say("ok", "Claim added — a second goal tree, in the same scope. Prove " + fh(f) +
      " and it joins the derived trees." + remaining());
  draw();
}

/* ═════════════════════════════════════════════ joining the two halves */
function clickFrag(fid){
  if (!guard()) return;
  var P = S.P, n = goalNode();
  if (n && joinable(P, fid, n)){
    snapshot();
    graft(P, n.id, fid);
    P.frags = P.frags.filter(function(x){ return x !== fid; });
    S.pick = [];
    promoteClaims();
    S.sel = firstOpenIn([unitRootOf(n.id)]) || firstOpen();
    say("ok", "Joined — that tree proves " + fh(P.nodes[n.id].f) + ", so the branch is closed." + remaining());
    draw();
    return;
  }
  if (n && !inScopeOf(P, fid, n)){
    say("err", outOfScopeMsg(fid, n));
    draw();
    return;
  }
  var k = S.pick.indexOf(fid);
  if (k >= 0) S.pick.splice(k, 1); else S.pick.push(fid);
  say("", pickMsg());
  draw();
}

/* an assumption in scope can always be written down again as a fresh leaf */
function spawn(ix){
  if (!guard()) return;
  var n = goalNode();
  if (!n) return;
  var P = S.P;
  var e = n.ctx[+ix];
  if (!e) return;
  snapshot();
  var id = mk(P, e.f, "Ass", []);
  P.nodes[id].lab = e.lab;
  P.frags.push(id);
  say("ok", (e.lab === null ? "Premise " : "Assumption ") + fh(e.f) +
      " written down as a new leaf — grow it downward, or join it straight to the goal." );
  draw();
}

/* replace an open goal with a finished derivation of the same formula */
function graft(P, goalId, srcId){
  var g = P.nodes[goalId], s = P.nodes[srcId];
  g.rule = s.rule; g.kids = s.kids; g.lab = s.lab; g.disch = s.disch;
  g.disch2 = s.disch2; g.par = s.par;
  g.ctx = null; g.scope = null;
  delete P.nodes[srcId];
}
/* every goal still open: the main tree first, then any claim left hanging */
function allOpen(){
  var P = S.P, out = openGoals(P, P.root);
  P.claims.forEach(function(id){ if (P.nodes[id]) openGoals(P, id, out); });
  return out.filter(function(v, i, a){ return a.indexOf(v) === i; });
}
function firstOpen(){
  var o = allOpen();
  return o.length ? o[0] : null;
}
/* Keep the selection inside whatever the student is working on. Jumping back
   to the main goal the moment a claim sprouts a subgoal is disorienting. */
function firstOpenIn(ids){
  var P = S.P, out = [];
  ids.forEach(function(r){ if (P.nodes[r]) openGoals(P, r, out); });
  return out.length ? out[0] : null;
}
function inSubtree(root, id){
  if (root === id) return true;
  var n = S.P.nodes[root];
  return !!n && n.kids.some(function(k){ return inSubtree(k, id); });
}
function unitRootOf(id){
  var P = S.P, roots = P.claims.concat([P.root]);
  for (var i = 0; i < roots.length; i++){
    if (P.nodes[roots[i]] && inSubtree(roots[i], id)) return roots[i];
  }
  return P.root;
}
function pendingClaims(){
  var P = S.P;
  return P.claims.filter(function(id){ return P.nodes[id] && openGoals(P, id).length; });
}
function remaining(){
  var o = allOpen();
  return o.length ? " <b>" + plural(o.length, "goal") + "</b> still open."
                  : " <b>No goals left</b> — press Done.";
}
function guard(){
  if (!S.P) return false;
  if (S.phase === "done"){ say("", "This proof is finished. Press Restart, or enter another sequent."); return false; }
  return true;
}
function pickMsg(){
  if (!S.pick.length) return "Nothing selected. Pick a derived tree, then an elimination rule to grow it downward.";
  var P = S.P;
  var names = S.pick.map(function(i){ return fh(P.nodes[i].f); }).join(" and ");
  var g = goalNode();
  var live = RULES.filter(function(r){ return !!fwdReady(r, S.pick, g); })
                  .map(function(r){ return "<b>" + r.code + "</b>"; });
  return "Selected " + names + " — " +
    (live.length ? live.join(", ") + (live.length === 1 ? " applies" : " apply") + "."
                 : "no elimination fits that selection.");
}

/* ═════════════════════════════════════════════ finishing */
function done(){
  if (!S.P) return;
  var P = S.P, o = openGoals(P, P.root), stray = pendingClaims().length;
  if (!o.length && stray){
    S.sel = firstOpen();
    say("err", "The goal is proved, but " + plural(stray, "claim") + " you set up " +
        (stray === 1 ? "is" : "are") + " still unproved. Finish " +
        (stray === 1 ? "it" : "them") + ", or Undo back past the claim.");
    draw();
    return;
  }
  if (o.length){
    S.sel = o[0];
    say("err", "Not finished — " + plural(o.length, "goal") + " still open. The first is " +
        fh(P.nodes[o[0]].f) + "; it is selected now.");
    draw();
    return;
  }
  var bad = eigenTrouble(P, P.root);
  if (bad){
    say("err", "Something is wrong: " + bad + " This is a bug in the tool, not in your reasoning — " +
        "please report it.");
    return;
  }
  var loose = depsOf(P, P.root);
  if (loose.length){
    say("err", "Something is wrong: the finished tree still rests on undischarged " +
        plural(loose.length, "assumption") + " (" + loose.join(", ") + "), so it does not prove the " +
        "stated sequent. This is a bug in the tool, not in your reasoning — please report it.");
    return;
  }
  S.phase = "done";
  var classical = usesRule(P, P.root, "RAA");
  var steps = countRules(P, P.root);
  var h = '<p class="onote"><b>Proof complete.</b> ' + seqText() + " is derived in " +
    plural(steps, "rule application") + ". ";
  var qs = ["∀I", "∀E", "∃I", "∃E"].filter(function(c){ return usesRule(P, P.root, c); });
  if (qs.length) h += "The quantifier rules used are <code>" + qs.join("</code>, <code>") +
    "</code>, and every eigenvariable condition on them checks out. ";
  h += classical
    ? "It uses <code>RAA</code>, so this is a <b>classical</b> proof — the law of excluded middle is doing " +
      "work somewhere. Some sequents need it; if yours does not, try again without RAA and the proof will be " +
      "intuitionistically valid too."
    : "It uses no <code>RAA</code>, so the proof is <b>intuitionistically</b> valid as well as classically — " +
      "everything was built constructively out of the assumptions.";
  h += "</p>";
  $("#out").innerHTML = h;
  $("#out").hidden = false;
  say("ok", "<b>Done.</b> " + plural(steps, "rule") + ", " + (classical ? "classical" : "intuitionistic") + ".");
  draw();
}
/* The side conditions, checked rather than assumed. ∀I is only sound if its
   parameter is genuinely arbitrary — free in nothing the subproof still leans
   on, and not in the conclusion. ∃E is the same demand plus one more: the
   name must not leak into the goal it proves. Freshness should make all of
   this automatic; this is here to notice if it ever does not. */
function eigenTrouble(P, id){
  var n = P.nodes[id], p = n.par;
  if (n.rule === "∀I" && p){
    var leans = openAss(P, n.kids[0]).filter(function(e){ return freeIn(e.f).indexOf(p) >= 0; });
    if (leans.length) return "∀I generalised <i>" + p + "</i>, but assumption " + leans[0].lab +
      " (" + fmtHTML(leans[0].f) + ") is still open and talks about it.";
    if (freeIn(n.f).indexOf(p) >= 0) return "∀I generalised <i>" + p + "</i>, which occurs in its own " +
      "conclusion " + fmtHTML(n.f) + ".";
  }
  if (n.rule === "∃E" && p){
    if (freeIn(n.f).indexOf(p) >= 0) return "∃E named the witness <i>" + p + "</i>, but that name " +
      "occurs in the goal " + fmtHTML(n.f) + " it proved.";
    if (freeIn(P.nodes[n.kids[0]].f).indexOf(p) >= 0) return "∃E named the witness <i>" + p +
      "</i>, but that name already occurs in " + fmtHTML(P.nodes[n.kids[0]].f) + ".";
    var out = openAss(P, n.kids[1]).filter(function(e){
      return e.lab !== n.disch && freeIn(e.f).indexOf(p) >= 0; });
    if (out.length) return "∃E named the witness <i>" + p + "</i>, but assumption " + out[0].lab +
      " (" + fmtHTML(out[0].f) + ") is open and talks about it.";
  }
  for (var i = 0; i < n.kids.length; i++){
    var t = eigenTrouble(P, n.kids[i]);
    if (t) return t;
  }
  return null;
}

function seqText(){
  var l = S.seq.prems.map(function(f){ return fmtHTML(f); }).join('<span class="op">,</span> ');
  return '<span class="f">' + (l ? l + " " : "") + "⊢ " + fmtHTML(S.seq.concl) + "</span>";
}
function hideOut(){ $("#out").hidden = true; $("#out").innerHTML = ""; }
function hideAsk(){ $("#ask").hidden = true; $("#ask").innerHTML = ""; }

function undo(){
  if (!S.undo.length){ say("", "Nothing to undo — you are back at the bare goal."); return; }
  var s = JSON.parse(S.undo.pop());
  S.P = s.P; S.sel = s.sel; S.pick = []; S.phase = "work";
  hideOut();
  say("", "Stepped back one rule.");
  draw();
}

/* ═════════════════════════════════════════════ drawing */
function draw(){
  drawRules();
  drawTree();
  $("#doneBtn").disabled = !S.P;
}

function drawRules(){
  var P = S.P, n = goalNode(), fwd = S.pick.length > 0;
  $("#rules").innerHTML = RULES.map(function(r){
    /* the quantifier rules are the new half of the page: give them their own
       run of buttons rather than burying them in the propositional list */
    var sep = (r.code === "∀I" || r.code === "⊥E") ? '<span class="rsep"></span>' : "";
    var cls = "rule", live;
    if (S.phase === "done") live = false;
    else if (!n) live = null;
    else if (fwd) live = !!fwdReady(r, S.pick, n);
    else live = !!(r.back && r.back(n.f));
    if (live !== null) cls += live ? " armed" : " dim";
    var dir = r.back && r.fwd ? "either direction" : r.fwd ? "forwards only" : "backwards only";
    return sep + '<button type="button" class="' + cls + '" data-rule="' + r.code +
      '" title="' + r.law + " (" + dir + ')">' + r.lbl + "</button>";
  }).join("");
  $("#claimBtn").className = "rule" + (n && S.phase !== "done" ? "" : " dim");
}

function drawTree(){
  var b = $("#board");
  if (!S.P){ b.innerHTML = ""; return; }
  var P = S.P, n = goalNode();

  /* derived trees — the forward half, growing downward */
  var frags = P.frags.filter(function(x){ return P.nodes[x]; });
  var h = '<div class="band"><span class="bl">Derived <i>↓ grows downward</i></span><div class="row">';
  h += frags.length ? frags.map(function(fid){
        var cls = "frag" + (S.pick.indexOf(fid) >= 0 ? " sel" : "") +
                  (joinable(P, fid, n) ? " fits" : "") +
                  (n && !inScopeOf(P, fid, n) ? " out" : "");
        var deps = depsOf(P, fid);
        var tip = joinable(P, fid, n) ? "matches the goal — click to join"
                : (n && !inScopeOf(P, fid, n))
                  ? "leans on assumption " + deps.join(", ") + ", which is not in scope at this goal"
                  : "click to select for an elimination";
        return '<span class="' + cls + '" data-frag="' + fid + '" role="button" tabindex="0" title="' +
               tip + '">' + renderNode(P, fid) + "</span>";
      }).join("")
    : '<span class="none">nothing yet — write an assumption down, or work backwards from the goal</span>';
  h += "</div></div>";

  /* what may be leaned on right here */
  h += '<div class="band scopeband"><span class="bl">In scope <i>click to write one down</i></span><div class="row">';
  if (n && n.ctx.length){
    h += n.ctx.map(function(c, ci){
      return '<button type="button" class="chip" data-spawn="' + ci + '">' + fmtHTML(c.f) +
             (c.lab !== null ? '<sup>' + c.lab + "</sup>" : '<span class="pm">prem</span>') + "</button>";
    }).join("");
  } else {
    h += '<span class="none">' + (n ? "nothing assumed here yet" : "no goal selected") + "</span>";
  }
  h += "</div></div>";

  /* goal trees — the backward half, growing upward */
  h += '<div class="band"><span class="bl">Goals <i>↑ grow upward</i></span><div class="row">';
  h += P.claims.filter(function(id){ return P.nodes[id]; }).map(function(id){
        return '<span class="gtree claim"><span class="gl">claim</span>' + renderNode(P, id) + "</span>";
      }).join("");
  h += '<span class="gtree"><span class="gl">goal</span>' + renderNode(P, P.root) + "</span>";
  h += "</div></div>";
  b.innerHTML = h;
}

function renderNode(P, id){
  var n = P.nodes[id];
  if (n.rule === null){
    var cls = "pn-f goal" + (id === S.sel ? " sel" : "");
    return '<span class="pn"><span class="' + cls + '" data-goal="' + id + '" role="button" tabindex="0" ' +
      'title="open goal">' + '<span class="q">?</span>' + fmtHTML(n.f) + "</span></span>";
  }
  if (n.rule === "Ass"){
    var inner = n.lab !== null
      ? '<span class="brk">[</span>' + fmtHTML(n.f) + '<span class="brk">]</span><sup>' + n.lab + "</sup>"
      : fmtHTML(n.f);
    return '<span class="pn"><span class="pn-f pn-ass">' + inner + "</span></span>";
  }
  var kids = n.kids.map(function(k){ return renderNode(P, k); }).join("");
  var tag = n.rule + (n.par ? " " + n.par : "") +
            (n.disch != null ? "," + n.disch + (n.disch2 != null ? "," + n.disch2 : "") : "");
  return '<span class="pn">' +
    (kids ? '<span class="pn-kids">' + kids + "</span>" : "") +
    '<span class="pn-bar"><span class="pn-rule">' + tag + "</span></span>" +
    '<span class="pn-f">' + fmtHTML(n.f) + "</span></span>";
}

/* ═════════════════════════════════════════════ connective pad */
var caret = null;
function rememberCaret(){
  var el = $("#formula");
  if (el.selectionStart !== null) caret = [el.selectionStart, el.selectionEnd];
}
["input","click","keyup","select","blur"].forEach(function(ev){
  $("#formula").addEventListener(ev, rememberCaret);
});
function insertSym(ch){
  var el = $("#formula"), v = el.value, a, b;
  if (document.activeElement === el && el.selectionStart !== null){ a = el.selectionStart; b = el.selectionEnd; }
  else if (caret){ a = caret[0]; b = caret[1]; }
  if (a === undefined || a === null){ a = b = v.length; }
  el.value = v.slice(0, a) + ch + v.slice(b);
  var pos = a + ch.length;
  caret = [pos, pos];
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e){}
}
$("#pad").addEventListener("mousedown", function(e){
  if (e.target.closest("[data-sym]")) e.preventDefault();
});

/* ═════════════════════════════════════════════ wiring */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-sym],[data-rule],[data-goal],[data-frag],[data-spawn],[data-claim]");
  if (!t) return;
  if (t.hasAttribute("data-sym")){ insertSym(t.dataset.sym); return; }
  if (t.hasAttribute("data-rule")){ applyRule(t.dataset.rule); return; }
  if (t.hasAttribute("data-claim")){ startClaim(); return; }
  if (t.hasAttribute("data-goal")){ selectGoal(+t.dataset.goal); return; }
  if (t.hasAttribute("data-frag")){ clickFrag(+t.dataset.frag); return; }
  if (t.hasAttribute("data-spawn")){ spawn(t.dataset.spawn); return; }
});
function selectGoal(id){
  if (S.phase === "done"){ say("", "This proof is finished. Press Restart to try another route."); return; }
  S.sel = id; S.pick = [];
  var n = S.P.nodes[id];
  var fits = S.P.frags.filter(function(f){ return joinable(S.P, f, n); }).length;
  say("", "Goal " + fh(n.f) + " selected. " +
      (fits ? "<b>" + plural(fits, "derived tree") + "</b> already " + (fits === 1 ? "matches" : "match") +
              " it — click to join."
            : "Nothing derived matches it yet.") + remaining());
  draw();
}

$("#entry").addEventListener("submit", function(e){ e.preventDefault(); build($("#formula").value); });
$("#doneBtn").addEventListener("click", done);
$("#undo").addEventListener("click", undo);
$("#reset").addEventListener("click", function(){
  /* a restart re-runs the sequent already in the box; not a submission */
  var was = LOG_READY; LOG_READY = false;
  build($("#formula").value);
  LOG_READY = was;
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && S.pick.length){ S.pick = []; say("", pickMsg()); draw(); return; }
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});

build($("#formula").value);
LOG_READY = true;

/* ── theme toggle ─────────────────────────────────────── */
function themeNow(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch (e){ return "light"; }
}
function syncTheme(){
  var b = document.getElementById("themeBtn"), next = themeNow() === "dark" ? "light" : "dark";
  b.title = "Switch to the " + next + " theme";
  b.setAttribute("aria-label", b.title);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("logic.theme", next); } catch (e){}
  syncTheme();
});
syncTheme();
</script>
</body>
