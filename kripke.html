<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A Kripke model lab: draw worlds and accessibility arrows, set the valuation, and watch a modal formula light up world by world, with the frame conditions named as you go.">
<title>Kripke Models</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

<style>
:root{
  color-scheme:light dark;
  --bg:#F3F4F8;
  --paper:#FFFFFF;
  --soft:#E7EAF2;
  --ink:#171A26;
  --ink-2:#5D6379;
  --ink-3:#8A91A6;
  --line:#D3D7E4;
  --accent:#2E3FA8;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0E4FB;
  --closed:#1F7A5C;
  --closed-soft:#D8EEE5;
  --open:#A46200;
  --open-soft:#FBEEDA;
  --error:#B3261E;
  --error-soft:#FAE0DE;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --serif:"Newsreader", ui-serif, Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111320; --paper:#191C29; --soft:#232736;
    --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
    --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
    --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
    --error:#F3897D; --error-soft:#3B1D1A;
  }
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111320; --paper:#191C29; --soft:#232736;
  --ink:#E7E9F2; --ink-2:#9BA2B8; --ink-3:#6E768E; --line:#31364A;
  --accent:#8F9BF7; --accent-ink:#141726; --accent-soft:#262C4C;
  --closed:#55C79C; --closed-soft:#173529; --open:#E0A44F; --open-soft:#33270F;
  --error:#F3897D; --error-soft:#3B1D1A;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important; transition-duration:.01ms!important} }

#app{height:100%; display:flex; flex-direction:column; padding-inline:20px; max-width:1500px; margin:0 auto}

/* ── input row ─────────────────────────────────────────── */
.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-block:18px 14px}
.wordmark{font-family:var(--serif); font-size:17px; color:var(--ink-2); white-space:nowrap}
.wordmark span{color:var(--accent)}
.sibling{font-size:12px; color:var(--ink-3); text-decoration:underline; text-underline-offset:3px}
.sibling:hover{color:var(--accent)}
form{display:flex; align-items:center; gap:8px; flex:1; min-width:280px; flex-wrap:wrap}
input[type=text]{
  flex:1; min-width:0; font-family:var(--mono); font-size:15px;
  padding:8px 12px; border-radius:7px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink);
}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.go{
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
  border-radius:7px; padding:8px 16px; font-weight:500;
}
.go:hover{filter:brightness(1.08)}
.link{
  border:0; background:transparent; color:var(--ink-3); padding:6px 4px;
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}
.link:hover{color:var(--ink)}

.pad{display:flex; align-items:center; gap:4px; flex-wrap:wrap; flex-basis:100%}
.pad button{
  font-family:var(--serif); font-size:17px; line-height:1;
  min-width:36px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s;
}
.pad button:hover{background:var(--soft); border-color:var(--ink-3)}
.pad button:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.pad .gap{width:10px}
.padhint{font-size:12px; color:var(--ink-3); margin-left:4px}
.padhint code{font-family:var(--mono); font-size:11.5px}

/* ── rule strips ───────────────────────────────────────── */
.strip{display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap}
.strip.a{padding-block:2px 6px}
.strip.b{padding-block:0 13px; border-bottom:1px solid var(--line)}
.glabel{
  font-family:var(--mono); font-size:10px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap; flex:none; width:5.6em;
}
.group{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.rule{
  font-family:var(--serif); font-size:15px; line-height:1;
  min-width:40px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  transition:background .1s, border-color .1s, opacity .1s;
}
.rule:hover{background:var(--soft); border-color:var(--ink-3)}
.rule.armed{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rule.dim{opacity:.32}
.rule.close{border-color:var(--closed); color:var(--closed)}
.rule.close.armed{background:var(--closed); border-color:var(--closed); color:var(--paper)}
.done{
  border:1px solid var(--closed); background:transparent; color:var(--closed);
  border-radius:7px; padding:6px 16px; font-weight:500; flex:none;
}
.done:hover{background:var(--closed-soft)}
.done:disabled{opacity:.4; cursor:not-allowed}
.done:disabled:hover{background:transparent}

/* ── status ────────────────────────────────────────────── */
.status{
  display:flex; align-items:baseline; gap:10px;
  padding-block:11px; min-height:42px; font-size:13.5px; color:var(--ink-2);
}
.status .msg{flex:1}
.status.ok{color:var(--closed)}
.status.err{color:var(--error)}
.status b{font-weight:500; color:var(--ink)}
.status.ok b,.status.err b{color:inherit; font-weight:600}
.status .acts{display:flex; gap:2px; flex:none}
.f{font-family:var(--serif); font-size:15.5px}
.f i{font-style:italic}
.f .op{margin:0 .26em}
.f .op.neg{margin:0 .04em 0 0}
.f .pr{color:var(--ink-3)}
.f .cst{font-style:normal; color:var(--accent)}

/* ── the board ─────────────────────────────────────────── */
.board{
  flex:1; min-height:0; margin-bottom:18px; display:flex; gap:14px; align-items:stretch;
}
.pane{
  background:var(--paper); border:1px solid var(--line); border-radius:10px;
  display:flex; flex-direction:column; min-height:0;
}
.pane.graph{flex:1.45; min-width:0}
.pane.side{flex:1; min-width:0; overflow:auto; padding:13px 15px}
.pane .ph{
  display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3); padding:12px 15px 0;
}
.pane.side .ph{padding:0 0 9px}
.pane.side .ph + .ph{padding-top:16px}
#svg{flex:1; min-height:0; width:100%; display:block; touch-action:none}
.hint{font-size:12.5px; color:var(--ink-3); font-style:italic; padding:4px 15px 12px}

/* worlds and arrows */
.wbox > rect{fill:var(--paper); stroke:var(--line); stroke-width:1.2}
.wbox:hover > rect{stroke:var(--ink-3)}
.wbox.sel > rect{stroke:var(--accent); stroke-width:2; fill:var(--accent-soft)}
.wbox.yes > rect{stroke:var(--closed); fill:var(--closed-soft)}
.wbox.no > rect{stroke:var(--error); fill:var(--error-soft)}
.wbox g rect{fill:transparent; stroke:none}
.wbox .wn{font-family:var(--mono); font-size:11px; fill:var(--ink-2)}
.wbox.sel .wn{fill:var(--accent)}
.atom{font-family:var(--serif); font-size:14px; cursor:pointer}
.atom.on{fill:var(--ink); font-weight:500}
.atom.off{fill:var(--ink-3); opacity:.45; text-decoration:line-through}
.edge{fill:none; stroke:var(--ink-2); stroke-width:1.3}
.edge.hot{stroke:var(--accent); stroke-width:2}
.edge.ghost{stroke:var(--accent); stroke-dasharray:5 4; stroke-width:1.6}
.hdl{fill:var(--paper); stroke:var(--ink-3); stroke-width:1.4; cursor:crosshair}
.wbox:hover .hdl, .wbox.sel .hdl{fill:var(--accent); stroke:var(--accent)}
.hdlhit{cursor:crosshair}
.wbox{cursor:grab}
.wbox.dragging{cursor:grabbing}
.verd{font-family:var(--mono); font-size:10px; letter-spacing:.06em}
.verd.yes{fill:var(--closed)} .verd.no{fill:var(--error)}

/* side panel */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip2{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
  padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-3);
  white-space:nowrap; cursor:help;
}
.chip2.on{border-color:var(--closed); color:var(--closed); background:var(--closed-soft)}
.agtag{
  font-family:var(--mono); font-size:10px; padding:3px 7px; border-radius:20px;
  border:1px solid currentColor; white-space:nowrap;
}
.agbtn{
  font-family:var(--serif); font-size:15px; min-width:30px; padding:6px 9px; border-radius:6px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
}
.agbtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.edge.ag0{stroke:var(--ink-2)} .edge.ag1{stroke:var(--open)}
.edge.ag2{stroke:var(--closed)} .edge.ag3{stroke:var(--error)}
.agl{font-family:var(--mono); font-size:9.5px; text-anchor:middle}
.agl.ag0{fill:var(--ink-2)} .agl.ag1{fill:var(--open)}
.agl.ag2{fill:var(--closed)} .agl.ag3{fill:var(--error)}
.agtag.ag0{color:var(--ink-2)} .agtag.ag1{color:var(--open)}
.agtag.ag2{color:var(--closed)} .agtag.ag3{color:var(--error)}
.f .md sub{font-size:.62em; font-style:italic}
.f .pop{color:var(--ink-3); margin:0 .04em}
.f .pn2{font-style:italic}
.sub{width:100%; border-collapse:collapse; font-size:13px}
.sub td{padding:3px 6px; border-bottom:1px solid var(--line); vertical-align:baseline}
.sub tr:last-child td{border-bottom:0}
.sub td.v{width:1px; text-align:right; font-family:var(--mono); font-size:11px; white-space:nowrap}
.sub td.v.t{color:var(--closed)} .sub td.v.f{color:var(--error)}
.sub tr.top td{font-weight:500}
.note{font-size:12.5px; color:var(--ink-2); margin:0 0 8px}
.note b{color:var(--ink); font-weight:500}
.none2{font-size:12.5px; color:var(--ink-3); font-style:italic}
.srow{display:flex; gap:6px; align-items:center; margin-top:10px}
.srow input{font-family:var(--mono); font-size:12px; padding:5px 8px; flex:1; min-width:0}

/* ── the ask panel ─────────────────────────────────────── */
.ask{
  border:1px solid var(--accent); background:var(--accent-soft);
  border-radius:9px; padding:11px 13px; margin-bottom:14px;
}
.ask p{margin:0 0 9px; font-size:13px}
.ask .row{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ask input[type=text]{font-size:14px; padding:6px 10px; flex:1; min-width:140px}
.ask .sug{
  font-family:var(--serif); font-size:14.5px; padding:5px 10px; border-radius:6px;
  border:1px solid var(--accent); background:var(--paper); color:var(--ink);
}
.ask .sug:hover{background:var(--accent); color:var(--accent-ink)}
.ask .cancel{border:0; background:transparent; color:var(--ink-3); text-decoration:underline;
             text-underline-offset:3px; font-size:12.5px; padding:5px 2px}

/* ── verdict ───────────────────────────────────────────── */
.out{
  border:1px solid var(--line); background:var(--paper);
  border-radius:9px; padding:13px 15px; margin-bottom:14px;
}
.out .onote{margin:0; font-size:13px; color:var(--ink-2)}
.out .onote + .onote{margin-top:9px; border-top:1px solid var(--line); padding-top:9px}
.out code{font-family:var(--mono); font-size:12px; color:var(--ink)}

@media (max-width:860px){
  /* side by side, the graph gets too narrow to read; stack it instead */
  .board{flex-direction:column; min-height:0}
  .pane.graph{flex:none; height:360px}
  .pane.side{flex:none; max-height:none; overflow:visible}
  #app{height:auto; min-height:100%}
}
@media (max-width:820px){
  #app{height:auto; min-height:100%; padding-inline:16px}
  .board{min-height:420px}
  .wordmark{display:none}
  .glabel{width:auto}
  .pad button{min-width:34px; padding:6px 7px; font-size:16px}
  .padhint{flex-basis:100%; margin:2px 0 0}
}
.theme{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-2);
  border-radius:6px; padding:3px 9px; font-size:14px; line-height:1.35;
  cursor:pointer; flex:none;
}
.theme:hover{border-color:var(--accent); color:var(--accent)}
.f .md{font-family:var(--serif); margin-right:.08em}
.fml .md{margin-right:.08em}
</style>
<script>
/* stamp the saved theme before anything paints, so there is no flash */
(function(){
  try{
    var t = localStorage.getItem("logic.theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
</head>

<body>
<div id="app">
  <div class="top">
    <span class="wordmark"><span>◇</span> KRIPKE</span>
    <a class="sibling" href="index.html">← All solvers</a>
    <button class="theme" id="themeBtn" type="button">◐</button>
    <form id="entry">
      <input type="text" id="formula" spellcheck="false" autocomplete="off"
             aria-label="Modal formula" value="[](<>p | q)">
      <button type="submit" class="go">Evaluate</button>
      <div class="pad" id="pad" role="group" aria-label="Insert a connective">
        <button type="button" data-sym="¬" aria-label="Insert negation" title="negation — also typed as ~ or !">¬</button>
        <button type="button" data-sym="∧" aria-label="Insert conjunction" title="conjunction — also typed as &amp; or /\">∧</button>
        <button type="button" data-sym="∨" aria-label="Insert disjunction" title="disjunction — also typed as | or \/">∨</button>
        <button type="button" data-sym="⊃" aria-label="Insert implication" title="implication — also typed as -&gt;, =&gt; or →">⊃</button>
        <button type="button" data-sym="≡" aria-label="Insert biconditional" title="biconditional — also typed as &lt;-&gt; or ↔">≡</button>
        <span class="gap"></span>
        <button type="button" data-sym="□" aria-label="Insert box" title="necessarily — also typed as []">□</button>
        <button type="button" data-sym="◇" aria-label="Insert diamond" title="possibly — also typed as &lt;&gt;">◇</button>
        <span class="gap"></span>
        <button type="button" data-sym="K_a " aria-label="Insert knows" title="K_a — agent a knows">K<sub>a</sub></button>
        <button type="button" data-sym="E " aria-label="Insert everyone knows" title="E — everyone knows">E</button>
        <button type="button" data-sym="D " aria-label="Insert distributed knowledge" title="D — distributed knowledge, pooled between the agents">D</button>
        <button type="button" data-sym="C " aria-label="Insert common knowledge" title="C — common knowledge, true along every chain of arrows">C</button>
        <span class="gap"></span>
        <button type="button" data-sym="[a]" aria-label="Insert a program box" title="[α]A — after every run of the program α, A">[α]</button>
        <button type="button" data-sym="&lt;a&gt;" aria-label="Insert a program diamond" title="⟨α⟩A — after some run of α, A">⟨α⟩</button>
        <button type="button" data-sym=";" aria-label="Insert sequencing" title="α;β — first α, then β">;</button>
        <button type="button" data-sym="∪" aria-label="Insert choice" title="α∪β — either one; also typed as +">∪</button>
        <button type="button" data-sym="*" aria-label="Insert iteration" title="α* — α any number of times, including none">*</button>
        <button type="button" data-sym="?" aria-label="Insert a test" title="A? — go nowhere, but only where A holds">?</button>
        <button type="button" data-sym="(" aria-label="Insert opening bracket">(</button>
        <button type="button" data-sym=")" aria-label="Insert closing bracket">)</button>
        <span class="padhint"><code>[]</code> is □, <code>&lt;&gt;</code> is ◇, <code>K_a</code> is agent <i>a</i>’s knowledge, <code>[a;p?;b]</code> is a program. Every modality binds tighter than ∧ ∨ ⊃ ≡</span>
      </div>
    </form>
  </div>

  <div class="strip b">
    <span class="glabel" title="One relation each. They are the agents of K_a and the actions of [a] alike">Agents</span>
    <div class="group" id="agents"></div>
    <span class="glabel">Structure</span>
    <div class="group">
      <button type="button" class="rule" data-act="add" title="Add a world to the structure">+ world</button>
      <button type="button" class="rule" data-act="del" title="Remove the selected world">− world</button>
      <button type="button" class="rule" data-act="noedge" title="Remove every arrow">no arrows</button>
      <button type="button" class="rule" data-act="refl" title="Add an arrow from every world to itself">+ loops</button>
      <button type="button" class="rule" data-act="close4" title="Add whatever arrows transitivity demands">make transitive</button>
      <button type="button" class="rule" data-act="closeB" title="Add whatever arrows symmetry demands">make symmetric</button>
      <button type="button" class="rule" data-act="tidy" title="Put the worlds back on a circle">tidy</button>
    </div>
    <span class="glabel">Ask</span>
    <div class="group">
      <button type="button" class="rule" data-act="findval" title="Search the valuations for one that makes the formula true at the selected world">find a valuation…</button>
      <button type="button" class="rule" data-act="frame" title="Is the formula true at every world under every valuation of this frame?">valid on this frame?</button>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    <span class="msg"></span>
    <span class="acts">
      <button class="link" id="undo">Undo</button>
      <button class="link" id="reset">Restart</button>
    </span>
  </div>

  <div class="out" id="out" hidden></div>

  <div class="board">
    <div class="pane graph">
      <span class="ph">The structure <i id="mdesc"></i></span>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <span class="hint" id="ghint"></span>
    </div>
    <div class="pane side" id="side"></div>
  </div>
</div>

<script>
"use strict";

/* ═════════════════════════════════════════════ logging */
/* One line per formula submitted: someone types a formula, presses the button,
   and that is recorded. Nothing else is — no rule steps, no verdicts, no page
   views. Posts to the host that served this page, same origin; a failure is
   swallowed, so logging can never break the tool. LOG_URL = "" switches it off. */
var LOG_URL = "log.php";
var LOG_PAGE = "kripke";
var LOG_READY = false;      /* the formula a page loads with is not a submission */

function logFormula(data){
  if (!LOG_URL) return;
  try {
    var ev = {t:new Date().toISOString(), p:LOG_PAGE};
    Object.keys(data).forEach(function(k){
      var v = data[k];
      ev[k] = (typeof v === "string" && v.length > 300) ? v.slice(0, 300) : v;
    });
    var body = JSON.stringify([ev]);
    if (navigator.sendBeacon &&
        navigator.sendBeacon(LOG_URL, new Blob([body], {type:"application/json"}))) return;
    fetch(LOG_URL, {method:"POST", body:body, keepalive:true,
                    headers:{"Content-Type":"application/json"}}).catch(function(){});
  } catch (e){}
}

/* ═════════════════════════════════════════════ formulas */
/* Propositional, plus the modalities. One accessibility relation per agent,
   so □ and ◇ are the single-agent reading of K and its dual, and the
   multi-agent operators of lecture 13 sit beside them:
     K_a A   agent a knows A        — along a's own arrows
     E A     everyone knows A       — along the union of them
     D A     distributed knowledge  — along the intersection
     C A     common knowledge       — along any non-empty chain of arrows
   □ and ◇ bind as tightly as ¬, and so do K, E, C and D. */
var OPCH = {and:"∧", or:"∨", imp:"⊃", iff:"≡"};
var MDCH = {box:"□", dia:"◇"};
var MODAL = {box:1, dia:1, ka:1, e:1, c:1, d:1};

function show(g, esc, wrap, neg, opw, cst, mod){
  cst = cst || function(t){ return t; };
  mod = mod || function(m){ return m; };
  function needs(c, pk, left){
    if (c.k === "atom" || c.k === "not" || c.k === "top" || c.k === "bot" || MODAL[c.k]) return false;
    if (pk === "not" || MODAL[pk]) return true;
    if ((pk === "and" || pk === "or") && c.k === pk && left) return false;
    return true;
  }
  function go(h, pk, left){ var s = body(h); return needs(h, pk, left) ? wrap(s) : s; }
  function body(h){
    if (h.k === "atom") return esc(h.n);
    if (h.k === "top") return cst("⊤");
    if (h.k === "bot") return cst("⊥");
    if (h.k === "not") return neg() + go(h.a, "not", false);
    if (h.k === "box" || h.k === "dia"){
      if (h.pr) return mod(h.k === "box" ? "[" : "⟨", null, h.pr) + go(h.a, h.k, false);
      return mod(MDCH[h.k]) + go(h.a, h.k, false);

    if (h.k === "ka") return mod("K", h.ag) + go(h.a, h.k, false);
    if (h.k === "e" || h.k === "c" || h.k === "d")
      return mod(h.k.toUpperCase()) + go(h.a, h.k, false);
    return go(h.a, h.k, true) + opw(OPCH[h.k]) + go(h.b, h.k, false);

function fmtHTML(g){

    function(n){ return "<i>" + n + "</i>"; },
    function(s){ return '<span class="pr">(</span>' + s + '<span class="pr">)</span>'; },
    function(){ return '<span class="op neg">¬</span>'; },
    function(o){ return '<span class="op">' + o + "</span>"; },
    function(t){ return '<span class="cst">' + t + "</span>"; },
    function(m, ag, pr){
      if (pr) return '<span class="md">' + m + "</span>" + progHTML(pr) +

/* ── programs ── */
/* A program is a regular expression over the relations, and its meaning is
   just a relation built from them: ; composes, + unions, * takes the
   reflexive-transitive closure, and A? is the identity cut down to the worlds
   where A holds. Everything here is matrix work on the structure already
   drawn. */
function progText(pr){ return progShow(pr, function(f){ return fmtText(f); }, false); }

function progShow(pr, fml, html){
  var op = html ? function(c){ return '<span class="pop">' + c + "</span>"; }
                : function(c){ return c; };
  var nm = html ? function(n){ return '<span class="pn2">' + n + "</span>"; }
                : function(n){ return n; };
  function go(x, lvl){
    var s, need;
    if (x.p === "atom"){ return nm(x.n); }
    if (x.p === "test"){ return fml(x.f) + op("?"); }
    if (x.p === "star"){ return go(x.a, 3) + op("*"); }
    if (x.p === "seq"){ s = go(x.a, 2) + op(";") + go(x.b, 2); need = lvl > 2; }
    else { s = go(x.a, 1) + op("∪") + go(x.b, 1); need = lvl > 1; }
    return need ? op("(") + s + op(")") : s;

}
function progAtoms(pr, out){
  out = out || [];
  if (pr.p === "atom"){ if (out.indexOf(pr.n) < 0) out.push(pr.n); return out; }
  if (pr.p === "test") return out;
  if (pr.p === "star") return progAtoms(pr.a, out);
  progAtoms(pr.a, out); progAtoms(pr.b, out);

}

  out = out || [];
  if (pr.p === "test"){ out.push(pr.f); return out; }
  if (pr.p === "atom") return out;
  if (pr.p === "star") return progTests(pr.a, out);
  progTests(pr.a, out); progTests(pr.b, out);

}

  if (a.p === "atom") return a.n === b.n;
  if (a.p === "test") return eqF(a.f, b.f);
  if (a.p === "star") return eqProg(a.a, b.a);

  var R = blank(n);

    if (!A[i][k]) continue;

  for (var i = 0; i < n; i++) R[i][i] = true;          /* reflexive, then transitive */
  for (var k = 0; k < n; k++) for (var i = 0; i < n; i++) for (var j = 0; j < n; j++)

    var R = blank(M.n);
    for (var w = 0; w < M.n; w++) if (holdsAt(pr.f, M, w)) R[w][w] = true;
    return R;

  if (pr.p === "star") return starR(relProg(M, pr.a), M.n);
  if (pr.p === "seq") return compose(relProg(M, pr.a), relProg(M, pr.b), M.n);
  var A = relProg(M, pr.a), B = relProg(M, pr.b), U = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++) U[i][j] = A[i][j] || B[i][j];

}

function atomsOf(g, out){
  out = out || [];
  if (g.k === "atom"){ if (out.indexOf(g.n) < 0) out.push(g.n); }
  else if (g.k === "top" || g.k === "bot"){ /* none */ }
  else if (g.k === "not" || MODAL[g.k]){
    if (g.pr) progTests(g.pr).forEach(function(t){ atomsOf(t, out); });
    atomsOf(g.a, out);

}
function agentsOf(g, out){
  out = out || [];

  if (g.k === "atom" || g.k === "top" || g.k === "bot") return out;
  if (g.k === "not" || MODAL[g.k]){
    if (g.pr){
      progAtoms(g.pr).forEach(function(a){ if (out.indexOf(a) < 0) out.push(a); });
      progTests(g.pr).forEach(function(t){ agentsOf(t, out); });
    }
    return agentsOf(g.a, out);

  return out;
}
function eqF(a, b){
  if (a.k !== b.k) return false;
  if (a.k === "atom") return a.n === b.n;
  if (a.k === "top" || a.k === "bot") return true;
  if (a.k === "ka") return a.ag === b.ag && eqF(a.a, b.a);
  if (a.k === "box" || a.k === "dia"){
    if (!a.pr !== !b.pr) return false;
    if (a.pr && !eqProg(a.pr, b.pr)) return false;
    return eqF(a.a, b.a);
  }
  if (a.k === "not" || MODAL[a.k]) return eqF(a.a, b.a);
  return eqF(a.a, b.a) && eqF(a.b, b.b);
}
/* every subformula, innermost first, which is the order they get evaluated in */
function subsOf(g, out){
  out = out || [];
  if (g.k === "not" || MODAL[g.k]) subsOf(g.a, out);
  else if (g.k !== "atom" && g.k !== "top" && g.k !== "bot"){ subsOf(g.a, out); subsOf(g.b, out); }
  if (!out.some(function(x){ return eqF(x, g); })) out.push(g);
  return out;
}

/* ═════════════════════════════════════════════ parser */
var SYMS = [
  ["<->","iff"], ["<=>","iff"], ["↔","iff"], ["≡","iff"],
  ["->","imp"], ["=>","imp"], ["→","imp"], ["⊃","imp"],
  ["/\\","and"], ["&&","and"], ["∧","and"], ["&","and"], ["^","and"],
  ["\\/","or"], ["||","or"], ["∨","or"], ["|","or"],
  ["¬","not"], ["~","not"], ["!","not"],
  ["[]","box"], ["□","box"], ["<>","dia"], ["◇","dia"],
  ["⊤","top"], ["⊥","bot"], ["1","top"], ["0","bot"],
  ["(","lp"], [")","rp"],
  /* after the longer ones, so [] and <> still win: these open a program */
  ["[","lbox"], ["]","rbox"], ["⟨","lang"], ["<","lang"], ["⟩","rang"], [">","rang"],
  [";","seq"], ["∪","alt"], ["+","alt"], ["*","star"], ["?","test"]

/* K_a is one word to the tokeniser, which is exactly what makes it readable:
   the agent travels with the operator instead of being a separate token. */
function wordOp(v){
  var m = /^K_(.+)$/.exec(v);
  if (m) return {k:"ka", ag:m[1]};
  if (v === "E") return {k:"e"};
  if (v === "C") return {k:"c"};
  if (v === "D") return {k:"d"};
  return null;
}
function tokenize(src){
  var t = [], i = 0;
  outer: while (i < src.length){
    var c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[A-Za-z]/.test(c)){
      var j = i + 1;
      while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      t.push({t:"atom", v:src.slice(i, j), i:i}); i = j; continue;
    }
    for (var k = 0; k < SYMS.length; k++){
      if (src.startsWith(SYMS[k][0], i)){
        t.push({t:SYMS[k][1], v:SYMS[k][0], i:i}); i += SYMS[k][0].length; continue outer;
      }
    }
    throw new Error("I don’t recognise “" + c + "” at position " + (i + 1) + ".");
  }
  t.push({t:"end", v:"", i:src.length});
  return t;
}
function parse(src){
  if (!src.trim()) throw new Error("Nothing to evaluate — type a formula.");
  var t = tokenize(src), p = 0;
  function peek(){ return t[p].t; }
  function eat(k){ return t[p].t === k ? t[p++] : null; }
  function iff(){ var l = impR(); while (peek() === "iff"){ p++; l = {k:"iff", a:l, b:impR()}; } return l; }
  function impR(){ var l = or(); if (peek() === "imp"){ p++; return {k:"imp", a:l, b:impR()}; } return l; }
  function or(){ var l = and(); while (peek() === "or"){ p++; l = {k:"or", a:l, b:and()}; } return l; }
  function and(){ var l = un(); while (peek() === "and"){ p++; l = {k:"and", a:l, b:un()}; } return l; }
  /* a program: ∪ loosest, then ;, then * and ? tightest */
  function prog(){
    var l = pseq();
    while (peek() === "alt"){ p++; l = {p:"alt", a:l, b:pseq()}; }
    return l;
  }
  function pseq(){
    var l = pstar();
    while (peek() === "seq"){ p++; l = {p:"seq", a:l, b:pstar()}; }
    return l;
  }
  function pstar(){
    var l = patom();
    while (peek() === "star"){ p++; l = {p:"star", a:l}; }
    return l;
  }
  function patom(){
    if (eat("lp")){
      /* (…) is a sub-program, unless a ? follows, in which case what is in
         the brackets was a formula all along and this is a test */
      var save = p - 1;
      try {
        var x = prog();
        if (eat("rp")){
          if (eat("test")){ p = save; throw 0; }
          return x;
        }
        throw 0;
      } catch (e){
        p = save;
        if (!eat("lp")) throw new Error("A “(” in the program is never closed.");
        var f2 = iff();
        if (!eat("rp")) throw new Error("A “(” in the program is never closed.");
        if (!eat("test")) throw new Error("A bracketed formula in a program has to be a test — write (A)?");
        return {p:"test", f:f2};
      }
    }
    var a = eat("atom");
    if (!a) throw new Error("Expected an action or a test at position " + (t[p].i + 1) +
      ", found “" + t[p].v + "”. A program is built from the relation names with ; ∪ * and A?");
    if (eat("test")) return {p:"test", f:{k:"atom", n:a.v}};
    return {p:"atom", n:a.v};
  }
  function un(){
    if (peek() === "not"){ p++; return {k:"not", a:un()}; }
    if (peek() === "box"){ p++; return {k:"box", a:un()}; }
    if (peek() === "dia"){ p++; return {k:"dia", a:un()}; }
    if (peek() === "lbox"){
      p++; var pb = prog();
      if (!eat("rbox")) throw new Error("A “[” is never closed — write [a]A.");
      return {k:"box", pr:pb, a:un()};
    }
    if (peek() === "lang"){
      p++; var pd = prog();
      if (!eat("rang")) throw new Error("A “⟨” is never closed — write ⟨a⟩A.");
      return {k:"dia", pr:pd, a:un()};
    }
    if (peek() === "atom"){
      var op = wordOp(t[p].v);
      if (op){ p++; var node = {k:op.k, a:un()}; if (op.ag) node.ag = op.ag; return node; }
    }
    if (eat("top")) return {k:"top"};
    if (eat("bot")) return {k:"bot"};
    if (eat("lp")){ var f = iff(); if (!eat("rp")) throw new Error("A “(” is never closed — add the matching “)”."); return f; }
    var a = eat("atom");
    if (a){
      if (/^K$/.test(a.v))
        throw new Error("Write the agent on the K, as in <i>K_a</i> — that is how the operator says whose knowledge it is.");
      return {k:"atom", n:a.v};
    }
    if (peek() === "rp") throw new Error("There is a “)” with no “(” to match it.");
    if (peek() === "end") throw new Error("The formula stops early — something is missing after the last connective.");
    throw new Error("Expected a letter, a modality or “(” at position " + (t[p].i + 1) + ", found “" + t[p].v + "”.");
  }
  var f = iff();
  if (peek() !== "end") throw new Error("Unexpected “" + t[p].v + "” at position " + (t[p].i + 1) + " — is a connective missing?");
  return f;
}

/* ═════════════════════════════════════════════ structures */
/* Worlds 0…n−1, one relation per agent, and a valuation over the atoms. */
function newModel(n, agents){
  var M = {n:n, R:{}, V:{}};
  (agents || ["a"]).forEach(function(g){ M.R[g] = blank(n); });
  return M;
}
function blank(n){
  var R = [];
  for (var i = 0; i < n; i++){ R.push([]); for (var j = 0; j < n; j++) R[i].push(false); }
  return R;
}
function agentList(M){ return Object.keys(M.R); }
/* the derived relations: everyone, distributed, common */
function unionR(M){
  var ag = agentList(M), R = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++)
    R[i][j] = ag.some(function(g){ return M.R[g][i][j]; });
  return R;
}
function interR(M){
  var ag = agentList(M), R = blank(M.n);
  for (var i = 0; i < M.n; i++) for (var j = 0; j < M.n; j++)
    R[i][j] = ag.length > 0 && ag.every(function(g){ return M.R[g][i][j]; });
  return R;
}
/* common knowledge reaches along any chain of one arrow or more, so this is
   the transitive — not reflexive-transitive — closure of the union */
function closeR(R, n){
  var C = R.map(function(r){ return r.slice(); });
  for (var k = 0; k < n; k++) for (var i = 0; i < n; i++) for (var j = 0; j < n; j++)
    if (C[i][k] && C[k][j]) C[i][j] = true;
  return C;
}
function relOf(M, g){
  if ((g.k === "box" || g.k === "dia") && g.pr) return relProg(M, g.pr);
  if (g.k === "ka") return M.R[g.ag] || blank(M.n);
  if (g.k === "e") return unionR(M);
  if (g.k === "d") return interR(M);
  if (g.k === "c") return closeR(unionR(M), M.n);
  return M.R[agentList(M)[0]] || blank(M.n);     /* □ and ◇: the first agent */
}
function holdsAt(g, M, w){
  switch (g.k){
    case "atom": return !!(M.V[g.n] && M.V[g.n][w]);
    case "top":  return true;
    case "bot":  return false;
    case "not":  return !holdsAt(g.a, M, w);
    case "and":  return holdsAt(g.a, M, w) && holdsAt(g.b, M, w);
    case "or":   return holdsAt(g.a, M, w) || holdsAt(g.b, M, w);
    case "imp":  return !holdsAt(g.a, M, w) || holdsAt(g.b, M, w);
    case "iff":  return holdsAt(g.a, M, w) === holdsAt(g.b, M, w);
    case "dia": {
      var Rd = relOf(M, g);
      for (var v = 0; v < M.n; v++) if (Rd[w][v] && holdsAt(g.a, M, v)) return true;
      return false;
    }
    default: {                                   /* □, K_a, E, D, C all say "every" */
      var R = relOf(M, g);
      for (var u = 0; u < M.n; u++) if (R[w][u] && !holdsAt(g.a, M, u)) return false;

}
function succR(R, w, n){
  var out = [];
  for (var u = 0; u < n; u++) if (R[w][u]) out.push(u);

}
var WN = function(i){ return "w" + i; };

/* ── the frame conditions of lecture 10, per agent, each with a witness ── */
var FRAMES = [
  {k:"serial", law:"every world has a successor — the axiom D, □A ⊃ ◇A",
   test:function(R, n){
     for (var w = 0; w < n; w++) if (!R[w].some(Boolean)) return WN(w) + " has no successor";
     return null; }},
  {k:"reflexive", law:"every world sees itself — the axiom T, □A ⊃ A",
   test:function(R, n){
     for (var w = 0; w < n; w++) if (!R[w][w]) return WN(w) + " does not see itself";
     return null; }},
  {k:"transitive", law:"two steps are one — the axiom 4, □A ⊃ □□A",
   test:function(R, n){
     for (var a = 0; a < n; a++) for (var b = 0; b < n; b++) for (var c = 0; c < n; c++)
       if (R[a][b] && R[b][c] && !R[a][c])
         return WN(a) + "→" + WN(b) + "→" + WN(c) + " but not " + WN(a) + "→" + WN(c);
     return null; }},
  {k:"symmetric", law:"arrows come in pairs — the axiom B, A ⊃ □◇A",
   test:function(R, n){
     for (var a = 0; a < n; a++) for (var b = 0; b < n; b++)
       if (R[a][b] && !R[b][a]) return WN(a) + "→" + WN(b) + " but not back";
     return null; }},
  {k:"euclidean", law:"anything seen from one world sees the rest — the axiom 5, ◇A ⊃ □◇A",
   test:function(R, n){
     for (var a = 0; a < n; a++) for (var b = 0; b < n; b++) for (var c = 0; c < n; c++)
       if (R[a][b] && R[a][c] && !R[b][c])
         return WN(a) + "→" + WN(b) + " and " + WN(a) + "→" + WN(c) + " but not " + WN(b) + "→" + WN(c);
     return null; }}
];
function logicsOf(R, n){
  var has = {};
  FRAMES.forEach(function(f){ has[f.k] = f.test(R, n) === null; });
  var out = ["K"];
  if (has.serial) out.push("D");
  if (has.reflexive) out.push("T");
  if (has.reflexive && has.transitive) out.push("S4");
  if (has.reflexive && has.symmetric) out.push("B");
  if (has.reflexive && has.transitive && has.symmetric) out.push("S5");
  return out;
}

/* ── searching the valuations of a fixed frame ── */
var MAXBITS = 20;
function putVal(M, atoms, mask){
  atoms.forEach(function(a, ai){
    var row = [];
    for (var w = 0; w < M.n; w++) row.push(!!(mask & (1 << (ai * M.n + w))));
    M.V[a] = row;
  });
}
function grabVal(M, atoms){
  var mask = 0;
  atoms.forEach(function(a, ai){
    for (var w = 0; w < M.n; w++) if (M.V[a] && M.V[a][w]) mask |= (1 << (ai * M.n + w));
  });
  return mask;
}
function searchVals(M, atoms, each){
  var bits = atoms.length * M.n;
  if (bits > MAXBITS) return {toobig:bits};
  var keep = grabVal(M, atoms), total = 1 << bits, hit = null;
  for (var m = 0; m < total && !hit; m++){
    putVal(M, atoms, m);
    if (each(M, m)) hit = m;
  }
  putVal(M, atoms, keep);
  return {hit:hit, total:total};
}

function build(src){

  catch (e){ if (LOG_READY) logFormula({f:src, err:"parse"}); say("err", e.message); return; }
  var want = agentsOf(f), have = agentList(S.M);
  var missing = want.filter(function(g){ return have.indexOf(g) < 0; });
  if (missing.length){
    say("err", "That formula names " + missing.map(function(g){ return "<i>" + g + "</i>"; }).join(", ") +
        ", but the structure has " + (have.length === 1 ? "only the agent " : "the agents ") +
        have.map(function(g){ return "<i>" + g + "</i>"; }).join(", ") +
        ". Add the agent with <b>+ agent</b> first.");
    return;
  }
  if (LOG_READY) logFormula({f:src});
  S.f = f;
  atomsOf(f).forEach(function(a){
    if (S.atoms.indexOf(a) < 0 && S.atoms.length < MAXA){ S.atoms.push(a); S.M.V[a] = null; }
  });
  S.atoms.forEach(function(a){
    if (!S.M.V[a]){ var r = []; for (var w = 0; w < S.M.n; w++) r.push(false); S.M.V[a] = r; }
  });
  var yes = [];
  for (var w = 0; w < S.M.n; w++) if (holdsAt(f, S.M, w)) yes.push(WN(w));
  say(yes.length ? "ok" : "", fh(f) + " is true " +
      (yes.length === S.M.n ? "in <b>every</b> world, so the structure satisfies it"
       : yes.length ? "in " + yes.map(function(x){ return "<b>" + x + "</b>"; }).join(", ")
       : "in <b>no</b> world") + ". Drag between worlds to change the arrows, click a letter to flip it.");
  draw();
}

/* ═════════════════════════════════════════════ editing the structure */
function reshape(n){
  var M = S.M;
  agentList(M).forEach(function(g){
    var old = M.R[g], R = [];
    for (var i = 0; i < n; i++){
      R.push([]);
      for (var j = 0; j < n; j++) R[i].push(i < M.n && j < M.n ? old[i][j] : false);
    }
    M.R[g] = R;
  });
  M.n = n;
  S.atoms.forEach(function(a){
    var row = M.V[a] || [];
    while (row.length < n) row.push(false);
    M.V[a] = row.slice(0, n);
  });
  if (S.sel >= n) S.sel = n - 1;
}
function act(what){
  var M = S.M;
  if (what === "add"){
    if (M.n >= MAXW){ say("err", "That is as many worlds as this page draws — " + MAXW + "."); return; }
    snapshot(); reshape(M.n + 1); S.sel = M.n - 1;
    say("ok", "World <b>" + WN(M.n - 1) + "</b> added, with no arrows and every letter false.");
  } else if (what === "del"){
    if (M.n <= 1){ say("err", "A frame needs at least one world."); return; }
    snapshot();
    var d = S.sel;
    agentList(M).forEach(function(g){
      M.R[g].splice(d, 1);
      M.R[g].forEach(function(row){ row.splice(d, 1); });
    });
    S.atoms.forEach(function(a){ M.V[a].splice(d, 1); });
    if (S.pos) S.pos.splice(d, 1);
    M.n--;
    if (S.sel >= M.n) S.sel = M.n - 1;
    say("ok", "World removed. The rest keep their arrows, renumbered.");
  } else if (what === "agadd"){
    var free = AGNAMES.filter(function(g){ return agentList(M).indexOf(g) < 0; });
    if (!free.length){ say("err", "Four agents is as many as this page draws."); return; }
    snapshot();
    M.R[free[0]] = blank(M.n);
    S.ag = free[0];
    say("ok", "Agent <b>" + free[0] + "</b> added, with no arrows of its own yet. Its arrows are the ones " +
        "<i>K_" + free[0] + "</i> looks along; <b>E</b>, <b>D</b> and <b>C</b> now count it in.");
  } else if (what === "agdel"){
    if (agentList(M).length <= 1){ say("err", "A structure needs at least one agent."); return; }
    snapshot();
    delete M.R[S.ag];
    S.ag = agentList(M)[0];
    say("ok", "Agent removed. <b>E</b>, <b>D</b> and <b>C</b> are now over " +
        agentList(M).map(function(g){ return "<i>" + g + "</i>"; }).join(", ") + ".");
  } else if (what === "noedge"){
    snapshot();
    M.R[S.ag] = blank(M.n);
    say("ok", "Every arrow of <b>" + S.ag + "</b> removed — so <i>K_" + S.ag + "</i>A now holds everywhere.");
  } else if (what === "refl"){
    snapshot();
    for (var k = 0; k < M.n; k++) M.R[S.ag][k][k] = true;
    say("ok", "A loop at every world for <b>" + S.ag + "</b>. That relation is now <b>reflexive</b>, which " +
        "is the truth axiom: what " + S.ag + " knows is so.");
  } else if (what === "close4"){
    snapshot();
    var R4 = M.R[S.ag], added = 0;
    for (var g = 0; g < M.n; g++)
      for (var a = 0; a < M.n; a++) for (var b = 0; b < M.n; b++) for (var c = 0; c < M.n; c++)
        if (R4[a][b] && R4[b][c] && !R4[a][c]){ R4[a][c] = true; added++; }
    say("ok", added ? plural(added, "arrow") + " added for <b>" + S.ag + "</b> — that relation is now " +
          "<b>transitive</b>, which is positive introspection: " + S.ag + " knows what " + S.ag + " knows."
                    : "Nothing to add: " + S.ag + "’s relation was already transitive.");
  } else if (what === "closeB"){
    snapshot();
    var RB = M.R[S.ag], n2 = 0;
    for (var x = 0; x < M.n; x++) for (var y = 0; y < M.n; y++)
      if (RB[x][y] && !RB[y][x]){ RB[y][x] = true; n2++; }
    say("ok", n2 ? plural(n2, "arrow") + " added for <b>" + S.ag + "</b> — that relation is now <b>symmetric</b>."
                 : "Nothing to add: " + S.ag + "’s relation was already symmetric.");
  } else if (what === "tidy"){
    S.moved = false; S.pos = null;
    say("", "Worlds put back on a circle. Nothing about the structure changed — where they sit is only " +
        "a picture of it.");
  } else if (what === "findval"){ findVal(); return; }
  else if (what === "frame"){ frameValid(); return; }
  draw();
}
function toggleEdge(a, b){
  snapshot();
  var R = S.M.R[S.ag];
  R[a][b] = !R[a][b];
  say("ok", (R[a][b] ? "Arrow " : "Arrow removed: ") + "<b>" + WN(a) + " →" +
      (agentList(S.M).length > 1 ? "<sub>" + S.ag + "</sub>" : "") + " " + WN(b) + "</b>" +
      (a === b ? " — a loop, so " + WN(a) + " is among its own " + S.ag + "-successors." : "."));
  draw();
}
function pickAgent(g){
  S.ag = g;
  say("", "Drawing arrows for <b>" + g + "</b> now. Its arrows are what <i>K_" + g + "</i> looks along.");
  draw();
}
function toggleAtom(w, a){
  snapshot();
  S.M.V[a][w] = !S.M.V[a][w];
  say("ok", "<i>" + a + "</i> is now <b>" + (S.M.V[a][w] ? "true" : "false") + "</b> at " + WN(w) + ".");
  draw();
}

/* ═════════════════════════════════════════════ the two questions */
function findVal(){
  if (!S.f){ say("err", "Enter a formula first."); return; }
  var at = atomsOf(S.f);
  if (!at.length){
    say(holdsAt(S.f, S.M, S.sel) ? "ok" : "err", fh(S.f) + " has no letters in it, so the valuation " +
        "cannot matter: it is " + (holdsAt(S.f, S.M, S.sel) ? "true" : "false") + " at " + WN(S.sel) +
        " on this frame whatever you do.");
    return;
  }
  var w = S.sel;
  var r = searchVals(S.M, at, function(M){ return holdsAt(S.f, M, w); });
  if (r.toobig){ say("err", tooBig(r.toobig)); return; }
  if (r.hit === null){
    say("err", "<b>No valuation works.</b> Over this frame, " + fh(S.f) + " is false at " + WN(w) +
        " under all " + r.total + " valuations of " + at.map(function(a){ return "<i>" + a + "</i>"; }).join(", ") +
        ". So ¬" + fmtText(S.f) + " is valid at " + WN(w) + " on this frame — change the arrows, not the letters.");
    return;
  }
  snapshot();
  putVal(S.M, at, r.hit);
  say("ok", "<b>Found one.</b> With this valuation " + fh(S.f) + " is true at " + WN(w) +
      ". It is the first of " + r.total + " tried; others may work too.");
  draw();
}
function frameValid(){
  if (!S.f){ say("err", "Enter a formula first."); return; }
  var at = atomsOf(S.f), bad = null;
  var r = searchVals(S.M, at, function(M, m){
    for (var w = 0; w < M.n; w++) if (!holdsAt(S.f, M, w)){ bad = {m:m, w:w}; return true; }
    return false;
  });
  if (r.toobig){ say("err", tooBig(r.toobig)); return; }
  if (!bad){
    say("ok", "<b>Valid on this frame.</b> " + fh(S.f) + " is true in every world under every one of the " +
        r.total + " valuation" + (r.total === 1 ? "" : "s") + " of " +
        (at.length ? at.map(function(a){ return "<i>" + a + "</i>"; }).join(", ") : "no letters") +
        ". " + (agentList(S.M).length > 1
          ? agentList(S.M).map(function(g){
              return "<i>" + g + "</i> is " + logicsOf(S.M.R[g], S.M.n).join(", "); }).join("; ")
          : "The frame is " + logicsOf(S.M.R[agentList(S.M)[0]], S.M.n).join(", ")) + ".");
    return;
  }
  /* Validity on a frame is "every world, every valuation", but an exercise
     often asks only about one world. Both answers are worth having, and the
     second is the interesting one when the first is no. */
  var here = null, w0 = S.sel;
  searchVals(S.M, at, function(M, m){ if (!holdsAt(S.f, M, w0)){ here = m; return true; } return false; });
  snapshot();
  putVal(S.M, at, here === null ? bad.m : here);
  if (here === null){
    say("", "<b>Not valid on this frame</b> — it fails at " + WN(bad.w) + " under some valuation. But it " +
        "<b>is</b> true at <b>" + WN(w0) + "</b> under every one of the " + r.total +
        " valuations, which is what an exercise about one world is asking.");
  } else {
    S.sel = bad.w;
    say("err", "<b>Not valid on this frame.</b> This valuation makes " + fh(S.f) + " false at <b>" +
        WN(bad.w) + "</b> — it is loaded now, so you can see why in the panel.");
  }
  draw();
}
function tooBig(bits){
  return "That is 2<sup>" + bits + "</sup> valuations to try, past what this page will sit through. " +
    "Use fewer worlds or fewer letters — " + MAXBITS + " bits is the limit.";
}

/* ═════════════════════════════════════════════ drawing */
var BW = 76, BH = 50;
function boxW(){ return Math.max(BW, 22 + 15 * S.atoms.length); }
/* Positions are the student's to arrange. They start on a circle and stay
   wherever they are put; "tidy" puts them back. Nothing about the logic
   depends on them, which is why they are not in the structure's text form. */
function ensurePos(){
  var svg = $("#svg");
  var W = svg.clientWidth || 560, H = svg.clientHeight || 420;
  var base = layout(S.M.n, W, H);
  if (!S.pos || !S.moved){ S.pos = base; return; }
  while (S.pos.length < S.M.n) S.pos.push(base[S.pos.length % base.length]);
  if (S.pos.length > S.M.n) S.pos.length = S.M.n;
  /* a narrower window must not leave a world off the edge */
  S.pos = S.pos.map(clampPos);
}
function clampPos(p){
  var svg = $("#svg"), W = svg.clientWidth || 560, H = svg.clientHeight || 420;
  var bw = boxW() / 2 + 2, bh = BH / 2 + 24;     /* room above for a self-loop */
  return {x:Math.max(bw, Math.min(W - bw, p.x)), y:Math.max(bh, Math.min(H - BH / 2 - 2, p.y))};
}
function worldAt(x, y){
  var bw = boxW() / 2, bh = BH / 2;
  for (var i = S.M.n - 1; i >= 0; i--){
    var p = S.pos[i];
    if (Math.abs(x - p.x) <= bw && Math.abs(y - p.y) <= bh) return i;
  }
  return null;
}
function svgXY(e){
  var r = $("#svg").getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top};
}
function layout(n, W, H){
  var cx = W / 2, cy = H / 2;
  if (n === 1) return [{x:cx, y:cy}];
  var r = Math.max(60, Math.min(W - boxW() - 36, H - BH - 36) / 2);
  var out = [];
  for (var i = 0; i < n; i++){
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    out.push({x:cx + r * Math.cos(a), y:cy + r * Math.sin(a)});
  }
  return out;
}
/* where the straight line from p towards (dx,dy) leaves p's box */
function rim(p, dx, dy){
  var w = boxW() / 2 + 4, h = BH / 2 + 4;
  var sx = dx === 0 ? Infinity : w / Math.abs(dx);
  var sy = dy === 0 ? Infinity : h / Math.abs(dy);
  var s = Math.min(sx, sy);
  return {x:p.x + dx * s, y:p.y + dy * s};
}
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function draw(){
  drawAgents();
  drawGraph();
  drawSide();
}
function drawAgents(){
  var ags = agentList(S.M);
  $("#agents").innerHTML = ags.map(function(g, gi){
    return '<button type="button" class="agbtn ag' + gi + (g === S.ag ? " on" : "") +
      '" data-agent="' + g + '" title="Draw arrows for ' + g + ", which is what K_" + g +
      ' looks along">' + g + "</button>";
  }).join("") +
    '<button type="button" class="rule" data-act="agadd" title="Add another agent">+ agent</button>' +
    (ags.length > 1
      ? '<button type="button" class="rule" data-act="agdel" title="Remove the selected agent">− agent</button>'
      : "");
}
function drawGraph(){
  var svg = $("#svg"), M = S.M;
  ensurePos();
  var pos = S.pos, bw = boxW();
  var AGC = ["var(--ink-2)", "var(--open)", "var(--closed)", "var(--error)"];
  var out = "<defs>";
  for (var mi = 0; mi < 4; mi++){
    out += '<marker id="ah' + mi + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" ' +
      'markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + AGC[mi] +
      '"/></marker>' +
      '<marker id="ah' + mi + 'h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" ' +
      'markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>' +
      "</marker>";
  }
  out += "</defs>";
  /* Arrows first, so the boxes sit on top of them. Each agent gets its own
     colour and its own bow, so two agents' arrows between the same pair of
     worlds stay apart instead of lying on top of one another. */
  var ags = agentList(M), many = ags.length > 1;
  ags.forEach(function(g, gi){
    var R = M.R[g];
    for (var a = 0; a < M.n; a++) for (var b = 0; b < M.n; b++){
      if (!R[a][b]) continue;
      var live = a === S.sel && g === S.ag;
      var cls = "edge ag" + gi + (live ? " hot" : ""), mk = "ah" + gi + (live ? "h" : "");
      if (a === b){
        var p = pos[a], top = p.y - BH / 2 - 2, sp = gi * 9;
        out += '<path class="' + cls + '" marker-end="url(#' + mk + ')" d="M' + (p.x - 13 - sp) + "," + top +
          " C" + (p.x - 24 - sp * 1.6) + "," + (top - 34 - sp * 1.5) + " " +
          (p.x + 24 + sp * 1.6) + "," + (top - 34 - sp * 1.5) + " " + (p.x + 11 + sp) + "," + top + '"/>';
        if (many) out += '<text class="agl ag' + gi + '" x="' + (p.x + 22 + sp * 1.6) + '" y="' +
          (top - 20 - sp) + '">' + g + "</text>";
        continue;
      }
      var pa = pos[a], pb = pos[b];
      var vx = pb.x - pa.x, vy = pb.y - pa.y, L = Math.sqrt(vx * vx + vy * vy) || 1;
      var ux = vx / L, uy = vy / L;
      var bow = (R[b][a] ? 20 : 0) + gi * 22;
      var st = rim(pa, ux, uy), en = rim(pb, -ux, -uy);
      var mx = (st.x + en.x) / 2 - uy * bow, my = (st.y + en.y) / 2 + ux * bow;
      out += '<path class="' + cls + '" marker-end="url(#' + mk + ')" d="M' + st.x + "," + st.y +
        " Q" + mx + "," + my + " " + en.x + "," + en.y + '"/>';
      if (many) out += '<text class="agl ag' + gi + '" x="' + ((st.x + en.x) / 2 - uy * bow * 0.56) +
        '" y="' + ((st.y + en.y) / 2 + ux * bow * 0.56 + 4) + '">' + g + "</text>";
    }
  });
  for (var i = 0; i < M.n; i++){
    var p = pos[i], val = S.f ? holdsAt(S.f, M, i) : null;
    var cls2 = "wbox" + (i === S.sel ? " sel" : "") + (val === true ? " yes" : val === false ? " no" : "");
    out += '<g class="' + cls2 + '" data-w="' + i + '">' +
      '<rect x="' + (p.x - bw / 2) + '" y="' + (p.y - BH / 2) + '" width="' + bw + '" height="' + BH +
      '" rx="9"/>' +
      '<text class="wn" x="' + (p.x - bw / 2 + 8) + '" y="' + (p.y - BH / 2 + 15) + '">' + WN(i) + "</text>";
    if (val !== null)
      out += '<text class="verd ' + (val ? "yes" : "no") + '" x="' + (p.x + bw / 2 - 8) + '" y="' +
        (p.y - BH / 2 + 15) + '" text-anchor="end">' + (val ? "T" : "F") + "</text>";
    S.atoms.forEach(function(at, ai){
      var ax = p.x - bw / 2 + 13 + ai * 15, on = !!(M.V[at] && M.V[at][i]);
      out += '<g data-atom="' + esc(at) + '" data-w="' + i + '">' +
        '<rect x="' + (ax - 7) + '" y="' + (p.y - 2) + '" width="14" height="19" fill="transparent"/>' +
        '<text class="atom ' + (on ? "on" : "off") + '" x="' + ax + '" y="' + (p.y + 13) +
        '" text-anchor="middle">' + esc(at) + "</text></g>";
    });
    out += '<circle class="hdlhit" data-hdl="' + i + '" cx="' + (p.x + bw / 2) + '" cy="' + p.y +
      '" r="11" fill="transparent"/>' +
      '<circle class="hdl" data-hdl="' + i + '" cx="' + (p.x + bw / 2) + '" cy="' + p.y + '" r="4.5"/>';
    out += "</g>";
  }
  if (S.link){
    var lp = pos[S.link.from];
    out += '<path class="edge ghost" marker-end="url(#ah2)" d="M' + lp.x + "," + lp.y +
      " L" + S.link.x + "," + S.link.y + '"/>';
  }
  svg.innerHTML = out;
  var tot = ags.reduce(function(t, g){
    return t + M.R[g].reduce(function(u, r){ return u + r.filter(Boolean).length; }, 0); }, 0);
  $("#mdesc").textContent = "— " + plural(M.n, "world") + ", " + plural(tot, "arrow") +
    (many ? ", " + plural(ags.length, "agent") : "");
  $("#ghint").innerHTML = "<b>Drag a world</b> to move it. <b>Drag from the dot</b> on its right edge onto " +
    "another world to add or remove an arrow — onto itself for a loop. Click a world to inspect it, a " +
    "letter to flip it." + (many ? " Arrows are drawn for the agent picked above, <b>" + S.ag + "</b>." : "");
}
function drawSide(){
  var M = S.M, h = "", w = S.sel, ags = agentList(M), many = ags.length > 1;
  h += '<span class="ph">Frame conditions' + (many ? ", per agent" : "") + "</span>";
  ags.forEach(function(g, gi){
    h += '<div class="chips">' + (many ? '<span class="agtag ag' + gi + '">' + g + "</span>" : "");
    FRAMES.forEach(function(F){
      var bad = F.test(M.R[g], M.n);
      h += '<span class="chip2' + (bad ? "" : " on") + '" title="' + esc(F.law) +
        (bad ? " — fails: " + esc(bad) : "") + '">' + F.k + "</span>";
    });
    h += "</div>";
  });
  h += '<p class="note" style="margin-top:9px">' + (many
    ? ags.map(function(g){ return "<i>" + g + "</i> is " + logicsOf(M.R[g], M.n).join(", "); }).join("; ") +
      ". Knowledge wants reflexive, transitive and euclidean — an equivalence."
    : "This frame is a frame of <b>" + logicsOf(M.R[ags[0]], M.n).join(", ") + "</b>") +
    " Hover a condition that is off to see which worlds break it.</p>";

  h += '<span class="ph">' + WN(w) + "</span>";
  ags.forEach(function(g){
    var sc = succ(M, g, w);
    h += '<p class="note">' + (many ? "<i>" + g + "</i> sees " : "Sees ") +
      (sc.length ? sc.map(WN).join(", ")
                 : "<b>nothing</b> — so " + (many ? "<i>K_" + g + "</i>A" : "□A") + " is true here for every A") +
      ".</p>";
  });
  if (many){
    var U = unionR(M), I = interR(M), Cc = closeR(U, M.n);
    h += '<p class="note">everyone <b>E</b> ' + (succR(U, w, M.n).map(WN).join(", ") || "nothing") +
      " · distributed <b>D</b> " + (succR(I, w, M.n).map(WN).join(", ") || "nothing") +
      " · common <b>C</b> " + (succR(Cc, w, M.n).map(WN).join(", ") || "nothing") + "</p>";
  }

  if (S.f){
    var prs = progsIn(S.f);
    if (prs.length){
      h += '<span class="ph">What each program reaches, from ' + WN(w) + "</span>";
      prs.forEach(function(pr){
        var R = relProg(M, pr), to = succR(R, w, M.n);
        h += '<p class="note"><span class="f">' + progHTML(pr) + "</span> → " +
          (to.length ? to.map(WN).join(", ") : "<b>nowhere</b>") + "</p>";
      });
    }
  }
  if (!S.f){ h += '<p class="none2">Enter a formula to see it evaluated here.</p>'; }
  else {
    h += '<span class="ph">Why, at ' + WN(w) + "</span><table class=\"sub\">";
    var subs = subsOf(S.f);
    subs.forEach(function(g, i){
      var v = holdsAt(g, M, w);
      h += '<tr' + (i === subs.length - 1 ? ' class="top"' : "") + '><td><span class="f">' +
        fmtHTML(g) + '</span></td><td class="v ' + (v ? "t" : "f") + '">' + (v ? "true" : "false") + "</td></tr>";
      if (MODAL[g.k]){
        var ss = succR(relOf(M, g), w, M.n);
        var every = g.k !== "dia";
        h += '<tr><td colspan="2" class="none2" style="padding-left:14px">' +
          (ss.length
            ? (every ? "every" : "some") + " " + relName(g) + ": " + ss.map(function(u){
                return WN(u) + " " + (holdsAt(g.a, M, u) ? "✓" : "✗"); }).join(", ")
            : "no " + relName(g) + ", so " + (every ? "vacuously true" : "nothing to witness it")) +
          "</td></tr>";
      }
    });
    h += "</table>";
  }
  h += '<span class="ph">This structure, in text</span>' +
    '<div class="srow"><input type="text" id="mtext" spellcheck="false" autocomplete="off" value="' +
    esc(modelText()) + '"><button type="button" class="rule" data-act="load">load</button></div>' +
    '<p class="none2" style="margin-top:6px">Paste a structure here to set it up at once.</p>';
  $("#side").innerHTML = h;
}
/* every distinct program the formula mentions */
function progsIn(g, out){
  out = out || [];
  if (g.k === "atom" || g.k === "top" || g.k === "bot") return out;
  if ((g.k === "box" || g.k === "dia") && g.pr){
    if (!out.some(function(x){ return eqProg(x, g.pr); })) out.push(g.pr);
    progTests(g.pr).forEach(function(t){ progsIn(t, out); });
  }
  if (g.k === "not" || MODAL[g.k]) return progsIn(g.a, out);
  progsIn(g.a, out); progsIn(g.b, out);
  return out;
}

/* what the arrows a modality looks along are called, in words */
function relName(g){
  if ((g.k === "box" || g.k === "dia") && g.pr) return "world the program reaches";
  if (g.k === "ka") return g.ag + "-successor";
  if (g.k === "e") return "successor of any agent";
  if (g.k === "d") return "successor of every agent";
  if (g.k === "c") return "world reachable by a chain";
  return "successor";
}

/* a compact, pasteable form of the structure */
function modelText(){
  var M = S.M, ags = agentList(M), many = ags.length > 1;
  var rs = ags.map(function(g){
    var es = [];
    for (var a = 0; a < M.n; a++) for (var b = 0; b < M.n; b++) if (M.R[g][a][b]) es.push(a + ">" + b);
    return "R" + (many ? g : "") + "=" + es.join(",");
  });
  var vs = S.atoms.map(function(at){
    var ws = [];
    for (var w = 0; w < M.n; w++) if (M.V[at] && M.V[at][w]) ws.push(w);
    return at + "=" + ws.join(",");
  });
  return "W=" + M.n + "; " + rs.join("; ") + (vs.length ? "; " + vs.join("; ") : "");
}
function loadModel(src){
  try {
    var parts = src.split(";").map(function(s){ return s.trim(); }).filter(Boolean);
    var n = null, es = [], vs = {}, ags = [];
    parts.forEach(function(p){
      var m = p.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/);
      if (!m) throw new Error("“" + p + "” is not a <i>name</i>=<i>value</i> part.");
      var key = m[1], val = m[2].trim();
      if (key === "W"){ n = parseInt(val, 10); if (!(n >= 1 && n <= MAXW)) throw new Error("W must be between 1 and " + MAXW + "."); }
      else if (key.charAt(0) === "R" && (key.length === 1 || AGNAMES.indexOf(key.slice(1)) >= 0)){
        var who = key.length === 1 ? "a" : key.slice(1);   /* bare R is the first agent */
        val.split(",").map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(e){
          var q = e.split(">");
          if (q.length !== 2) throw new Error("“" + e + "” is not an arrow — write it as 0&gt;1.");
          es.push([parseInt(q[0], 10), parseInt(q[1], 10), who]);
        });
        if (ags.indexOf(who) < 0) ags.push(who);
      } else {
        vs[key] = val.split(",").map(function(s){ return s.trim(); }).filter(Boolean)
                     .map(function(s){ return parseInt(s, 10); });
      }
    });
    if (n === null) throw new Error("Say how many worlds, as W=3.");
    if (!ags.length) ags = ["a"];
    var M = newModel(n, ags);
    es.forEach(function(e){
      if (!(e[0] >= 0 && e[0] < n && e[1] >= 0 && e[1] < n))
        throw new Error("Arrow " + e[0] + "&gt;" + e[1] + " mentions a world outside 0…" + (n - 1) + ".");
      M.R[e[2]][e[0]][e[1]] = true;
    });
    var atoms = S.atoms.slice();
    Object.keys(vs).forEach(function(a){ if (atoms.indexOf(a) < 0 && atoms.length < MAXA) atoms.push(a); });
    atoms.forEach(function(a){
      var row = [];
      for (var w = 0; w < n; w++) row.push((vs[a] || []).indexOf(w) >= 0);
      M.V[a] = row;
    });
    snapshot();
    S.M = M; S.atoms = atoms; S.sel = 0; S.pos = null; S.moved = false; S.ag = ags[0];
    say("ok", "Structure loaded: " + plural(n, "world") + ", " + plural(es.length, "arrow") +
        (ags.length > 1 ? ", " + plural(ags.length, "agent") : "") + ".");
    draw();
  } catch (e){ say("err", e.message); }
}

/* ═════════════════════════════════════════════ connective pad */
var caret = null;
function rememberCaret(){
  var el = $("#formula");
  if (el.selectionStart !== null) caret = [el.selectionStart, el.selectionEnd];
}
["input","click","keyup","select","blur"].forEach(function(ev){
  $("#formula").addEventListener(ev, rememberCaret);
});
function insertSym(ch){
  var el = $("#formula"), v = el.value, a, b;
  if (document.activeElement === el && el.selectionStart !== null){ a = el.selectionStart; b = el.selectionEnd; }
  else if (caret){ a = caret[0]; b = caret[1]; }
  if (a === undefined || a === null){ a = b = v.length; }
  el.value = v.slice(0, a) + ch + v.slice(b);
  var pos = a + ch.length;
  caret = [pos, pos];
  el.focus();
  try { el.setSelectionRange(pos, pos); } catch (e){}
}
$("#pad").addEventListener("mousedown", function(e){
  if (e.target.closest("[data-sym]")) e.preventDefault();
});

/* ═════════════════════════════════════════════ wiring */
/* Two gestures on the same shape. Dragging a world moves it, which is only a
   picture; dragging from its handle draws an arrow, which is the structure. A
   drag that never travelled selects instead, so a click still works. */
var drag = null;
$("#svg").addEventListener("pointerdown", function(e){
  var atom = e.target.closest && e.target.closest("[data-atom]");
  if (atom){ toggleAtom(+atom.getAttribute("data-w"), atom.getAttribute("data-atom")); e.preventDefault(); return; }
  var hdl = e.target.closest && e.target.closest("[data-hdl]");
  var at = svgXY(e);
  if (hdl){
    drag = {mode:"link", from:+hdl.getAttribute("data-hdl"), x0:at.x, y0:at.y, far:false};
  } else {
    var w = worldAt(at.x, at.y);
    if (w === null) return;
    drag = {mode:"move", from:w, x0:at.x, y0:at.y, far:false,
            dx:S.pos[w].x - at.x, dy:S.pos[w].y - at.y};
  }
  try { $("#svg").setPointerCapture(e.pointerId); } catch (x){}
  e.preventDefault();
});
$("#svg").addEventListener("pointermove", function(e){
  if (!drag) return;
  var at = svgXY(e);
  if (Math.abs(at.x - drag.x0) + Math.abs(at.y - drag.y0) > 5) drag.far = true;
  if (!drag.far) return;
  if (drag.mode === "move"){
    S.moved = true;
    S.pos[drag.from] = clampPos({x:at.x + drag.dx, y:at.y + drag.dy});
  } else {
    S.link = {from:drag.from, x:at.x, y:at.y};
  }
  drawGraph();
});
$("#svg").addEventListener("pointerup", function(e){
  if (!drag) return;
  var d = drag, at = svgXY(e);
  drag = null; S.link = null;
  try { $("#svg").releasePointerCapture(e.pointerId); } catch (x){}
  if (d.mode === "link"){
    var to = worldAt(at.x, at.y);
    if (to === null){ drawGraph(); say("", "Arrow dropped on empty space — nothing changed."); return; }
    toggleEdge(d.from, to);
    return;
  }
  if (!d.far){ S.sel = d.from; say("", "Looking at " + WN(d.from) + "."); draw(); return; }
  drawGraph();
});
$("#svg").addEventListener("pointercancel", function(){ drag = null; S.link = null; drawGraph(); });

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-sym],[data-act],[data-agent]");
  if (!t) return;
  if (t.hasAttribute("data-sym")){ insertSym(t.dataset.sym); return; }
  if (t.hasAttribute("data-agent")){ pickAgent(t.dataset.agent); return; }
  if (t.dataset.act === "load"){ loadModel($("#mtext").value); return; }
  act(t.dataset.act);
});
$("#entry").addEventListener("submit", function(e){ e.preventDefault(); build($("#formula").value); });
$("#undo").addEventListener("click", undo);
$("#reset").addEventListener("click", function(){
  snapshot();
  S.M = newModel(3); S.atoms = ["p"]; S.M.V.p = [false, false, false]; S.sel = 0; S.f = null; S.ag = "a";
  say("", "Back to three worlds, no arrows, everything false.");
  draw();
});
document.addEventListener("keydown", function(e){
  if (e.target.tagName === "INPUT") return;
  if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)){ e.preventDefault(); undo(); }
});
window.addEventListener("resize", function(){ drawGraph(); });

/* A structure can arrive in the URL — that is how the tableaux page hands
   over the countermodel it found, so the two tools join up. */
function fromHash(){
  var h = "";
  try { h = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (e){ return false; }
  if (!/^\s*W\s*=/.test(h)) return false;
  loadModel(h);          /* which reports its own trouble if the text is bad */
  return true;
}

/* the structure of harj6 question 1, as a place to start from */
S.M = newModel(5);
[[0,1],[0,2],[1,0],[1,3],[2,1],[2,3],[2,4],[3,2]].forEach(function(e){ S.M.R.a[e[0]][e[1]] = true; });
S.atoms = ["p", "q"];
S.M.V.p = [true, false, true, false, true];
S.M.V.q = [true, true, false, true, true];
draw();
build($("#formula").value);
if (fromHash()){
  var was = $("#status .msg").innerHTML;
  say("ok", was + " Enter the formula it was a countermodel for and press <b>Evaluate</b>.");
  draw();
}
window.addEventListener("hashchange", function(){ if (fromHash()) draw(); });
LOG_READY = true;

/* ── theme toggle ─────────────────────────────────────── */
function themeNow(){
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  catch (e){ return "light"; }
}
function syncTheme(){
  var b = document.getElementById("themeBtn"), next = themeNow() === "dark" ? "light" : "dark";
  b.title = "Switch to the " + next + " theme";
  b.setAttribute("aria-label", b.title);
}
document.getElementById("themeBtn").addEventListener("click", function(){
  var next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("logic.theme", next); } catch (e){}
  syncTheme();
});
syncTheme();
</script>
